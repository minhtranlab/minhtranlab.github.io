  'shoes.2': [`You crouch down, slip both shoes on in ten seconds, and pick {name} up. {name} protests for a moment, then forgets. You are on time. The next morning {name} sits on the step and holds out a foot, waiting.`,
              `Bạn ngồi xuống, loáng cái đã đi xong cả hai chiếc giày rồi bế {name} lên. {name} phản đối một chút rồi quên ngay. Bạn đến kịp giờ. Sáng hôm sau, {name} lại ngồi ở bậc cửa, chìa chân chờ bạn.`],
  'classes4.0': [`You sign {name} up for three classes after school: English, "thinking maths" and a piano class. {name} learns a lot and shows it off to every visitor. The afternoons of playing downstairs with the neighbours' kids are over, and on some mornings {name} cries at the classroom door.`,
                 `Bạn cho {name} đi ba lớp ngoài giờ: tiếng Anh, toán tư duy và một lớp đàn. {name} học được nhiều thứ, ai đến chơi cũng khoe. Những buổi chiều chơi dưới sân với lũ trẻ hàng xóm không còn nữa, có hôm {name} còn khóc ngay trước cửa lớp.`],
  'classes4.1': [`You tell the relatives: "Next year." {name} spends the afternoons downstairs, building dens out of cardboard and collecting snails. At six, in first grade, some classmates can already read whole sentences and {name} can't. It takes {name} a term to catch up.`,
                 `Bạn bảo họ hàng: "Để sang năm nhé." Cả chiều, {name} chơi dưới sân, dựng lều bằng thùng các-tông, đi bắt ốc sên. Vào lớp 1, vài bạn đã đọc được cả câu, còn {name} thì chưa. Phải mất một học kỳ, {name} mới theo kịp các bạn.`],
  'classes4.2': [`You show {name} a few leaflets and let {name} choose one class. {name} picks swimming and talks about it all week. The first lesson is cold and scary, but {name} wants to go back. At family lunch, someone still asks why {name} isn't doing English yet.`,
                 `Bạn đưa {name} xem mấy tờ giới thiệu rồi để con tự chọn một lớp. {name} chọn bơi, rồi suốt cả tuần cứ nhắc đến lớp học. Buổi đầu, nước lạnh, con hơi sợ nhưng vẫn đòi đi tiếp. Trong bữa cơm họ hàng, vẫn có người hỏi sao chưa cho {name} học tiếng Anh.`],
  'newjob.0': [`You take the lower-paid job. Money is tighter from now on. But you are home by six, there is time for dinner together and a story, and you stop answering emails in bed.`,
               `Bạn chuyển sang chỗ làm có lương thấp hơn. Tiền bạc từ giờ eo hẹp hơn. Nhưng sáu giờ bạn đã về đến nhà, có thời gian ăn cơm cùng nhau, đọc truyện cho con và không còn phải trả lời email trên giường.`],
  'newjob.1': [`You stay. Nothing changes: same pay, same hours, same evenings.`,
               `Bạn quyết định ở lại. Mọi thứ vẫn như cũ: lương không đổi, giờ làm không đổi, buổi tối cũng chẳng khác gì.`],
  'newjob.2': [`You ask to leave at five on Tuesdays and Fridays. Your boss agrees, without enthusiasm. On those days you work through lunch, and on the others you stay later to make up.`,
               `Bạn xin tan làm lúc năm giờ vào thứ ba và thứ sáu. Sếp đồng ý, nhưng không vui vẻ lắm. Hai hôm đó bạn phải làm cả giờ nghỉ trưa, những hôm khác lại phải ở lại muộn hơn để bù.`],

  // 6–9
  'homework.0': [`You sit down, cover the page with a sheet of paper and show only question one. "Read it to me. What is it asking?" You don't hold the pencil. When {name} gets one step, you uncover the next. It takes an hour and you are exhausted. Every line on the page is {name}'s own.`,
                 `Bạn ngồi xuống, lấy tờ giấy che cả trang, chỉ để lộ câu đầu tiên. "Con đọc đề lên. Đề hỏi gì?" Bạn không cầm bút. {name} làm xong một bước thì bạn mở tiếp bước sau. Mất một tiếng, bạn mệt rã rời. Từng dòng trên trang giấy đều do chính {name} viết.`],
  'homework.1': [`"Stop now. Go to bed. Tomorrow you tell your teacher yourself that you couldn't finish." {name} is scared but sleeps well. In the morning {name} explains, red-faced. The teacher gives one more day, and {name} finishes it at break time.`,
                 `"Thôi, đi ngủ đi. Mai con tự nói với cô là con chưa làm xong." {name} vẫn lo lắng nhưng ngủ ngon. Sáng hôm sau, {name} đỏ mặt nói với cô. Cô cho thêm một ngày, {name} tranh thủ làm nốt trong giờ ra chơi.`],
  'homework.2': [`You take the pencil and write the answers in ten minutes, trying to copy {name}'s handwriting. Everyone gets to bed. The next evening, at the first hard question, {name} starts crying and looks at you.`,
                 `Bạn cầm bút, chỉ mười phút là xong, cố bắt chước nét chữ của con. Cả nhà được đi ngủ. Tối hôm sau, vừa gặp câu khó đầu tiên, {name} lại khóc và nhìn sang bạn.`],
  'homework.3': [`"Your cousin does this in ten minutes! What's wrong with you?" {name} wipes their eyes and finishes the page, hands shaking. The work is done. But next time {name} gets stuck, they hide the page instead of asking you.`,
                 `"Anh họ con chỉ mất mười phút là làm xong bài này! Con bị làm sao thế?" {name} quệt nước mắt, làm nốt bài, tay run run. Bài thì xong. Nhưng lần sau gặp bài khó, {name} sẽ giấu đi chứ không hỏi bạn nữa.`],
  'grade4.0': [`You unfold the test and look at the mistakes, not at {name}. "Show me how you did this one." It turns out {name} adds the bottoms of fractions together. You find the mistake together, and {name} suggests ten minutes of fractions every day. Most days, {name} actually does it.`,
               `Bạn mở bài ra, nhìn vào chỗ sai chứ không nhìn {name}. "Câu này con làm thế nào, chỉ {parent} xem." Hóa ra {name} đã cộng cả mẫu số với nhau. Hai người cùng tìm ra lỗi, rồi {name} tự đề nghị mỗi ngày luyện phân số mười phút. Hầu hết các ngày, con đều làm đúng như đã hứa.`],
  'grade4.1': [`You hug {name}: "It's just one test. You're still clever." {name} relaxes and goes off to play. The next test has fractions again, and {name} gets a 5.`,
               `Bạn ôm {name}: "Một bài thôi mà. Con vẫn giỏi." {name} thở phào, chạy đi chơi. Bài kiểm tra sau lại có phân số, và {name} được 5 điểm.`],
  'grade4.2': [`The next day you find a maths class two evenings a week. Within a term {name}'s marks come back up. Those two evenings used to be for cycling in the park.`,
               `Hôm sau, bạn tìm ngay một lớp toán, học hai buổi tối mỗi tuần. Hết học kỳ, điểm của {name} tăng trở lại. Hai buổi tối ấy trước đây là thời gian cả nhà đạp xe ngoài công viên.`],
  'grade4.3': [`"A 4? No phone, no park, no TV this weekend. You study." {name} spends Saturday and Sunday at the desk, angry and scared. The marks go up a little. The next bad test is signed by {name}, in your handwriting.`,
               `"4 điểm à? Cuối tuần này không điện thoại, không công viên, không TV. Ngồi học!" {name} ngồi vào bàn suốt thứ bảy, chủ nhật, vừa tức vừa sợ. Điểm số có nhích lên một chút. Lần sau bị điểm kém, {name} tự ký tên, giả chữ của bạn.`],
  'bullied.0': [`You put everything down and listen, without interrupting and without asking "why didn't you hit back?". Then you play it out together: you are the bully, {name} practises saying "Stop it" loudly and walking to the teacher. You also message the teacher that evening. {name} goes back with a plan, and knows you are behind them.`,
                `Bạn gác hết mọi việc, ngồi nghe, không ngắt lời, cũng không hỏi "sao con không đánh lại?". Rồi hai người cùng tập đóng vai: bạn làm đứa trêu chọc, {name} tập nói thật to "Thôi đi" rồi đi về phía cô giáo. Tối đó, bạn cũng nhắn tin cho cô. {name} trở lại lớp với một kế hoạch rõ ràng, và biết rằng bạn luôn ở bên mình.`],
  'bullied.1': [`The next morning you go to the school, see the principal and ask to meet the other parents. The teasing stops. But in class, {name} becomes "the one whose parent came", and the next time something happens, {name} waits for you to come again.`,
                `Sáng hôm sau, bạn lên trường gặp hiệu trưởng, đòi gặp phụ huynh mấy đứa kia. Tình trạng trêu chọc chấm dứt. Nhưng trong lớp, {name} trở thành "đứa có ba mẹ lên trường". Lần sau có chuyện, {name} lại chỉ biết chờ bạn đến giải quyết.`],
  'bullied.2': [`"You have to handle it yourself. Life is full of people like that." {name} nods. Some children do toughen up this way. {name} stops talking about it at home, and you can't tell whether the teasing stopped or just stopped being mentioned.`,
                `"Con phải tự giải quyết. Lớn lên còn gặp nhiều người như thế." {name} gật đầu. Có những đứa trẻ trở nên cứng cỏi hơn nhờ cách này. Nhưng {name} không kể chuyện đó ở nhà nữa, còn bạn thì chẳng biết con đã hết bị trêu hay chỉ không muốn kể.`],
  'bullied.3': [`"If they hit you, hit them back. Harder." A week later {name} punches one of the boys. The teasing stops at once, and both families are called to the principal's office.`,
                `"Nó đánh thì con đánh lại, mạnh hơn." Một tuần sau, {name} đấm một đứa. Không còn bị trêu nữa, nhưng cả hai nhà đều bị mời lên phòng hiệu trưởng.`],
  'screen.0': [`You take the tablet calmly: "Time's up." {name} screams and slams the door, and you let them be angry. The next afternoon, when everyone is calm, you sit down and write three lines together: when, how long, what happens if time runs over. {name} signs it. The next evening still has a fight, but a shorter one.`,
               `Bạn bình tĩnh cầm máy lên: "Hết giờ rồi." {name} hét, đóng sầm cửa, và bạn để con giận. Chiều hôm sau, khi cả hai đã bình tĩnh lại, hai người ngồi viết ba dòng: xem lúc nào, xem bao lâu, quá giờ thì sao. {name} ký tên. Tối hôm sau vẫn có giằng co, nhưng không kéo dài như trước.`],
  'screen.1': [`You sit down on the sofa: "How much is left?" You watch the last ten minutes together, and {name} explains who everyone is. Then you both switch it off. No fight at all. The next day, "one episode" quietly becomes "until the end of the episode with you".`,
               `Bạn ngồi xuống sô-pha: "Còn bao lâu nữa con?" Hai người xem nốt mười phút, {name} giải thích nhân vật nào là ai. Rồi cả hai cùng tắt máy. Không cãi nhau gì cả. Hôm sau, "xem một tập" lặng lẽ biến thành "xem hết tập với {parent}".`],
  'screen.2': [`"Fine. Thirty more minutes, then that's it." The shouting stops. Thirty minutes later {name} asks for ten more, louder this time. You give in again.`,
               `"Thôi được, thêm ba mươi phút, rồi thôi đấy." {name} ngừng hét. Ba mươi phút sau, con lại xin thêm mười phút, lần này còn nói to hơn. Bạn lại chiều theo.`],
  'screen.3': [`You snatch the tablet and lock it in a drawer: "No screens for a week!" A week of slammed doors, sulking and homework actually done. On day four, the neighbour mentions that {name} watches cartoons at their house every afternoon.`,
               `Bạn giật lấy máy, khóa vào ngăn kéo: "Cấm xem một tuần!" Suốt một tuần là những tiếng đóng sầm cửa, giận dỗi, nhưng bài tập vẫn được làm đầy đủ. Đến ngày thứ tư, hàng xóm kể rằng chiều nào {name} cũng sang nhà họ xem hoạt hình.`],
  'extra_class.0': [`{name} joins the centre's evening class, three evenings a week, with half the class. The marks on class tests creep up. The skills underneath change less than the marks. Dinner is now at eight, and there is no more playing after school.`,
                    `{name} đi học thêm ở trung tâm ba buổi tối mỗi tuần, cùng với nửa lớp. Điểm kiểm tra trên lớp có nhích lên. Nhưng kiến thức thực sự không tăng nhiều như điểm số. Bữa tối giờ phải dời sang tám giờ, và sau giờ học cũng chẳng còn thời gian chơi.`],
  'extra_class.1': [`You decide against it. {name} plays after school and is in bed by nine. In the class ranking, {name} slips a few places, and at the gate other parents ask why {name} isn't going.`,
                    `Bạn không cho con đi. Tan học, {name} được chơi, chín giờ đã đi ngủ. Trên bảng xếp hạng của lớp, {name} tụt vài bậc. Ở cổng trường, còn có phụ huynh hỏi sao bạn không cho con đi học thêm.`],
  'extra_class.2': [`You keep {name} home, and promise yourself two evenings a week with the maths book. You relearn long division at the kitchen table. Some evenings end in laughter, some in tears, a few in both. You are more tired than before.`,
                    `Bạn không cho con đi học thêm, nhưng tự hứa mỗi tuần sẽ kèm con hai tối. Bạn lại phải học phép chia ngay tại bàn bếp. Có tối kết thúc bằng tiếng cười, có tối bằng nước mắt, đôi khi là cả hai. Bạn cũng mệt hơn trước.`],

  // 9–12
  'gifted.0': [`You enrol {name} in a cramming centre: five sessions a week, mock tests every Sunday. {name} gets very good at test questions. By the spring {name} has dark circles under the eyes and has stopped drawing.`,
               `Bạn cho {name} vào trung tâm luyện thi: tuần năm buổi, chủ nhật nào cũng thi thử. {name} rất quen với các dạng đề. Đến mùa xuân, mắt {name} thâm quầng, con cũng không còn vẽ nữa.`],
  'gifted.1': [`You decide against it: the school down the road is fine. {name} keeps Sundays for football and comics. At Tết an uncle asks why you don't push {name} more, and you smile.`,
               `Bạn quyết định không cho con thi, học trường gần nhà cũng được rồi. {name} vẫn có chủ nhật để đá bóng, đọc truyện. Tết đến, một ông chú hỏi sao không cho cháu đi thi, bạn chỉ cười.`],
  'gifted.2': [`You visit the school with {name} on its open day, then ask: "Do you want to try?" {name} wants to, but not with five classes a week. You agree on two. Whatever the result, it was {name}'s decision.`,
               `Bạn đưa {name} đến trường vào ngày mở cửa cho phụ huynh tham quan rồi hỏi: "Con có muốn thử không?" {name} muốn thử, nhưng không muốn học năm buổi một tuần. Hai người thống nhất học hai buổi. Đỗ hay trượt, con cũng đã tự quyết định.`],
  'tet.0': [`You smile and say clearly, so the whole table hears: "We're very proud of {name}." The aunt raises an eyebrow and moves on. Under the table, {name}'s shoulders relax. Years later, {name} still remembers that you said it.`,
            `Bạn mỉm cười, nói đủ lớn để cả mâm nghe thấy: "Nhà em tự hào về {name} lắm." Bà dì nhướn mày rồi chuyển sang chuyện khác. Dưới gầm bàn, {name} thở phào nhẹ nhõm. Nhiều năm sau, con vẫn nhớ câu bạn nói hôm đó.`],
  'tet.1': [`You change the subject: "Have you tried the bánh chưng this year?" That night you ask {name} how that felt. "I hate being compared." You just listen. {name} decides what to say if it happens again next year.`,
            `Bạn chuyển sang chuyện khác: "Bánh chưng năm nay dì gói ngon quá." Tối đó, bạn hỏi {name} thấy thế nào khi nghe câu ấy. "Con ghét bị so sánh." Bạn chỉ ngồi nghe. {name} tự nghĩ sẵn câu trả lời nếu năm sau lại bị hỏi.`],
  'tet.2': [`You laugh, say "Oh, every child is different", and pour more tea. Nobody is offended. {name} looks at their plate and says nothing for the rest of the meal.`,
            `Bạn cười trừ: "Mỗi đứa một khác dì ạ", rồi rót thêm trà. Không ai mất lòng. {name} cúi nhìn cái bát, suốt bữa không nói thêm câu nào.`],
  'tet.3': [`"Yes, {name} is lazy, I keep telling them." Everyone nods. At home that evening you set extra study hours for the holiday. {name} studies, and stops sitting next to you at family gatherings.`,
            `"Vâng, nó lười lắm, em nói mãi." Cả mâm gật gù. Tối về, bạn xếp thêm giờ học cho con trong suốt kỳ nghỉ. {name} có học, nhưng từ đó không bao giờ ngồi cạnh bạn trong những buổi họp họ nữa.`],
  'forgot.0': [`"I'm not bringing it. What are you going to say to your teacher?" {name} cries on the phone, then hangs up. That afternoon {name} comes home with a lower mark, having explained it alone. From then on {name} packs the bag the night before.`,
               `"{Parent} không mang bài đến đâu. Con định nói với cô thế nào?" {name} khóc qua điện thoại rồi cúp máy. Chiều về, {name} bị trừ điểm, nhưng đã tự giải thích với cô. Từ đó, con luôn soạn cặp từ tối hôm trước.`],
  'forgot.1': [`You bring it this time. That evening you make a list together and stick it on the door: books, homework, project, water bottle. {name} ticks it every night. You only ask "Have you ticked your list?" and never check the bag yourself.`,
               `Lần này bạn mang bài đến. Tối đó, hai người cùng làm một tờ danh sách để dán ở cửa: sách, bài tập, bài dự án, bình nước. Tối nào {name} cũng tự đánh dấu. Bạn chỉ hỏi "Con đánh dấu chưa?", chứ không bao giờ tự kiểm tra cặp giúp con.`],
  'forgot.2': [`You leave a meeting, ride across town and hand the project over at the gate with ten minutes to spare. {name} hugs you. The next week {name} forgets the sports kit, and calls you again.`,
               `Bạn bỏ dở cuộc họp, chạy xe qua nửa thành phố, đưa bài đến cổng trường trước giờ nộp mười phút. {name} ôm chầm lấy bạn. Tuần sau {name} quên đồ thể dục, và lại gọi bạn.`],
  'forgot.3': [`"Serves you right! Maybe now you'll learn!" You hang up. {name} faces the teacher alone and loses marks. {name} does remember next time. {name} also stops calling you when something goes wrong.`,
               `"Cho chừa! Để xem lần sau có nhớ không!" Bạn cúp máy. {name} phải tự đối mặt với cô và bị trừ điểm. Lần sau, con nhớ thật. Nhưng từ đó, có chuyện gì {name} cũng không gọi cho bạn nữa.`],
  'quit.0': [`"Why do you want to stop?" It turns out the coach shouts and calls the slow ones names. You agree: finish the term you paid for, then decide. {name} finishes, then asks to keep swimming, with a different coach.`,
             `"Sao con muốn nghỉ?" Hóa ra thầy hay quát, còn đặt biệt danh cho những đứa bơi chậm. Hai người thống nhất học hết khóa đã đóng tiền, sau đó con tự quyết. {name} học hết khóa rồi xin học tiếp với thầy khác.`],
  'quit.1': [`You go to the pool and ask the coach, politely, to go easier on {name}. He nods. The shouting at {name} stops. {name} is grateful, and a bit embarrassed when the others ask why the coach is suddenly nice.`,
             `Bạn đến bể bơi, lịch sự nhờ thầy nhẹ nhàng hơn với {name}. Thầy gật đầu và không quát con nữa. {name} biết ơn bạn, nhưng cũng hơi ngượng khi các bạn hỏi sao tự dưng thầy hiền thế.`],
  'quit.2': [`"Fine, stop." {name} is relieved, you are relieved. The money is gone. Two months later {name} wants to quit piano after three lessons.`,
             `"Ừ, nghỉ thì nghỉ." {name} nhẹ người, bạn cũng nhẹ người. Tiền thì mất. Hai tháng sau, {name} học piano được ba buổi lại đòi nghỉ.`],
  'quit.3': [`"No. I paid for the whole term. You're going." {name} goes, silent and sulking, and finishes the term. {name} learns to endure, and learns that explaining why is pointless.`,
             `"Không. Tiền đóng cả khóa rồi, phải đi học." {name} vẫn đi, mặt lầm lì, và học hết khóa. Con học được cách chịu đựng, nhưng cũng nghĩ rằng có giải thích lý do thì chẳng ích gì.`],
  'pocket.0': [`"No more until next month." Three weeks with no snacks and no new stickers. {name} is grumpy, then resourceful. Next month {name} divides the money into four envelopes, one for each week.`,
               `"Hết rồi thì chờ sang tháng." Suốt ba tuần, {name} không được mua quà vặt hay bất cứ thứ gì thêm. Con cáu kỉnh một thời gian rồi tự tìm cách xoay xở. Tháng sau, {name} chia tiền ra bốn phong bì, mỗi tuần một phong bì.`],
  'pocket.1': [`You lend next month's money, and hand {name} a small notebook: "Write down everything you spend." At the end of the month {name} adds it up and is shocked at how much went on the game. Next month {name} spends less, without being told.`,
               `Bạn cho {name} ứng tiền tháng sau, kèm một cuốn sổ nhỏ: "Tiêu gì thì ghi lại." Cuối tháng, {name} cộng lại và giật mình khi thấy mình đã tiêu nhiều tiền vào game đến thế. Tháng sau, con tự tiêu ít đi mà không cần ai nhắc.`],
  'pocket.2': [`You give a little more: "Be careful this time." {name} says thank you and means it. At the next game sale, the money is gone again in two days.`,
               `Bạn cho thêm một ít: "Lần này cẩn thận đấy." {name} cảm ơn, thật lòng. Đến đợt game giảm giá tiếp theo, hai ngày là hết tiền.`],
  'pocket.3': [`"No more pocket money. You can't be trusted with it." The wasting stops. So does the practice: {name} has to ask you for every single thing, and at fifteen still can't plan a budget.`,
               `"Từ nay không có tiền tiêu vặt nữa. Đưa con tiền chỉ phí thôi." Hết chuyện tiêu hoang, nhưng {name} cũng chẳng còn cơ hội tập quản lý tiền bạc. Thứ gì con cũng phải xin bạn, đến mười lăm tuổi vẫn chưa biết tự tính toán chi tiêu.`],
  'promo.0': [`You accept. The salary is better, and you are away three or four nights a month. You call home on video; {name} talks for two minutes and goes back to playing.`,
              `Bạn nhận lời. Lương cao hơn, nhưng mỗi tháng phải đi công tác ba bốn đêm. Bạn gọi video về nhà, {name} nói chuyện được hai phút rồi chạy đi chơi.`],
  'promo.1': [`You decline. A colleague gets the job. You are home in the evenings, as before.`,
              `Bạn từ chối. Một đồng nghiệp nhận vị trí đó. Buổi tối bạn vẫn ở nhà như cũ.`],

  // 12–15
  'door.0': [`You wait until the next evening, then knock: "Can I come in? I said some unfair things. I'm sorry for that part." Silence. Then, from under the pillow: "Sorry too." You sit on the edge of the bed for a while. Neither of you mentions grades.`,
             `Đợi đến tối hôm sau, bạn mới gõ cửa: "{Parent} vào được không? Hôm trước {parent} nói mấy câu không công bằng. Phần đó {parent} xin lỗi." Im lặng một lúc. Rồi từ dưới gối vọng ra: "Con cũng xin lỗi." Bạn ngồi bên mép giường một lúc. Không ai nhắc lại chuyện điểm số.`],
  'door.1': [`You write a few lines on a piece of paper: that you love {name}, and that you are ready to talk when they are. You slide it under the door. No answer that day. The next morning the note is gone, and {name} says goodbye on the way out.`,
             `Bạn viết vài dòng, nói rằng bạn thương con và lúc nào con muốn trò chuyện, bạn cũng sẵn lòng lắng nghe. Bạn nhét tờ giấy qua khe cửa. Hôm đó không có hồi âm. Sáng hôm sau, tờ giấy đã biến mất và {name} chào bạn trước khi đi học.`],
  'door.2': [`You decide to let it blow over. By Thursday {name} is talking about dinner again and everything looks normal. The argument about grades never gets finished, and it comes back at the next report card.`,
             `Bạn quyết định cứ để vậy, chờ con nguôi giận. Đến thứ năm, {name} đã hỏi tối nay ăn gì, mọi thứ trông có vẻ bình thường. Nhưng chuyện cãi nhau về điểm số chưa bao giờ được giải quyết, và rồi lại xảy ra vào đợt nhận học bạ sau.`],
  'door.3': [`You open the door: "Give me your phone. You're grounded for a week." {name} hands it over without a word. For a week homework is done in silence. When the week ends, {name} answers your questions with one word.`,
             `Bạn mở cửa: "Đưa điện thoại đây. Cấm túc một tuần." {name} đưa máy, không nói gì. Suốt tuần, con vẫn làm bài đầy đủ nhưng chẳng nói câu nào. Hết tuần, bạn hỏi gì {name} cũng chỉ đáp một chữ.`],
  'crush.0': [`At dinner, alone, you ask lightly: "Who's the one who makes you smile at your phone?" {name} goes red, then tells you everything for forty minutes. You don't tease. At the end you talk about what is okay and what isn't, and {name} actually listens.`,
              `Trong bữa tối chỉ có hai người, bạn nhẹ nhàng hỏi: "Ai mà làm con cứ cười với điện thoại suốt thế?" {name} đỏ mặt rồi kể liền bốn mươi phút. Bạn không trêu con. Cuối cùng, hai người cùng nói về những điều nên làm và chưa nên làm, {name} cũng chịu lắng nghe.`],
  'crush.1': [`You say nothing and wait for {name} to bring it up. {name} never does. The texting goes on past midnight for weeks. Months later, when it is over, {name} mentions it in passing.`,
              `Bạn không nói gì, chờ {name} tự kể. Nhưng con không kể. Suốt mấy tuần, con nhắn tin đến quá nửa đêm. Vài tháng sau, khi mọi chuyện đã qua, {name} mới nhắc qua loa.`],
  'crush.2': [`While {name} is in the shower, you unlock the phone and scroll through the messages. Nothing terrible, just sweet and silly. You feel better, and guilty. You can't mention anything you read, so you say nothing.`,
              `Lúc {name} đi tắm, bạn mở điện thoại đọc tin nhắn. Không có gì đáng sợ, chỉ toàn những lời ngọt ngào và ngớ ngẩn. Bạn thấy yên tâm hơn, nhưng cũng thấy có lỗi. Dù đọc được gì, bạn cũng không thể nhắc đến, đành im lặng.`],
  'crush.3': [`"You're a student. No dating, full stop. Study." {name} says "fine" and goes to their room. The name disappears from conversations. A few weeks later you notice the phone now has a password.`,
              `"Học sinh thì lo mà học. Không yêu đương gì hết." {name} đáp "vâng" rồi về phòng. Cái tên ấy biến mất khỏi mọi câu chuyện. Vài tuần sau, bạn để ý thấy điện thoại của con đã có mật khẩu.`],
  'phone1am.0': [`You say nothing at 1 a.m. The next evening at dinner you propose a rule: at ten, every phone in the house goes on the living-room shelf, yours included. {name} argues, then agrees if you keep it too. Keeping your own phone on the shelf turns out to be the hard part.`,
                 `Lúc 1 giờ sáng, bạn chưa nói gì. Tối hôm sau, trong bữa cơm, bạn đề nghị cả nhà để điện thoại trên kệ phòng khách lúc 10 giờ, kể cả điện thoại của bạn. {name} cãi lại, rồi đồng ý với điều kiện bạn cũng phải làm đúng. Hóa ra, người khó làm theo nhất lại là bạn.`],
  'phone1am.1': [`You knock softly, sit on the bed and ask what's so interesting this late. {name} shows you a group chat where classmates are mocking someone, and doesn't know what to do. You talk for twenty minutes. {name} falls asleep at two, but lighter.`,
                 `Bạn khẽ gõ cửa, ngồi xuống giường và hỏi sao con còn thức khuya. {name} cho bạn xem một nhóm chat đang chế giễu một bạn cùng lớp. Con không biết phải làm gì. Hai người trò chuyện suốt hai mươi phút. Đến hai giờ {name} mới ngủ, nhưng lòng đã nhẹ nhõm hơn.`],
  'phone1am.2': [`You see the glow and go back to bed. No argument. The next morning {name} can't get up, and the homeroom teacher messages you that {name} fell asleep in first period.`,
                 `Bạn thấy ánh sáng hắt ra rồi quay về giường. Không cãi nhau. Sáng hôm sau, {name} mãi không dậy nổi. Cô chủ nhiệm nhắn rằng con ngủ gục ngay tiết một.`],
  'phone1am.3': [`You open the door, take the phone and keep it in your room. {name} protests, then turns to the wall. For a month {name} sleeps more and is awake in class. Then you find an old phone, borrowed from a friend, under the mattress.`,
                 `Bạn mở cửa, cầm điện thoại mang về phòng mình. {name} phản đối rồi quay mặt vào tường. Suốt tháng đó, {name} ngủ nhiều hơn, lên lớp tỉnh táo hơn. Nhưng rồi bạn phát hiện dưới đệm có một chiếc máy cũ con mượn của bạn.`],
  'net.0': [`You wait a day, until you are calm. Then: "I know you haven't been going. Help me understand." After a long silence: the tutor mocks {name}'s answers in front of everyone. {name} agrees to pay back part of the fees from pocket money, and you find another tutor.`,
            `Bạn đợi một ngày cho nguôi giận rồi mới nói: "{Parent} biết con không đi học thêm. Giúp {parent} hiểu chuyện này đi." Im lặng hồi lâu, {name} mới kể rằng thầy thường chế giễu câu trả lời của con trước cả lớp. {name} đồng ý lấy tiền tiêu vặt trả lại một phần học phí, còn bạn tìm thầy khác.`],
  'net.1': [`"If you don't want that class, stop going. But then you study on your own." {name} is relieved, and for a while really does study alone. The lying about where they were is never discussed.`,
            `"Không muốn học lớp đó thì nghỉ. Nhưng phải tự học." {name} thấy nhẹ nhõm và thực sự tự học được một thời gian. Còn chuyện con nói dối suốt hai tuần thì chẳng ai nhắc lại.`],
  'net.2': [`You say nothing, and that night you install a location app on {name}'s phone. From now on you can see where {name} is, any time. You still have no idea why {name} skipped class, and {name} will find the app sooner or later.`,
            `Bạn không nói gì, tối đó lặng lẽ cài ứng dụng định vị vào máy {name}. Từ đó, bạn luôn biết con đang ở đâu. Nhưng bạn vẫn không hiểu vì sao con trốn học. Sớm muộn gì {name} cũng sẽ phát hiện ra.`],
  'net.3': [`You walk into the internet café, pull {name} out by the arm in front of the whole group, and scold all the way home. {name} goes back to class the next day. {name} doesn't talk to you properly for months.`,
            `Bạn đi thẳng vào quán net, nắm tay kéo {name} ra trước mặt cả nhóm bạn rồi mắng con suốt đường về. Hôm sau, {name} đi học thêm lại. Nhiều tháng liền, con chẳng buồn nói chuyện tử tế với bạn.`],

  // 15–18
  'major.0': [`You ask around and set up three coffees: a graphic designer, a bank employee, and someone who studied design and now works in a bank. {name} asks a lot of questions. In the end {name} chooses, knowing what each path really looks like, and the choice is {name}'s own.`,
              `Bạn hỏi thăm khắp nơi và hẹn được ba buổi cà phê: với một người làm thiết kế đồ họa, một người làm ngân hàng và một người học thiết kế nhưng hiện đang làm ngân hàng. {name} hỏi rất nhiều. Cuối cùng, con tự chọn sau khi hiểu rõ công việc thực tế của từng nghề. Đó là quyết định của chính con.`],
  'major.1': [`You propose: "Banking as your degree, and I'll pay for evening design classes." {name} thinks about it and agrees. Two courses at once is heavy, and {name} is often tired, but nobody feels they lost.`,
              `Bạn đề nghị: "Con học ngân hàng, tối {parent} cho con đi học thêm thiết kế." {name} suy nghĩ rồi đồng ý. Học cùng lúc hai thứ khá vất vả, con thường xuyên mệt mỏi, nhưng không ai cảm thấy mình phải chịu thua.`],
  'major.2': [`"Study whatever you like. It's your life." {name} is pleased, then lost. With a long list of course names nobody has explained, {name} picks one that a friend picked.`,
              `"Thích gì thì học, đời con mà." {name} vui lắm, rồi lại lúng túng. Trước danh sách dài những ngành học chưa ai giải thích, con đành chọn đại ngành mà bạn thân đang chọn.`],
  'major.3': [`"Banking. Design doesn't pay. You'll thank me later." {name} argues once, then gives up and fills in the form. The relatives congratulate you. {name} keeps drawing at night, in a notebook nobody sees.`,
              `"Học ngân hàng. Thiết kế chẳng có tương lai đâu. Sau này con sẽ cảm ơn {parent}." {name} cãi lại một lần rồi thôi, lặng lẽ điền đơn đăng ký. Họ hàng chúc mừng bạn. Tối nào {name} cũng vẫn vẽ, trong một cuốn sổ không ai được xem.`],
  'burnout.0': [`You sit down next to the papers: "You are not your score. I'd rather have you healthy than top of the class." Together you rewrite the timetable with eight hours of sleep and drop one evening class. On Sunday {name} sleeps until noon. The marks dip a little.`,
                `Bạn ngồi xuống cạnh chồng đề: "Con không phải điểm số. {Parent} chỉ mong con khỏe mạnh, không cần phải đứng nhất." Hai người cùng sắp xếp lại thời gian biểu, dành đủ tám tiếng để ngủ và bỏ bớt một lớp học thêm buổi tối. Chủ nhật, {name} ngủ một mạch đến trưa. Điểm thi thử giảm đi một chút.`],
  'burnout.1': [`You take {name} out of school for a week and go to the beach, no books allowed. {name} sleeps, swims, laughs again. Back home, the pile of mock exams is still waiting.`,
                `Bạn xin phép cho {name} nghỉ học một tuần, cả nhà đi biển và không mang theo sách vở. {name} được ngủ, được bơi và lại cười vui vẻ. Về đến nhà, chồng đề thi thử vẫn nằm nguyên đó chờ con.`],
  'burnout.2': [`You put a glass of warm milk on the desk, say goodnight, and close the door softly. {name} knows you saw. Nothing changes: the light stays on until three.`,
                `Bạn đặt ly sữa ấm lên bàn, chúc con ngủ ngon rồi nhẹ nhàng khép cửa. {name} biết bạn đã nhìn thấy. Nhưng mọi thứ vẫn như cũ: đèn vẫn sáng đến ba giờ sáng.`],
  'burnout.3': [`"Only four more months. Everyone is tired. Keep going." {name} nods, wipes their face and opens the next paper. You stop hearing the crying. That's because it has moved to the bathroom.`,
                `"Chỉ còn bốn tháng nữa thôi. Ai cũng mệt cả. Cố lên con." {name} gật đầu, lau mặt rồi mở đề tiếp theo. Bạn không còn nghe thấy tiếng khóc nữa. Bởi con đã chuyển vào nhà tắm để khóc.`],
  'trip.0': [`"Write me a plan: who's going, where you'll stay, how you'll get there. And call every evening." {name} writes a whole page and sends you the guesthouse address. The first call lasts ten minutes, the second thirty seconds. {name} comes home tanned and proud.`,
             `"Con lên kế hoạch cho {parent} xem nhé: đi với ai, ở đâu, đi bằng gì. Tối nào cũng phải gọi về." {name} viết hẳn một trang rồi gửi bạn địa chỉ nhà nghỉ. Cuộc gọi tối đầu tiên kéo dài mười phút, tối thứ hai chỉ còn ba mươi giây. {name} trở về với làn da sạm nắng và vẻ mặt đầy tự hào.`],
  'trip.1': [`"You can go, if I come too and stay in the same hotel." {name} agrees, unhappily. In Đà Lạt you eat breakfast alone and pretend not to know the group at the night market. {name} has fun, and is a little ashamed in front of friends.`,
             `"Được đi, nhưng {parent} sẽ đi cùng và ở chung khách sạn." {name} đồng ý, dù không vui lắm. Ở Đà Lạt, bạn ăn sáng một mình, ra chợ đêm thì giả vờ không quen cả nhóm. {name} chơi rất vui, nhưng cũng hơi ngại với bạn bè.`],
  'trip.2': [`"Sure, go, have fun." You ask nothing else. {name} has a wonderful trip. You find out where they stayed from the photos on social media, and realise you never asked who was driving.`,
             `"Ừ, đi đi, chơi vui nhé." Bạn không hỏi thêm gì. {name} có một chuyến đi rất vui. Bạn chỉ biết con đang ở đâu qua những bức ảnh trên mạng. Đến lúc đó, bạn mới nhận ra mình còn chưa hỏi ai sẽ lái xe.`],
  'trip.3': [`"Absolutely not. You're too young." {name} stays home all weekend, watching the photos come in from Đà Lạt. {name} doesn't argue. The next time, {name} may not ask at all.`,
             `"Không được, tuyệt đối không. Con còn nhỏ." {name} ở nhà suốt cuối tuần, xem ảnh bạn bè gửi từ Đà Lạt. Con không cãi lại. Nhưng lần sau, có lẽ con sẽ chẳng xin phép nữa.`],
  'helper.0': [`You give {name} two jobs: make the bed, pack the school bag. You tell the helper, kindly, not to step in. The first week the bed looks like a storm and a maths book stays at home. You bite your tongue. By the second month {name} does both before breakfast, and complains about it, which is fine.`,
               `Bạn giao cho {name} hai việc: dọn giường và soạn cặp. Bạn nhẹ nhàng dặn cô giúp việc đừng làm thay. Tuần đầu, giường ngủ bừa bộn như vừa qua bão, sách toán còn để quên ở nhà. Bạn cố không nhắc nhở. Sang tháng thứ hai, {name} đã làm xong cả hai việc trước bữa sáng. Con vừa làm vừa càu nhàu, nhưng thế cũng tốt rồi.`],
  'helper.1': [`On Sunday the helper goes home. You hand out jobs: you wash, {name} hangs the clothes, everyone sweeps. It takes twice as long and there is water on the floor. {name} laughs the whole time and asks if next Sunday is a "team day" too.`,
               `Chủ nhật, cô giúp việc về quê. Bạn phân công: bạn giặt đồ, {name} phơi quần áo, cả nhà cùng quét nhà. Mọi việc mất gấp đôi thời gian, nước thì lênh láng khắp sàn. {name} cười suốt buổi, rồi hỏi Chủ nhật sau có được "ngày cả đội" nữa không.`],
  'helper.2': [`You let it be. The helper is quick, and {name} uses the time for homework and extra classes. The grades are good. On a school camp at twelve, {name} calls home: nobody showed them how to wash a shirt.`,
               `Bạn cứ để mọi chuyện như vậy. Cô giúp việc làm nhanh, {name} dùng thời gian đó để học bài và học thêm. Điểm số rất tốt. Nhưng năm mười hai tuổi, khi đi trại hè, {name} phải gọi về hỏi vì chưa ai chỉ con cách giặt áo.`],
  'helper.3': [`"So big and you wait for someone to do everything!" {name} stomps to the sink and washes the bowls badly, banging them. Later you see the helper quietly washing them again. Nobody says anything about it.`,
               `"Lớn rồi mà việc gì cũng chờ người khác làm hộ!" {name} giận dỗi đi ra bồn rửa, rửa bát qua loa, làm bát đĩa va vào nhau loảng xoảng. Lát sau, bạn thấy cô giúp việc lặng lẽ rửa lại. Không ai nhắc đến chuyện đó nữa.`],
  'cardspend.0': [`You open a small card in {name}'s name and put in the same amount on the first of every month. "This is yours. When it's gone, it's gone." The first month it is gone in ten days, and {name} sulks for twenty. By the third month {name} tells the group, "Everyone pays for their own."`,
             `Bạn mở một thẻ riêng đứng tên {name}, đầu mỗi tháng đều nạp vào một khoản cố định. "Tiền này của con. Hết thì phải đợi tháng sau." Tháng đầu tiên, mới mười ngày đã hết tiền, {name} dỗi suốt hai mươi ngày còn lại. Đến tháng thứ ba, con nói với cả nhóm: "Ai ăn thì tự trả phần mình nhé."`],
  'cardspend.1': [`You print the statement and sit with {name} at the table. No shouting, just "Who was this one for?" Slowly it comes out: if {name} does not pay, the group stops inviting them. You talk for an hour about friends who cost money. The money matters less than that hour.`,
             `Bạn in sao kê ra, ngồi cùng {name} bên bàn. Không quát mắng, bạn chỉ hỏi: "Khoản này con mua cho ai?" Dần dần, {name} kể rằng nếu không mời cả nhóm thì mọi người sẽ không rủ con đi chơi nữa. Hai người trò chuyện cả tiếng về những người bạn mà con phải bỏ tiền ra mới giữ được. Một tiếng trò chuyện ấy còn đáng giá hơn số tiền đã tiêu.`],
  'cardspend.2': [`"Never mind, we can afford it." {name} hugs you, relieved. At school {name} is the one who treats everyone. Next month the statement is longer, and you pay it without reading.`,
             `"Thôi, nhà mình cũng có điều kiện mà." {name} ôm bạn, nhẹ cả người. Ở lớp, con thường xuyên khao cả nhóm. Tháng sau, sao kê còn dài hơn, nhưng bạn cứ trả mà chẳng buồn xem.`],
  'cardspend.3': [`You call the bank and cancel the card, then find {name} at the bubble tea shop and say it all in front of the group. The spending stops that day. So does any talk about those friends at home.`,
             `Bạn gọi ngân hàng khóa thẻ, rồi đến quán trà sữa tìm {name}, nói hết mọi chuyện ngay trước mặt cả nhóm. Từ hôm đó, {name} không tiêu tiền nữa. Về nhà, con cũng chẳng còn kể chuyện về nhóm bạn ấy.`],
  'fieldtrip.0': [`At dinner you say it plainly: "This month money is tight. Let's work it out together." {name} counts the piggy bank: about a third. You add the rest from the market money and eat more rice and less meat for a week. {name} goes, and brings back a shell for you.`,
                  `Trong bữa cơm, bạn nói thật: "Tháng này nhà mình hơi khó khăn. Mình cùng tính nhé." {name} đếm tiền trong heo đất, được khoảng một phần ba. Bạn bù phần còn lại từ tiền chợ, cả nhà ăn nhiều rau, ít thịt suốt một tuần. {name} được đi và mang về tặng bạn một vỏ ốc.`],
  'fieldtrip.1': [`You knock on the neighbour's door that evening and borrow the money. {name} goes, swims, sings on the bus, and talks about it for a month. You pay the neighbour back a little each payday for three months.`,
                  `Tối đó, bạn sang gõ cửa nhà hàng xóm để vay tiền. {name} được đi, được tắm biển, hát suốt chuyến xe và về nhà kể chuyện cả tháng. Suốt ba tháng, cứ nhận lương là bạn lại trả hàng xóm một ít.`],
  'fieldtrip.2': [`You write the note: family reasons. {name} says it really does not matter. The two days are quiet. For the next week every conversation in class is about the sea, and {name} has nothing to add.`,
                  `Bạn viết giấy xin phép nghỉ: vì lý do gia đình. {name} bảo thật sự không sao. Hai ngày ấy trôi qua yên ắng. Nhưng suốt tuần sau, ở lớp, ai cũng chỉ nói chuyện đi biển, còn {name} chẳng có gì để kể.`],
  'fieldtrip.3': [`"Where would we get that money! Stay home and study." {name} spends the two days at the table and gets two chapters ahead. After that, notes from school about class funds and trips stop reaching you.`,
                  `"Nhà mình lấy đâu ra tiền! Ở nhà mà học." Hai ngày đó, {name} ngồi vào bàn học trước hai bài. Từ đó, những tờ thông báo đóng quỹ lớp hay đi dã ngoại không còn đến tay bạn nữa.`],
  'sibling.0': [`On Sunday you teach {name} three dishes: rice, omelette, vegetable soup. You pin a timetable on the wall: snack at four, homework while the little one naps, rice at six. Twice the rice burns. You praise the days that work. By the end of the month the little one asks for "{name}'s omelette".`,
                `Chủ nhật, bạn dạy {name} ba món: nấu cơm, trứng chiên, canh rau. Bạn dán lịch lên tường: bốn giờ cho em ăn nhẹ, em ngủ thì làm bài, sáu giờ nấu cơm. Hai lần cơm khê. Hôm nào làm tốt, bạn đều khen. Cuối tháng, đứa em cứ đòi ăn "trứng chiên của anh chị".`],
  'sibling.1': [`You ask the supervisor for the day shift again. It pays less. You are home by six, and dinner is all of you at the table. At the market you count the money twice before you buy.`,
                `Bạn xin tổ trưởng cho chuyển lại sang ca ngày. Lương thấp hơn. Sáu giờ bạn đã về đến nhà, cả nhà lại được ăn tối cùng nhau. Mỗi lần đi chợ, bạn phải đếm tiền hai lần rồi mới mua.`],
  'sibling.2': [`You leave it to {name} and call at eight every evening. "All fine." It mostly is. {name} gets good at bathing a small child. Homework waits until the little one sleeps, and on many nights {name} falls asleep first.`,
                `Bạn để {name} tự lo, tối nào cũng gọi về lúc tám giờ. "Ổn cả." Phần lớn đúng là ổn. {name} tắm cho em ngày càng khéo. Bài tập phải đợi em ngủ, mà nhiều tối {name} còn ngủ trước cả em.`],
  'sibling.3': [`"You're big now. If the little one falls, it's on you." {name} never lets the little one out of sight. Nothing bad happens. {name} is twelve and goes to bed exhausted, and stops going to a friend's house after school.`,
                `"Con lớn rồi. Em mà ngã là con chịu." {name} không rời mắt khỏi em một phút. Không có chuyện gì xảy ra. Nhưng mới mười hai tuổi, tối nào {name} cũng mệt rã rời, và không còn sang nhà bạn chơi sau giờ học nữa.`],
  'homework.4': [`You pull up a chair and go through it line by line: "No, carry the one. Again." Every mistake is fixed before it dries. The page is perfect in forty minutes. The next night {name} sits with the pencil and waits for you to come before writing anything.`,
                 `Bạn kéo ghế ngồi cạnh, xem từng dòng: "Không, phải nhớ một. Làm lại." Sai chỗ nào, bạn sửa ngay chỗ đó. Bốn mươi phút sau, trang bài sạch sẽ, không còn lỗi nào. Tối hôm sau, {name} cầm bút ngồi chờ bạn đến rồi mới chịu viết.`],
  'tantrum.0': [`You crouch next to {name} on the floor and say quietly: "You're angry. You really wanted it. We're not buying candy today." Then you stop talking and wait. People stare. {name} screams for four more minutes, then crawls into your lap. You pay, and leave without the candy.`,
                `Bạn ngồi xuống sàn cạnh {name}, nói nhỏ: "Con đang giận lắm. Con rất muốn ăn kẹo. Nhưng hôm nay mình không mua nhé." Rồi bạn im lặng ngồi chờ. Mọi người xung quanh đều nhìn. {name} gào thêm bốn phút rồi bò vào lòng bạn. Bạn trả tiền và ra về, không mua kẹo.`],
  'tantrum.1': [`You leave the trolley, scoop {name} up and walk outside. In the car park, without an audience, the storm passes in a few minutes. You hold {name} until the sobbing stops. You still have no groceries, and you will have to come back tonight.`,
                `Bạn bỏ xe hàng lại, bế {name} ra ngoài. Đến bãi đỗ xe, không còn ai nhìn, vài phút sau {name} đã bình tĩnh lại. Bạn ôm con đến khi con hết nấc. Đồ vẫn chưa mua được, tối nay bạn phải quay lại.`],
  'tantrum.2': [`You grab a chocolate bar from the rack and hand it over. The screaming stops instantly. The woman behind you smiles. Next week, at the same checkout, {name} looks at the candy, then at you, then lies down on the floor.`,
                `Bạn lấy một thanh sô-cô-la trên kệ đưa cho con. Tiếng gào im bặt. Người phía sau mỉm cười. Tuần sau, cũng ở quầy đó, {name} nhìn kẹo, nhìn bạn rồi lại nằm ra sàn.`],
  'tantrum.3': [`"Stop it right now or I'm leaving you here!" You walk a few steps away. {name} jumps up in panic and runs after you, sobbing. It worked in five seconds. That night {name} won't let go of your hand at bedtime.`,
                `"Nín ngay, không {parent} bỏ con ở đây!" Bạn bước đi vài bước. {name} hoảng hốt bật dậy chạy theo, khóc nức nở. Chỉ năm giây là xong. Tối đó, lúc đi ngủ, {name} nắm chặt tay bạn không chịu buông.`],
  'teacher.0': [`You thank the teacher. At home you put one toy truck on the table and a kitchen timer next to it: two minutes each, then swap. {name} hates the first round and grabs. By Friday {name} is setting the timer and waiting, mostly patiently.`,
                `Bạn cảm ơn cô. Về nhà, bạn đặt một chiếc xe đồ chơi lên bàn, bên cạnh là đồng hồ hẹn giờ: mỗi người chơi hai phút rồi đổi lượt. Lượt đầu, {name} rất khó chịu, vẫn giật đồ chơi. Đến thứ sáu, {name} tự vặn đồng hồ rồi ngồi chờ, phần lớn thời gian đều kiên nhẫn.`],
  'teacher.1': [`On the way home you ask, without scolding: "What happened with the toys today?" {name} goes quiet, then says nobody wants to play with them, so they grab toys to join in. You haven't fixed anything yet. But now you know what the real problem is.`,
                `Trên đường về, bạn nhẹ nhàng hỏi: "Hôm nay chuyện đồ chơi thế nào con?" {name} im lặng một lúc rồi kể rằng không ai chơi với con, nên con giật đồ chơi để được chơi cùng. Bạn vẫn chưa biết phải giải quyết thế nào, nhưng ít nhất giờ đã hiểu nguyên nhân.`],
  'teacher.2': [`"At home {name} is very good. The other kids must have started it." The teacher smiles politely. {name} heard every word and looks proud. From then on, the teacher tells you less and less.`,
                `"Ở nhà cháu ngoan lắm cô ạ, chắc các bạn trêu cháu trước." Cô giáo chỉ cười xã giao. {name} nghe hết, mặt đầy tự hào. Từ đó, cô ít kể chuyện ở lớp với bạn hơn.`],
  'teacher.3': [`In front of everyone you raise your voice: "Why do you snatch? Say sorry to your friends right now!" The other parents nod. {name} stands still, red-faced, and whispers sorry. At home {name} won't talk about kindergarten at all.`,
                `Trước mặt mọi người, bạn to tiếng: "Sao lại giật đồ của bạn? Xin lỗi các bạn ngay!" Các phụ huynh gật gù. {name} đứng im, mặt đỏ bừng, lí nhí xin lỗi. Về nhà, {name} không chịu kể gì về lớp nữa.`],
  'bedtime.0': [`Each time {name} appears, you take their hand without a word, walk them back, say only "It's bedtime", tuck them in and leave. No new story, no scolding, no bargaining. The first night it happens eleven times and you want to scream. By Saturday it happens once.`,
                `Mỗi lần {name} ló ra, bạn lặng lẽ nắm tay đưa con về giường, chỉ nói "Đến giờ ngủ rồi", đắp chăn rồi đi ra. Không kể thêm truyện, không mắng, không mặc cả. Đêm đầu, chuyện đó lặp lại mười một lần, bạn chỉ muốn hét lên. Đến thứ bảy thì chỉ còn một lần.`],
  'bedtime.1': [`You lie down next to {name} in the small bed and stroke their hair. {name} is asleep in ten minutes. So are you, still in your work clothes. You wake up at midnight with a stiff neck. From now on, {name} won't fall asleep unless you are there.`,
                `Bạn nằm xuống cạnh {name} trên chiếc giường nhỏ, vuốt tóc con. Mười phút sau, {name} ngủ. Bạn cũng ngủ luôn, vẫn nguyên quần áo đi làm. Nửa đêm tỉnh dậy, cổ cứng đơ. Từ đó, {name} không có bạn nằm cạnh thì không ngủ được.`],
  'bedtime.2': [`You hand over your phone with a cartoon playing. {name} goes quiet at once. You finally wash the dishes and sit down. At 10:30 you find {name} asleep with the phone on their face. In the morning {name} is grumpy and asks for the phone before breakfast.`,
                `Bạn đưa điện thoại, mở sẵn phim hoạt hình. {name} im ngay. Bạn rửa xong bát, cuối cùng cũng được ngồi xuống. 10 rưỡi, bạn thấy {name} đã ngủ, điện thoại úp trên mặt. Sáng ra, {name} cáu kỉnh, chưa ăn sáng đã đòi điện thoại.`],
  'bedtime.3': [`"That's enough! Sleep, now!" You switch off the light and shut the door hard. You hear crying, then sniffing, then nothing. {name} doesn't come out again. Later, when you check, {name} is asleep with the blanket pulled over their head.`,
                `"Đủ rồi đấy! Ngủ ngay!" Bạn tắt đèn, đóng cửa thật mạnh. Bên trong có tiếng khóc, rồi tiếng sụt sịt, rồi im bặt. {name} không ra khỏi phòng nữa. Lúc sau bạn vào xem, {name} đã ngủ, chăn trùm kín đầu.`],

  // 3–6,
  'biting.0': [`You take both of {name}'s hands, firmly but not hard: "Biting hurts. I won't let you bite." You check on the other child and say sorry. Then you crouch and practise: "Can I have a turn?" You hold out your hand, {name} says it to you, then tries it on the other child. It half works.`,
               `Bạn giữ hai tay {name}, chắc nhưng không làm đau: "Cắn là đau. {Parent} không để con cắn bạn." Bạn hỏi thăm bé kia và xin lỗi phụ huynh. Rồi bạn ngồi xuống tập với con câu "Cho tớ mượn nhé". Bạn chìa tay ra để {name} tập nói với bạn, rồi nói với bé kia. Con mới làm được một nửa.`],
  'biting.1': [`"Biting means sitting with me." You sit {name} on the bench beside you for two minutes. {name} cries and kicks the bench. When the two minutes are over, {name} goes back and plays, keeping a careful distance from the shovel.`,
               `"Cắn bạn thì phải ngồi với {parent}." Bạn cho {name} ngồi ghế cạnh mình hai phút. {name} khóc, đá chân vào ghế. Hết hai phút, {name} quay lại chơi, tránh xa cái xẻng.`],
  'biting.2': [`You smack the back of {name}'s hand: "There. Now you know how it feels." {name} howls. The other parent looks satisfied. Two days later, at home, {name} hits a cousin who took a toy.`,
               `Bạn đét vào mu bàn tay {name}: "Đấy, giờ biết đau chưa." {name} khóc ré lên. Phụ huynh kia có vẻ hài lòng. Hai hôm sau ở nhà, {name} đánh đứa em họ vì giành đồ chơi.`],
  'biting.3': [`"Sorry, sorry, she's tired." You pick {name} up and leave the playground quickly. In the car you feel your face still burning. {name} is already chatting about the slide. Nobody talks about the bite again, and next week it happens again.`,
               `"Xin lỗi chị, cháu nó mệt." Bạn bế {name} đi khỏi sân chơi thật nhanh. Lên xe, mặt bạn vẫn nóng ran. {name} thì đã líu lo kể về cái cầu trượt. Không ai nhắc chuyện cắn nữa, và tuần sau chuyện lại xảy ra.`],
  'whys.0': [`You close the laptop for five minutes. "Why do you think the sky is blue?" {name} thinks hard: "Because someone painted it?" You ask more questions, {name} invents more answers. It is wrong and wonderful. You finish your work at midnight instead of ten.`,
             `Bạn gập máy lại trong năm phút. "Con nghĩ sao trời lại xanh?" {name} nghĩ mãi rồi đáp: "Tại có người sơn ạ?" Bạn hỏi tiếp, {name} lại nghĩ ra câu trả lời khác. Sai bét mà rất hay. Bạn làm xong việc lúc nửa đêm thay vì mười giờ.`],
  'whys.1': [`"Good question. Save it for bedtime and we'll talk about it." {name} goes off, a bit disappointed. At bedtime {name} has saved fifteen questions, and you answer as many as you can before you both fall asleep.`,
             `"Câu hỏi hay đấy. Để dành đến giờ đi ngủ, mình cùng nói nhé." {name} đi ra, hơi tiu nghỉu. Đến giờ ngủ, {name} đã để dành được mười lăm câu hỏi. Bạn trả lời được câu nào thì trả lời, trước khi cả hai cùng ngủ quên.`],
  'whys.2': [`You give {name} the tablet with a cartoon. Two hours of silence, and your work is done. The questions about the sky and the cat never come back. The next evening {name} asks for the tablet instead.`,
             `Bạn đưa máy tính bảng, mở phim hoạt hình. Hai tiếng yên tĩnh, bạn làm xong việc. Những câu hỏi về bầu trời, về con mèo cũng không được nhắc lại nữa. Tối hôm sau, {name} hỏi xin máy tính bảng.`],
  'whys.3': [`"Enough questions! Can't you see I'm busy?" {name} goes quiet and walks away. You finish on time. Over the next weeks you notice {name} asks the grandparents or the teacher instead, and asks you less.`,
             `"Hỏi gì lắm thế! Không thấy {parent} đang bận à?" {name} im bặt rồi lủi đi. Bạn xong việc đúng giờ. Vài tuần sau, bạn nhận ra {name} hay hỏi bà, hỏi cô, còn hỏi bạn thì ngày càng ít.`],
  'vase.0': [`You crouch down: "I'm not angry. Telling me the truth will never get you punished." A long silence. "I did it. I was jumping." You say thank you, then you sweep up the glass together. The next time something breaks, {name} comes to tell you.`,
             `Bạn ngồi xuống: "{Parent} không giận đâu. Con nói thật thì sẽ không bị phạt." Im lặng rất lâu. "Con làm ạ. Con nhảy lên ghế." Bạn cảm ơn con, rồi hai người cùng quét mảnh vỡ. Lần sau làm vỡ đồ, {name} tự đến kể với bạn.`],
  'vase.1': [`You don't ask. You hand {name} the small broom and say: "Let's clean up." {name} sweeps very seriously. The vase is gone, the floor is clean, and nobody mentions the cat. You never find out what really happened.`,
             `Bạn không hỏi. Bạn đưa {name} cái chổi nhỏ: "Mình cùng dọn nhé." {name} quét rất nghiêm túc. Bình hoa không còn, sàn nhà đã sạch, không ai nhắc đến con mèo. Bạn cũng không bao giờ biết chuyện gì thực sự đã xảy ra.`],
  'vase.2': [`You laugh: "That naughty cat!" {name} laughs too, relieved. It is a sweet moment. A few weeks later the cat has also eaten the last biscuit and drawn on the wall.`,
             `Bạn bật cười: "Con mèo hư quá nhỉ!" {name} cũng cười, nhẹ cả người. Một khoảnh khắc thật vui. Vài tuần sau, con mèo lại bị đổ tội ăn mất cái bánh cuối cùng và vẽ bậy lên tường.`],
  'vase.3': [`"You broke it AND you lied!" You send {name} to the corner for half an hour and take away the cartoons for a week. {name} cries and says sorry. The next time something breaks, it is hidden behind the sofa.`,
             `"Làm vỡ đồ còn nói dối!" Bạn bắt {name} đứng góc nhà nửa tiếng, cấm xem hoạt hình một tuần. {name} khóc, xin lỗi. Lần sau làm vỡ đồ, {name} giấu mảnh vỡ sau ghế sô-pha.`],

// Richer and tighter homes meet some problems the others do not.

// ---- what a choice really does, here and now ------------------------------------------------

    .map(s => [s.id, Math.hypot(v[0] - s.c[0], v[1] - s.c[1], v[2] - s.c[2]) - (s.needShame ? 0.15 : s.needProtect ? 0.3 : 0)]).sort((a, b) => a[1] - b[1]);
  return { v, id: rank[0][0], second: rank[1][0] };
}

// ---- what if: the same choices, in another family ---------------------------------------------------
function replay(G0, presetId) {
  const G = newGame({ seed: G0.seed, preset: presetId, role: G0.role, name: G0.name, gender: G0.gender });
  let blocked = 0, total = 0, guard = 0;
  const find = (s, t, id) => G0.log.find(e => e.s === s && e.t === t && (id == null || e.id === id));
  const cheapest = (opts, lk) => { let best = -1, bv = -99; opts.forEach((o, j) => { if (lk[j]) return; const e = effFx(G, o).energy || 0; if (e > bv) { bv = e; best = j; } }); return best; };
  while (!G.done && guard++ < 400) {
    const st = step(G);
    if (st.t === 'card') {
      const c = CARD[st.id], lk = locks(G, c.opts), e = find(G.stage, 'card', st.id);
      let i = e ? e.o : -1;
      if (e) total++;
      if (i < 0 || lk[i]) { if (e) blocked++; i = cheapest(c.opts, lk); }
      applyCard(G, st.id, i);
    } else if (st.t === 'plan') {
      const e = find(G.stage, 'plan'), picks = [];
      // things that free up time first, so the rest has room
      (e ? e.picks.slice().sort((a, b) => (PLAN[b].addSlot || 0) - (PLAN[a].addSlot || 0)) : []).forEach(id => { total++; if (planBlock(G, picks, id)) blocked++; else picks.push(id); });
      applyPlan(G, picks);
    } else if (st.t === 'exam') {
      const X = EXAMS[st.id], pass = examPassed(G, st.id), e = find(G.stage, 'exam', st.id);
      let i = e && !e.pass ? e.o : 0;
      if (!pass && locks(G, X.fail)[i]) i = 1 - i;
      applyExam(G, st.id, pass, i);
    }
    advance(G);
  }
  return { G, blocked, total };
}


// ---------- The end: how eighteen years went, told as a short story --------------------------------
// The shape of each bar over the years (early, middle, end) picks one sentence.
// hist[i] is the snapshot at ages 0, 1, 3, 6, 9, 12, 15, 18.
const ARC_POINTS = { bond: [2, 5, 7], self: [3, 5, 7], learn: [4, 5, 7], joy: [3, 5, 7] };

function arcOf(vals) {
  const [e, m, f] = vals.map(band), d = f - e;
  if (e >= 2 && m >= 2 && f >= 2) return 'high';
  if (e === 0 && m === 0 && f === 0) return 'low';
  if (d >= 1 && (f >= 2 || e === 0)) return 'rise';
  if (d <= -1 && (e >= 2 || f === 0)) return 'fall';
  if (m < e && m < f) return 'dip';
  if (m > e && m > f) return 'peak';
  return f >= 2 ? 'high' : f === 0 ? 'low' : 'mid';
}
function energyArc(E) {
  const s = energyBand(E[0]), f = energyBand(E[E.length - 1]), rest = E.slice(1), lo = Math.min(...rest), hi = Math.max(...rest);
  if (energyBand(hi) <= 1) return 'tired';
  if (s >= 2 && f <= 1) return 'drained';
  if (energyBand(lo) <= 1 && f >= 2) return 'recover';
  return 'steady';
}
function moneyArc(M) {
  const s = M[0], f = M[M.length - 1], hi = Math.max(...M.slice(1));
  if (hi <= 2) return 'tight';
  if (f >= s + 4) return 'grew';
  if (f <= s - 3 || (f <= 2 && s >= 5)) return 'shrank';
  return 'steady';
}
// Everything the closing paragraphs need, without any words: easy to test in the simulator.
function endArcs(G) {
  const H = G.hist, child = {};
  CHILD.forEach(k => { if (G.seen[k] && H.length >= 8) child[k] = arcOf(ARC_POINTS[k].map(i => H[i][k])); });
  const E = H.map(h => h.energy), M = H.map(h => h.money);
  let lowAt = 1; for (let i = 1; i < E.length; i++) if (E[i] < E[lowAt]) lowAt = i;
  return { child, energy: energyArc(E), money: moneyArc(M), lowAt, uni: G.exams.uni === 'pass' || G.exams.uni === 'retake' ? (G.money >= UNI_COST ? 'ok' : 'short') : null };
}

function gbar() {

const sitHTML = (icon, title, text) => '<div class="sit"><div class="sit-h"><span class="sq" style="--ic:#FFC83D">' + ic(icon) + '</span><h2>' + title + '</h2></div><p>' + text + '</p></div>';

// The ways to answer are shown in a shuffled order (the same every time for one game), so no kind of answer is always on top.

function introScreen(k) {

// A new stage: what came in, what slipped, and what your meters led to. The lines arrive one by one.
function newsLines() {
  const out = [], steady = !Array.isArray(G.income), pay = G.news.find(n => n.k === 'pay'), regen = G.news.find(n => n.k === 'regen');
  const chipsOf = d => MK.map(k => { if (!d[k]) return ''; const x = d[k][1] - d[k][0]; return fxChip(k, METERS[k].child ? (x > 0 ? 1 : -1) * Math.max(1, Math.round(Math.abs(x) / UNIT)) : x); }).join('');
  if (pay || regen) {
    const d = Object.assign({}, pay ? pay.d : {}, regen ? regen.d : {}), got = pay && pay.d.money ? pay.d.money[1] - pay.d.money[0] : 0;
    out.push({ k: 'refill', text: t(!got ? 'n_refill0' : steady ? 'n_refill' : 'n_refill_var', { n: got }), chips: chipsOf(d), d });
  }
  G.news.forEach(n => {
    if (n.k === 'pay' || n.k === 'regen' || !Object.keys(n.d).length) return;
    let key = n.k, v = {};
    if (n.k === 'grow' && G.stage > 1) key = 'grow_s';
    if (n.k === 'low') v.list = CHILD.filter(k => n.d[k]).map(mname).join(t('and'));
    out.push({ k: n.k, text: t('n_' + key, v), chips: chipsOf(n.d), d: n.d });
  });
  return out;
}
GAME.start = () => {

  newsLines().forEach(n => {
    h += '<div class="nline' + w + '"><p>' + n.text + '</p>' + (n.chips ? '<span class="fx">' + n.chips + '</span>' : '') + (n.k === 'worn' ? noteHTML('parentburn') : '') + '</div>';
  });

function runSeq() {
  const lines = newsLines(), vals = Object.assign({}, G.before), els = document.querySelectorAll('.nline');

  timers.push(setTimeout(() => paintHud(snap(G)), 400 + els.length * 700));
}

GAME.exam = st => {

const endAge = s => STAGES[s].ages.split('–')[1];

// ---- flow -------------------------------------------------------------------------------------
function arrive() {               // get the step we are on ready (also after loading a saved game)
  const st = step(G);
  UI.warn = null; UI.picks = []; UI.open = {}; UI.sel = null; UI.tip = null; UI.spareAsk = false; UI.screen = 'game';
  UI.intro = G.res ? [] : pendingIntros();
  if (st.t === 'exam' && !G.res) {
    const pass = examPassed(G, st.id);
    G.res = { t: 'exam', pass, learn: G.m.learn, i: null };
    if (pass) G.res.fx = applyExam(G, st.id, true, 0).fx;

}
function enter() {
  if (step(G).t === 'start') { UI.shown = Object.assign({}, G.before); UI.seq = true; }
  arrive(); saveGame(); render();
}
function proceed() { G.res = null; if (!advance(G)) { finish(); return; } enter(); }
function finish() {
  saveGame();
  UI.unlocked = true; try { localStorage.setItem(UNLOCK_KEY, '1'); } catch (e) { /* ignore */ }
  UI.end = { arch: archetype(G), parent: parentTitle(G), style: computeStyle(G), wi: whatifOf(G).map(id => ({ id, r: replay(G, id) })) };
  UI.endPage = 0; UI.copied = false; UI.open = {}; UI.screen = 'end'; render();
}

// ---- the ending: four short pages ---------------------------------------------------------------
const archName = a => (a.id === 'wip' ? L(ARCHETYPES.wip.sub[a.top]) : L(ARCHETYPES[a.id]));
const at18 = (k, g) => esc(g.name) + ' ' + L(METERS[k].at18[band(g.m[k]) >= 2 ? 0 : band(g.m[k]) === 1 ? 1 : 2]) + '.';
const pathLine = g => [g.exams.g10 ? L(PATHS.g10[g.exams.g10]) : '', g.exams.uni ? L(PATHS.uni[g.exams.uni]) : ''].filter(Boolean).join(' ');
function chartHTML() {
  const ages = [0, 1, 3, 6, 9, 12, 15, 18], x = a => 34 + a / 18 * 212, y = v => 12 + (100 - v) * 1.3;
  let s = '<svg class="chart" viewBox="0 0 320 170" role="img" aria-label="' + t('chart_title') + '">';
  [[0, LOW, '#FBE6E3'], [LOW, GOOD, '#FBF1DA'], [GOOD, GREAT, '#E6F4EC'], [GREAT, 100, '#D2ECDD']].forEach((b, i) => {
    s += '<rect x="34" y="' + y(b[1]) + '" width="212" height="' + (y(b[0]) - y(b[1])) + '" fill="' + b[2] + '"/><text x="252" y="' + (y((b[0] + b[1]) / 2) + 3.5) + '">' + BANDS[i][vi() ? 2 : 1] + '</text>';
  });
  ages.forEach(a => { s += '<text x="' + x(a) + '" y="160" text-anchor="middle">' + a + '</text>'; });
  CHILD.forEach(k => {
    const pts = G.hist.map((h, i) => [x(ages[i]), y(h[k])]);
    s += '<polyline points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '" fill="none" stroke="' + METERS[k].color + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    const e = pts[pts.length - 1]; s += '<circle cx="' + e[0] + '" cy="' + e[1] + '" r="3.6" fill="' + METERS[k].color + '" stroke="#1F2B46" stroke-width="1.5"/>';
  });
  return s + '</svg><div class="legend">' + CHILD.map(k => '<span style="--ic:' + METERS[k].color + '"><i></i>' + mname(k) + '</span>').join('') + '</div>';
}
// Eighteen years in a few sentences: the shape of each bar picks a sentence.
function childStoryHTML() {
  const A = endArcs(G), order = ['bond', 'learn', 'self', 'joy'].filter(k => A.child[k]);
  return '<div class="plain story18"><p class="grp" style="margin:0 0 6px">' + t('story_child', { name: esc(G.name) }) + '</p><p>' + order.map(k => L(ARC_TEXT[k][A.child[k]])).join(' ') + '</p></div>';
}
function parentStoryHTML() {
  const A = endArcs(G);
  return '<div class="plain story18"><p class="grp" style="margin:0 0 6px">' + t('story_you') + '</p><p>' + L(PARENT_TEXT.energy[A.energy], { a: END_AGES[A.lowAt] }) + ' ' + L(PARENT_TEXT.money[A.money]) +
    (A.uni ? ' ' + L(PARENT_TEXT.uni[A.uni]) : '') + '</p></div>';
}
// Your energy and money over the years, one small chart each.
function youChartHTML() {
  const ages = [0, 1, 3, 6, 9, 12, 15, 18], x = a => 34 + a / 18 * 212;
  const one = (k, max, cuts, words, color) => {
    const y = v => 8 + (max - Math.max(0, Math.min(max, v))) / max * 74;
    let s = '<svg class="chart small" viewBox="0 0 320 104" role="img" aria-label="' + mname(k) + '">';
    const fills = ['#FBE6E3', '#FBF1DA', '#E6F4EC', '#D2ECDD'];
    cuts.forEach((c, i) => { const top = i < cuts.length - 1 ? cuts[i + 1] : max; if (top <= c) return; s += '<rect x="34" y="' + y(top) + '" width="212" height="' + (y(c) - y(top)) + '" fill="' + fills[i] + '"/><text x="252" y="' + (y((c + top) / 2) + 3.5) + '">' + words[i] + '</text>'; });
    ages.forEach(a => { s += '<text x="' + x(a) + '" y="98" text-anchor="middle">' + a + '</text>'; });
    const pts = G.hist.map((h, i) => [x(ages[i]), y(h[k])]);
    s += '<polyline points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach((p, i) => { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (i === pts.length - 1 ? 3.6 : 2.2) + '" fill="' + color + '"/>'; });
    return '<p class="small" style="margin:4px 0 0"><b>' + mname(k) + '</b></p>' + s + '</svg>';
  };
  const mMax = Math.max(10, ...G.hist.map(h => h.money));
  return '<div class="plain"><p class="grp" style="margin:0 0 4px">' + t('chart_you') + '</p>' +
    one('energy', 10, [0, 1, 3, 6], E_BANDS.map(b => b[vi() ? 1 : 0]), '#0E8C8A') + one('money', mMax, [0, 1, 3, 6], M_BANDS.map(b => b[vi() ? 1 : 0]), '#E89B2D') + '</div>';
}
const END = [
  () => {                                      // 1. the young adult: what is strongest, and what it cost
    const a = UI.end.arch, r = ranked(G), top = r[0], low = r[r.length - 1];
    return '<div class="head">' + avatar('teen', G.gender, outfit(), mood(), 128) + '<h2>' + t('end_child') + '</h2><span class="ribbon">' + archName(a) + '</span><p>' + L(ARCHETYPES[a.id].line) + '</p></div>' +
      '<div class="plain"><dl class="gl" style="margin:0"><dt class="g">' + t('end_gain') + '</dt><dd><b>' + mname(top) + '.</b> ' + at18(top, G) + '</dd><dt class="c">' + t('end_cost') + '</dt><dd>' +
      (band(G.m[low]) < 2 ? '<b>' + mname(low) + '.</b> ' + at18(low, G) : t('end_nocost')) + '</dd></dl></div>' +
      '<div class="hbox"><span class="hlab">' + esc(G.name) + '</span><div class="hgrid">' + CHILD.map(k => meterHTML(k, G.m[k])).join('') + '</div></div>' +
      '<div class="youbox">' + pathLine(G) + '</div><div class="plain"><p class="grp" style="margin:0 0 8px">' + t('chart_title') + '</p>' + chartHTML() + '</div>' + childStoryHTML();
  },
  () => {                                      // 2. you
    const P = PARENT_TITLES[UI.end.parent], kk = Object.keys(KINDS), n = kk.reduce((a, k) => a + G.kinds[k], 0), uni = G.exams.uni === 'pass' || G.exams.uni === 'retake';
    let h = '<div class="head"><h2>' + t('end_you') + '</h2><span class="ribbon">' + L(P) + '</span><p>' + L(P.line) + '</p></div>' +
      youChartHTML() + parentStoryHTML();
    h += '<div class="plain"><p class="grp" style="margin:0 0 10px">' + t('hard_title', { n }) + '</p><div class="kinds">';
    kk.forEach(k => { if (G.kinds[k]) h += '<div class="kind" style="--ic:' + (k === 'teach' || k === 'soothe' ? '#0E8C8A' : k === 'harsh' ? '#E63946' : '#9AA3B5') + '"><span>' + L(KINDS[k].t) + '</span><b>' + t('times', { n: G.kinds[k] }) + '</b><div class="bar"><i style="width:' + (G.kinds[k] / Math.max(1, n) * 100) + '%"></i></div></div>'; });
    h += '</div></div>';
    if (G.tired) h += '<div class="row"><p>' + t('tired_line', { n: G.tired }) + '</p></div>';
    if (G.shut) h += '<div class="row"><p>' + t('shut_line', { n: G.shut }) + '</p></div>';
    return h;
  },
  () => {                                      // 3. the style
    const S = STY[UI.end.style.id], S2 = STY[UI.end.style.second];
    return '<div class="head"><span class="sq huge" style="--ic:#FFC83D">' + ic('s_' + S.id) + '</span><h2>' + t('end_style') + '</h2><p class="muted">' + t('style_near') + '</p><span class="ribbon">' + esc(L(S)) + '</span></div>' +
      '<div class="plain col" style="gap:10px"><p>' + L(S.desc) + '</p><dl class="gl" style="margin:0"><dt class="g">' + t('style_gain') + '</dt><dd>' + L(S.gain) + '</dd><dt class="c">' + t('style_cost') + '</dt><dd>' + L(S.cost) + '</dd></dl></div>' +
      '<div class="row"><p><b>' + t('style_second', { s: esc(L(S2)) }) + '</b> ' + L(S2.desc) + '</p></div>' +
      '<button class="more solo" data-a="more" data-k="styles" aria-expanded="' + !!UI.open.styles + '">' + t(UI.open.styles ? 'see_less' : 'see_more_styles') + '</button>' +
      (UI.open.styles ? '<div class="col" style="gap:8px">' + Object.keys(STY).filter(k => k !== S.id && k !== S2.id).map(k => '<div class="row"><p><b>' + esc(L(STY[k])) + '.</b> ' + L(STY[k].desc) + '</p><p class="small"><span class="g">' + t('style_gain') + ':</span> ' + L(STY[k].gain) + ' <span class="c">' + t('style_cost') + ':</span> ' + L(STY[k].cost) + '</p></div>').join('') + '</div>' : '') + noteHTML('style') + '<p class="muted center" style="font-size:13.5px">' + t('style_note') + '</p>';
  },
  () => {                                      // 4. the same choices in another family
    let h = '<div class="head"><h2>' + t('wi_title') + '</h2><p class="muted">' + t('wi_sub', { n: UI.end.wi.length ? UI.end.wi[0].r.total : 0 }) + '</p></div><p class="keyline"><s></s>' + t('wi_yours') + '</p>';
    if (UI.open.fams && !UI.end.wiMore) UI.end.wiMore = PRESETS.map(p => p.id).filter(id => id !== G.preset && !UI.end.wi.some(w => w.id === id)).map(id => ({ id, r: replay(G, id) }));
    UI.end.wi.concat(UI.open.fams ? UI.end.wiMore : []).forEach(w => {
      const P = PRE[w.id], R = w.r.G;
      h += '<div class="wi"><div class="wh"><span class="sq" style="--ic:' + famColor(w.id) + '">' + ic('p_' + w.id) + '</span><div><b>' + esc(L(P)) + '</b><span>' + L(P.desc) + '</span></div></div>' +
        '<p>' + (w.r.blocked ? t('wi_blocked', { n: '<b>' + w.r.blocked + '</b>' }) : t('wi_all')) + '</p><p><b>' + t('end_child') + ': ' + archName(archetype(R)) + '.</b> ' + pathLine(R) + '</p>' +
        '<div class="wgrid">' + CHILD.map(k => meterHTML(k, R.m[k], false, G.m[k], 0, false)).join('') + '</div></div>';
    });
    h += '<button class="more solo" data-a="more" data-k="fams" aria-expanded="' + !!UI.open.fams + '">' + t(UI.open.fams ? 'see_less' : 'see_more_fams') + '</button>';
    return h + '<p class="lead center">' + t('wi_close') + '</p><p class="muted center" style="font-size:12.5px">' + t('model_note') + '</p>';
  }
];
SCREENS.end = () => {
  const p = UI.endPage, last = p === END.length - 1;
  return '<div class="topbar">' + (p > 0 ? '<button class="mini" data-a="endprev">' + t('back') + '</button>' : '') + '<div class="pager" style="flex:1">' + END.map((x, i) => '<i class="' + (i === p ? 'on' : '') + '"></i>').join('') + '</div>' + langBtn() + '</div>' +
    '<div class="scroll col">' + END[p]() + (last ? '<div class="endbtns"><button class="btn alt sm" data-a="copy">' + t(UI.copied ? 'copied' : 'btn_copy') + '</button><button class="btn sm" data-a="again">' + t('btn_again') + '</button></div>'
      : '<button class="btn" data-a="endnext">' + t('next') + ic('arrow') + '</button>') + '</div>';
};
function summaryText() {
  const plain = s => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
  return plain(t('sum', { title: t('title'), arch: archName(UI.end.arch), m: CHILD.map(k => mname(k) + ': ' + bandWord(k, G.m[k])).join(', '), style: esc(L(STY[UI.end.style.id])) }));
}

// ---- actions ------------------------------------------------------------------------------------------
const DO = {
  lang: el => { setLang(el.dataset.l); render(); },
  start: () => { UI.screen = 'family'; render(); },
  continue: () => { const sv = readSave(); if (!sv) return; G = sv.G; lastSave = JSON.stringify(sv); UI.shown = snap(G); arrive(); render(); },
  fam: el => { UI.pick = el.dataset.id; UI.screen = 'meet'; render(); },
  mine: () => { UI.screen = 'mine'; render(); },
  minestep: el => { const k = el.dataset.k, r = MINE[k], d = +el.dataset.d; if (d > 0 && minePoints(UI.mine) >= MINE_BUDGET) return; UI.mine[k] = Math.max(r[0], Math.min(r[1], UI.mine[k] + d)); render(); },
  mineflag: el => { const k = el.dataset.k; if (k === 'skill' && !UI.mine.skill && minePoints(UI.mine) >= MINE_BUDGET) return; UI.mine[k] = !UI.mine[k]; render(); },
  minego: () => { UI.custom = makeMine(); UI.pick = 'mine'; UI.screen = 'meet'; render(); },
  meter: el => showSheet(el.dataset.k),
  closesheet: () => closeSheet(),
  noop: () => {},
  back: () => { UI.screen = 'family'; render(); },
  role: el => { UI.setup.role = el.dataset.v; render(); },
  gender: el => { UI.setup.gender = el.dataset.v; render(); },
  sugg: el => { UI.setup.name = el.dataset.v; render(); },
  meet: () => {
    const S = UI.setup;
    G = newGame({ seed: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), preset: UI.pick, custom: UI.pick === 'mine' ? UI.custom : null, role: S.role, name: S.name.trim() || 'An', gender: S.gender });
    UI.shown = snap(G); UI.intro = []; UI.screen = 'hello'; saveGame(); render();
  },
  begin: () => enter(),
  introok: () => { const k = UI.intro.shift(); if (k) G.seen[k] = 1; saveGame(); render(); },
  sel: el => { UI.sel = { act: el.dataset.act, i: +el.dataset.i }; UI.tip = null; render(); },
  confirm: () => { if (!UI.sel) return; const s2 = UI.sel; UI.sel = null; DO[s2.act]({ dataset: { i: s2.i } }); },
  temperopen: () => { UI.temperOpen = true; render(); },
  temper: el => { setTemper(G, el.dataset.k); UI.shown = snap(G); UI.temperOpen = false; saveGame(); render(); },
  more: el => { UI.open[el.dataset.k] = !UI.open[el.dataset.k]; render(); },
  pick: el => { const st = step(G), i = +el.dataset.i, notes = eff(G, CARD[st.id].opts[i]).notes, r = applyCard(G, st.id, i); if (!r) return; G.res = { t: 'card', i, fx: r.fx, notes }; UI.open = {}; saveGame(); render(); },
  exampick: el => { const i = +el.dataset.i, r = applyExam(G, step(G).id, false, i); G.res.i = i; G.res.fx = r.fx; saveGame(); render(); },
  next: () => proceed(),
  ptoggle: el => { const why = planToggle(G, UI.picks, el.dataset.id); UI.warn = why ? 'block_' + why : null; render(); },
  plandone: () => { const tot = planTotals(G, UI.picks); if (tot.slots - tot.used > 0) { UI.spareAsk = true; render(); return; } applyPlan(G, UI.picks); proceed(); },
  planmore: () => { UI.spareAsk = false; render(); },
  planforce: () => { UI.spareAsk = false; applyPlan(G, UI.picks); proceed(); },
  tip: el => { UI.tip = UI.tip === el.dataset.k ? null : el.dataset.k; render(); },
  endnext: () => { UI.endPage = Math.min(END.length - 1, UI.endPage + 1); UI.open = {}; render(); },
  endprev: () => { UI.endPage = Math.max(0, UI.endPage - 1); UI.open = {}; render(); },
  again: () => { clearSave(); G = null; UI.end = null; UI.shown = null; UI.intro = []; UI.screen = 'family'; render(); },
  copy: () => {
    const txt = summaryText(), done = () => { UI.copied = true; render(); };
    try { navigator.clipboard.writeText(txt).then(done, done); } catch (e) { done(); }
  }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (el && DO[el.dataset.a]) DO[el.dataset.a](el);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset && ev.target.dataset.a === 'meter') { ev.preventDefault(); showSheet(ev.target.dataset.k); }
});
document.addEventListener('input', ev => {
  if (ev.target.id !== 'child-name') return;
  UI.setup.name = ev.target.value;
  const b = $('#meet-btn'); if (b) b.innerHTML = t('btn_meet', { name: esc(UI.setup.name.trim() || 'An') });
});

// ---- boot (also survives a republish of the page through window.claude.hot) -------------------------------
function boot(data) {
  try { if (localStorage.getItem(UNLOCK_KEY) === '1') UI.unlocked = true; } catch (e) { /* ignore */ }
  if (data && data.unlocked) UI.unlocked = true;
  try { const l = localStorage.getItem(LANG_KEY); if (l === 'en' || l === 'vi') UI.lang = l; } catch (e) { /* ignore */ }
  if (data && data.lang) UI.lang = data.lang;
  const sv = data && data.save ? readSave(data.save) : null;
  if (sv) { G = sv.G; lastSave = data.save; UI.shown = snap(G); if (G.done) finish(); else { arrive(); render(); } } else render();
}
const HOT = window.claude && window.claude.hot;
if (HOT && HOT.snapshot) HOT.snapshot(() => ({ save: lastSave, lang: UI.lang, unlocked: UI.unlocked }));
if (HOT && HOT.ready) HOT.ready(boot); else boot((HOT && HOT.data) || {});
</script>
</body>
</html>
