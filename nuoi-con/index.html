<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>18 Năm Nuôi Con</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a board game on the kitchen table. One phone-width column: the meters pinned on top,
     one situation card at a time below, big ink-outlined buttons to answer with. */
  --paper:#FAF3E6; --card:#FFFDF8; --ink:#1F2B46; --ink2:#5C6884; --line:#E3D8C4;
  --accent:#0E8C8A; --accent-d:#0A5F5E; --accent-t:#DCF2EE; --sun:#FFC83D;
  --trap:#E63946; --trap-d:#B3202C; --trap-t:#FDECEA; --good:#0E7C58; --bad:#C52F3C;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;overflow:hidden;
  background-image:radial-gradient(rgba(31,43,70,.055) 1px,transparent 1.2px);background-size:18px 18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance;line-height:1.15}
a{color:var(--accent-d);font-weight:600}
#shell{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
#shell.wide{max-width:760px}
#app{height:100%;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.col{display:flex;flex-direction:column;gap:14px}.col>*{flex-shrink:0}
.muted{color:var(--ink2)}.small{font-size:12.5px}.center{text-align:center}.num{font-variant-numeric:tabular-nums}

/* icons */
.ic{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.28em}
.ic .d{fill:var(--ic,var(--accent));fill-opacity:.4}
.ic .f{fill:currentColor;stroke:none}
.ic.tint{color:color-mix(in srgb,var(--ic) 62%,var(--ink))}
.sq{width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--ic) 20%,#fff);border:2px solid color-mix(in srgb,var(--ic) 50%,#fff)}
.sq .ic{width:30px;height:30px}
.sq.big{width:60px;height:60px;border-radius:19px}.sq.big .ic{width:38px;height:38px}
.sq.huge{width:76px;height:76px;border-radius:24px}.sq.huge .ic{width:48px;height:48px}
.ric{fill:none;stroke:#1F2B46;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ric .d{fill:var(--ic);fill-opacity:.45}.ric .f{fill:#1F2B46;stroke:none}
.avatar{display:block;flex:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border-radius:17px;border:2px solid var(--ink);
  background:var(--accent);color:#fff;font-weight:800;font-size:16.5px;text-align:center;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.sm{min-height:46px;font-size:14px;padding:8px 12px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.lang button{min-width:40px;min-height:32px;padding:0 9px;font-size:12px;font-weight:800;text-align:center}
.lang button.on{background:var(--ink);color:#fff}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 16px 0}
.topbar h2{flex:1;font-size:20px;font-weight:800}

/* title */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 0;text-align:center}
.hero h1{font-size:clamp(46px,15vw,66px);font-weight:800;letter-spacing:-.045em;line-height:.9;text-transform:uppercase}
.hero h1 span{display:block}.hero h1 span+span{color:var(--accent)}
.hero .sub{font-weight:600;font-size:16px}
.ruler{position:relative;width:100%;max-width:330px;height:46px;margin:6px 0 10px;border-top:2.5px solid var(--ink);
  background:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px calc(100%/18));background-size:100% 8px;background-repeat:no-repeat}
.ruler b{position:absolute;top:0;width:2.500px;height:16px;background:var(--ink);transform:translateX(-50%)}
.ruler i{position:absolute;top:19px;font-style:normal;font-size:12px;font-weight:800;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.ruler i.end{color:var(--accent-d);font-size:15px;top:17px}
.grow{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.foot{font-size:11.500px;color:var(--ink2);text-align:center;padding-top:8px}

.fam{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:0 3px 0 var(--ink)}
.fam:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.fam b{display:block;font-weight:800;font-size:15.5px;line-height:1.25}
.fam p{font-size:13px;color:var(--ink2);margin:2px 0 7px}
.facts{display:flex;flex-wrap:wrap;gap:4px 6px}
.fact{display:inline-flex;gap:4px;align-items:baseline;font-size:12px;padding:2px 8px;border-radius:999px;background:#fff;border:1.5px solid var(--line);white-space:nowrap}
.fact b{display:inline;font-size:12px}.fact.lo b{color:var(--bad)}.fact.hi b{color:var(--good)}
.fact.note{border-style:dashed;color:var(--ink2);font-weight:600}

/* setup */
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>span.lab{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;padding:9px;border:2px solid var(--ink);border-radius:16px;background:var(--card);font-weight:800;box-shadow:0 3px 0 var(--ink);text-align:center}
.opt.row{flex-direction:row;gap:8px}
.opt.on{background:var(--accent-t);border-color:var(--accent-d);box-shadow:0 3px 0 var(--accent-d)}
.opt .ic{width:26px;height:26px}
input[type=text]{width:100%;min-height:52px;padding:10px 14px;border:2px solid var(--ink);border-radius:16px;background:#fff;font:inherit;font-size:18px;font-weight:600;color:var(--ink)}
.sugg{display:flex;flex-wrap:wrap;gap:7px}
.sugg button{min-height:38px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);font-weight:600;font-size:14px}
.mini{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 10px;border-radius:11px;font-size:12px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.head h2{font-size:23px;font-weight:800}

/* in-game top bar: who, how old, how far */
.gbar{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
.gbar .who{flex:1;min-width:0;line-height:1.2}
.gbar .who b{display:block;font-weight:800;font-size:16px}
.gbar .who span{font-size:12.5px;color:var(--ink2);font-weight:600}
.prog{display:flex;gap:4px;align-items:center}
.prog i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:transparent}
.prog i.done{background:var(--ink)}.prog i.now{background:var(--sun);width:12px;height:12px}

/* the meters */
.hud{margin:10px 16px 0;padding:10px 12px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:9px}
.hud-child{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.mt{min-width:0;position:relative}
.mt-top{display:flex;align-items:center;gap:5px;font-size:13px;line-height:1.2;margin-bottom:4px}
.mt-top .ic{width:17px;height:17px;color:color-mix(in srgb,var(--ic) 62%,var(--ink))}
.mt-top b{font-weight:800;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mt-top em{margin-left:auto;flex:none;font-style:normal;font-weight:600;font-size:12px;color:var(--ink2);white-space:nowrap}
.mt-top em.b0{color:var(--bad);font-weight:800}.mt-top em.b3{color:var(--good);font-weight:800}
.bar{position:relative;height:10px;border-radius:6px;background:#EFE7D8;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ic);transition:width .7s cubic-bezier(.3,.8,.3,1)}
.bar>u{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(31,43,70,.28)}
.bar>s{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--ink);border-radius:2px}
.hud-you{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;padding-top:8px;border-top:1.5px dashed var(--line)}
.hud-you:first-child{padding-top:0;border-top:0}
.rs{display:flex;align-items:center;gap:5px;font-size:13px;min-width:0;position:relative}
.rs .ic{width:17px;height:17px;color:color-mix(in srgb,var(--ic) 62%,var(--ink))}
.rs b{font-weight:800;white-space:nowrap}
.rs strong{font-weight:800;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.rs em{margin-left:auto;font-style:normal;font-weight:600;font-size:12px;color:var(--ink2);white-space:nowrap}
.rs em.b0{color:var(--bad);font-weight:800}
.mt.isnew .mt-top b,.rs.isnew b{background:var(--sun);border-radius:5px;padding:0 4px;margin:0 -1px}
.bump{animation:bump .7s}
@keyframes bump{30%{transform:scale(1.06)}60%{transform:scale(.98)}}
.fly{position:absolute;right:0;top:-13px;font-size:12px;background:var(--card);border-radius:6px;padding:0 3px;z-index:2;font-weight:800;pointer-events:none;animation:fly 1.5s forwards}
.fly.up{color:var(--good)}.fly.down{color:var(--bad)}
@keyframes fly{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* a situation */
.sit{display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--ink);animation:rise .35s cubic-bezier(.2,.8,.3,1)}
.sit-h{display:flex;align-items:center;gap:11px}
.sit h2{font-size:19px;font-weight:800}
.sit p{font-size:16px;line-height:1.5}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* a new meter is introduced */
.intro{position:relative;padding:11px 13px 11px 14px;border-radius:16px;background:color-mix(in srgb,var(--ic) 12%,#fff);border:2px solid color-mix(in srgb,var(--ic) 55%,var(--ink));animation:rise .4s .1s both}
.intro-h{display:flex;align-items:center;gap:6px;font-size:15.5px;margin-bottom:3px}
.intro-h b{font-weight:800}
.intro-h .ic{width:20px;height:20px;color:color-mix(in srgb,var(--ic) 62%,var(--ink))}
.newtag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;background:var(--sun);border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px}
.intro p{font-size:13.5px;line-height:1.4}
.intro p.hl{color:var(--ink2);margin-top:2px}

/* the ways to answer */
.opts{display:flex;flex-direction:column;gap:11px}
.optn{display:flex;flex-direction:column;gap:7px;width:100%;padding:13px 14px;border-radius:17px;border:2px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;animation:rise .35s both}
.optn:nth-child(2){animation-delay:.06s}.optn:nth-child(3){animation-delay:.12s}
button.optn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.optn .ot{font-weight:800;font-size:15.5px;line-height:1.35}
.optn.locked{background:#F1EADB;border-style:dashed;box-shadow:none;color:var(--ink2)}
.optn.locked .fxc{opacity:.65}
.lockmsg{display:flex;gap:5px;align-items:flex-start;font-size:12.5px;font-weight:800;color:var(--bad);line-height:1.35}
.lockmsg .ic{width:15px;height:15px;margin-top:1px}
.optn.chosen{background:var(--accent-t);border-color:var(--accent-d);box-shadow:0 4px 0 var(--accent-d);animation:none}
.fx{display:flex;flex-wrap:wrap;gap:5px}
.fxc{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.45}
.fxc>i{width:9px;height:9px;border-radius:50%;background:var(--ic);flex:none}
.fxc b{font-weight:800;font-variant-numeric:tabular-nums}
.fxc.up b{color:var(--good)}.fxc.down b{color:var(--bad)}
.fxc.flat{color:var(--ink2);padding-left:9px;white-space:normal}
.out{font-size:15.5px;line-height:1.55;padding:2px 2px 0;animation:fade .5s .15s both}

/* the plan */
.plan-h h2{font-size:19px;font-weight:800}
.plan-h p{font-size:14.5px;margin-top:4px}
.plan-h p b{font-weight:800}
.grp{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:4px 0 -6px}
.pitem{display:flex;gap:11px;align-items:flex-start;width:100%;padding:11px 12px;border-radius:16px;border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink)}
.pitem:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pitem .tick{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;margin-top:1px}
.pitem .tick .ic{width:18px;height:18px;color:#fff;stroke-width:3;opacity:0}
.pitem.on{background:var(--accent-t);border-color:var(--accent-d);box-shadow:0 3px 0 var(--accent-d)}
.pitem.on .tick{background:var(--accent);border-color:var(--accent-d)}.pitem.on .tick .ic{opacity:1}
.pitem.dim{opacity:.55}
.pitem .pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pitem .ot{font-weight:800;font-size:14.5px;line-height:1.3}
.cta{padding:10px 16px 14px;display:flex;flex-direction:column;gap:7px;background:linear-gradient(transparent,var(--paper) 22%)}
.cta .hint{font-size:13px;font-weight:600;text-align:center;color:var(--ink2);min-height:19px}
.cta .hint.warn{color:var(--bad);font-weight:800;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* a new stage: pay, rest, growing */
.nline{display:flex;flex-direction:column;gap:6px;padding:11px 13px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);transition:opacity .4s,transform .4s}
.nline p{font-size:14.5px;line-height:1.45}
.nline.wait{opacity:0;transform:translateY(10px)}
.nline.note{border-style:dashed;background:transparent;color:var(--ink2)}

/* recap rows and ending */
.row{display:flex;flex-direction:column;gap:5px;padding:11px 13px;border-radius:15px;background:var(--card);border:1.5px solid var(--line)}
.row .mt-top{margin-bottom:0;font-size:14px}
.row p{font-size:14px;line-height:1.45}
.row .tr{font-weight:800;font-size:11.5px;margin-left:5px;white-space:nowrap}.tr.up{color:var(--good)}.tr.down{color:var(--bad)}
.youbox{padding:12px 14px;border-radius:15px;border:1.5px dashed var(--ink2);font-size:14.5px;line-height:1.5}
.youbox b{font-weight:800}
.ribbon{display:inline-block;background:var(--sun);border:2px solid var(--ink);border-radius:14px;padding:7px 16px;font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg);line-height:1.15}
.pager{display:flex;gap:5px;justify-content:center}
.pager i{width:22px;height:5px;border-radius:3px;background:var(--line)}.pager i.on{background:var(--ink)}
.kinds{display:flex;flex-direction:column;gap:6px}
.kind{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.kind .bar{grid-column:1/-1;height:8px}
.kind b{font-weight:800}
.gl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14.5px;line-height:1.45}
.gl dt{font-weight:800}.gl dt.g{color:var(--good)}.gl dt.c{color:var(--bad)}.gl dd{margin:0}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:10px;fill:var(--ink2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12.5px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:14px;height:4px;border-radius:2px;background:var(--ic)}
.wi{display:flex;flex-direction:column;gap:9px;padding:13px;border-radius:var(--r);border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink)}
.wi .wh{display:flex;gap:10px;align-items:center}.wi .wh b{font-weight:800;line-height:1.2;display:block}.wi .wh span{font-size:12.5px;color:var(--ink2)}
.wi p{font-size:13.5px;line-height:1.45}
.wi .mt-top{font-size:12.5px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.keyline{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.keyline s{display:inline-block;width:3px;height:12px;background:var(--ink);border-radius:2px}
.endbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media(max-width:350px){.scroll{padding-left:12px;padding-right:12px}.hud{margin-left:12px;margin-right:12px}.mt-top em,.rs em{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- version 4 ---- two boxes for the meters, speech bubbles for new ones, "what does that look like?" */
.hud{margin:6px 16px 0;padding:8px 0 0;border:0;background:none;box-shadow:none;border-radius:0;display:flex;flex-direction:column;gap:13px}
.hud+.hud{margin-top:13px;padding-top:0}
.hbox{position:relative;padding:11px 12px 10px;background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink)}
.hbox.you{background:#FFF7E3}
.hlab{position:absolute;top:-10px;left:12px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:1px 9px;border-radius:999px;text-transform:uppercase;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.bubble{position:relative;margin:15px 16px 2px;padding:13px 14px;border-radius:18px;background:#fff;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);animation:rise .35s}
.bubble::before{content:'';position:absolute;top:-9px;left:var(--tail,25%);width:14px;height:14px;background:#fff;border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.notail::before{display:none}
.bubble p{font-size:15px;line-height:1.45}
.bubble p.hl{color:var(--ink2);margin-top:5px;font-size:14px}
.bubble p.legend2{margin-top:10px;padding-top:9px;border-top:1.5px dashed var(--line);font-size:13.5px;font-weight:600;color:var(--ink)}
.bubble .intro-h{font-size:17px;margin-bottom:5px}
.optn{padding:0;gap:0;overflow:hidden}
.omain{display:flex;flex-direction:column;gap:7px;width:100%;padding:13px 14px}
button.omain:active{background:var(--accent-t)}
.more{align-self:flex-start;margin:-3px 14px 9px;padding:3px 0;min-height:28px;font-size:12.5px;font-weight:800;color:var(--accent-d);text-decoration:underline;text-underline-offset:3px}
.more.solo{margin:-4px 2px 0}
.detail{margin:0 14px 12px;padding:10px 12px;border-radius:12px;background:#F6F0E2;font-size:13.5px;line-height:1.5;display:flex;flex-direction:column;gap:5px;animation:fade .25s}
.detail .nt{color:var(--ink2);font-size:12.5px}
.more.solo+.detail{margin:0}

<script>
/* ======================================================================
   EIGHTEEN YEARS / 18 NĂM NUÔI CON  ·  version 4.6
   One file, no build step. Order: data tables, rules, icons, screens.

   How the game works
   - ONE thing on screen at a time: a new meter being introduced (a speech bubble pointing at it),
     a situation with 3-4 ways to answer, the plan for the stage, the start of a new stage, a recap.
   - SIX meters, always named in words:
       the child (bars, with a word: Low / OK / Good / Great):  Closeness, Independence, Learning, Wellbeing
       you (plain numbers, with a word):                        Your energy, Money
   - Every way to answer shows exactly what it does right now, e.g. "Closeness ▲▲ · Your energy −3".
     One ▲ or ▼ is one step = UNIT points on a 0-100 bar.
   - No way is simply right. Calm teaching and comforting cost energy; stepping back is free but leaves
     the child alone with it; giving in or doing it for them gives energy back and costs independence;
     shouting gives energy and quick results and costs closeness. Most situations offer four of these.
   - What a thing gives depends on where you stand (see eff() in the rules): rest gives more when you are
     exhausted, extra work pays more when money is short, a Low bar rises faster, a Great bar rises slowly,
     and a routine kept from the stage before gives one step more. A "?" on the choice explains each case.
   - Each new stage shows, line by line: pay arrives, you recover, every bar slips DRIFT steps
     (DRIFT_LOW if it was Low), and what your meters led to (very close -> happier; an independent
     child -> you get energy back; an exhausted child -> learning slips; you at 0 energy -> closeness drops).
   - At 15 and at 18 an exam is decided by Learning. At 18 the bars are read out as what is strongest
     and what it cost, then you, then your parenting style, then the same choices in two other families.
   - After a choice, one "Explain more" link shows what you did, why the numbers were what they were, and
     for some situations one research finding with its source (NOTES).
   - Tapping any meter opens what its level means at the child's current age (LEVELS) and what it does
     in the game (RULES). The recap after each stage shows the bars and one line about the child.
   - After one finished game, "My family" appears: the player sets pay, energy back and time (MINE).

   Tuning knobs (all in the data section): UNIT, DRIFT, DRIFT_LOW, LOW_BOOST, GREAT_CAP, REST_TIERS,
   WORK_TIERS, HABIT_BONUS, the families' numbers, each option's fx, MOMENTS_PER_STAGE, LIFE_CHANCE,
   EXAMS passAt / maybeAt, ARCH, STYLE_DIV.

   Balance check (test/sim.js, 150 seeded games per play style and family; average of the four bars at 18):
   thoughtful play ends around 70-74 for the professional couple, the teacher family and the freelancer,
   65-70 office, 62-65 owner, 55 factory, 50-52 single mom and parents-far-away.
   Leaning on one kind of answer (office family): teach 67, comfort 67, step back 60, do-it-for-them 59,
   give in 57, harsh 37. Choosing at random: 26-42. A child left to slide until age 6 (bars around 30)
   can be brought back to OK by 12 and, in the better-off families, to Good by 15.
   ====================================================================== */
'use strict';
/* ====================================================================
   GAME DATA — every number and every sentence the game uses.
   Texts are pairs: [English, Vietnamese].
   Child meters run 0–100 but are shown as a bar and a word.
   In the tables, child effects are written in ARROWS: 2 means ▲▲, -1 means ▼.
   Energy and Money are written in plain points.
   ==================================================================== */

const STAGES = [
  { ages: '0–1',   en: 'Newborn',       vi: 'Sơ sinh',         av: 'baby',    band: 'little', brief: [`Everything is new. Your baby needs feeding, holding and sleep, around the clock. What it asks of you most: nights.`, `Mọi thứ đều mới. Bé cần ăn, cần được bế, cần ngủ cả ngày lẫn đêm. Điều ba mẹ cần nhất trong giai đoạn này: sức chịu đựng qua những đêm mất ngủ.`] },
  { ages: '1–3',   en: 'Toddler',       vi: 'Chập chững',      av: 'toddler', band: 'little', brief: [`Walking, first words, and "No!". Your toddler wants to do everything alone and cannot yet wait. What it asks of you most: patience.`, `Con bắt đầu biết đi, bập bẹ nói và hay nói "Không!". Con muốn tự làm mọi thứ nhưng chưa biết chờ đợi. Điều ba mẹ cần nhất lúc này: thật nhiều kiên nhẫn.`] },
  { ages: '3–6',   en: 'Preschool',     vi: 'Mầm non',         av: 'kid',     band: 'little', brief: [`Endless questions, friends and pretend play. Your child starts to understand rules, and to test them. What it asks of you most: time to talk and play.`, `Con hỏi đủ thứ, bắt đầu có bạn và thích chơi đóng vai. Con dần hiểu các quy tắc, nhưng cũng thích thử xem mình có thể làm đến đâu. Điều ba mẹ cần nhất lúc này: thời gian trò chuyện và chơi cùng con.`] },
  { ages: '6–9',   en: 'Early primary', vi: 'Đầu tiểu học',    av: 'kid',     band: 'school', brief: [`School begins: homework, marks and a teacher to please. Your child learns that effort and results are measured. What it asks of you most: help without taking over.`, `Con bắt đầu đi học, làm bài tập, nhận điểm và làm quen với cô giáo. Con dần hiểu rằng cả sự cố gắng lẫn kết quả đều được đánh giá. Điều ba mẹ cần nhất lúc này: giúp con nhưng đừng làm thay.`] },
  { ages: '9–12',  en: 'Late primary',  vi: 'Cuối tiểu học',   av: 'preteen', band: 'school', brief: [`Friends matter more, comparisons start, and the first exams appear. Your child wants more say. What it asks of you most: trust, and letting small mistakes happen.`, `Bạn bè ngày càng quan trọng, con bắt đầu bị so sánh và trải qua những kỳ thi đầu tiên. Con cũng muốn tự quyết nhiều hơn. Điều ba mẹ cần nhất lúc này: tin con và cho con tự mắc những lỗi nhỏ.`] },
  { ages: '12–15', en: 'Young teen',    vi: 'Mới lớn',         av: 'teen',    band: 'teen', brief: [`Puberty, moods, a phone and a closed door. Your child pulls away to find who they are. What it asks of you most: staying close without pushing in.`, `Con bước vào tuổi dậy thì, tâm trạng thất thường, suốt ngày bên điện thoại và thường đóng cửa phòng. Con muốn có không gian riêng để tìm hiểu bản thân. Điều ba mẹ cần nhất lúc này: ở gần nhưng đừng can thiệp quá sâu.`] },
  { ages: '15–18', en: 'Older teen',    vi: 'Sắp trưởng thành', av: 'teen',   band: 'teen', brief: [`Big exams and the first big choices: school, subject, friends, love. Your child is nearly an adult. What it asks of you most: support, and stepping back.`, `Những kỳ thi quan trọng và lựa chọn lớn đầu tiên đang đến: trường học, ngành học, bạn bè, tình cảm. Con sắp trưởng thành. Điều ba mẹ cần nhất lúc này: ủng hộ và biết khi nào nên lùi lại.`] }
];

// ---- The six meters --------------------------------------------------------------
// what: one line shown when the meter first appears.  hi / lo: what high and low mean.

// at18: [great, in between, worrying] — the sentence used on the ending screen.
const METERS = {

      out: [`It stops at once. Fear works fast. What {name} learns is that you get scary, not that there's no candy today.`, `{name} nín ngay. Dọa nạt đúng là có tác dụng. Nhưng điều {name} học được là bạn đáng sợ, chứ không phải hôm nay không được ăn kẹo.`] }] },
  { id: 'biting', note: 'spank', s: [2, 3], icon: 'bullied', title: [`A bite at the playground`, `Cắn bạn ở sân chơi`],
    text: [`{name} bites another child to get a shovel. The other parent is staring at you.`, `{name} cắn một bạn khác để giành cái xẻng. Phụ huynh bên kia nhìn bạn chằm chằm.`], opts: [
    { k: 'teach', en: `You hold {name}'s hands, then practise asking for a turn`, vi: `Bạn giữ tay {name} lại, rồi dạy con cách xin mượn đồ`, fx: { self: 1, bond: 1, energy: -2 },
      d: [`You say: "Biting hurts. I won't let you bite." Then, together: "Can I have a turn?" You hold out your hand and {name} tries the words on you first.`, `Bạn nói: "Cắn là đau. {Parent} không để con cắn bạn." Rồi hai người cùng tập câu "Cho tớ mượn nhé". Bạn chìa tay ra để {name} tập nói với bạn trước.`],
      out: [`Small children bite because they can't yet say what they want. You just gave {name} the words.`, `Trẻ nhỏ thường cắn vì chưa biết cách nói điều mình muốn. Bạn vừa dạy {name} cách nói ra.`] },
    { k: 'teach', en: `You sit {name} next to you for two minutes before any more play`, vi: `Bạn cho {name} ngồi cạnh mình hai phút rồi mới được chơi tiếp`, fx: { self: 1 },
      out: [`Two minutes is a long time at this age. {name} learns that biting stops the game.`, `Với trẻ ở tuổi này, hai phút dài lắm. {name} hiểu rằng cắn bạn thì sẽ phải dừng chơi.`] },
    { k: 'harsh', en: `You smack {name}'s hand so they feel it too`, vi: `Bạn đánh vào tay {name} để con biết đau`, fx: { energy: 1, bond: -2 },
      out: [`The other parent nods. {name} has just seen the biggest person they know settle things by hitting.`, `Phụ huynh kia gật đầu. {name} vừa thấy người lớn mà con thân thiết nhất giải quyết chuyện bằng cách đánh.`] },
    { k: 'easy', wda: [-1, -1, 0], en: `You mumble sorry and take {name} home`, vi: `Bạn xin lỗi cho qua chuyện rồi bế {name} về`, fx: { energy: 1, self: -1 },
      out: [`You escape the stares. Nobody learned anything.`, `Bạn thoát khỏi những ánh mắt dòm ngó. Chẳng ai học được gì.`] }] },
  { id: 'bedtime', note: 'reading', s: [2, 3], icon: 'read_aloud', title: [`"One more story"`, `"Thêm một truyện nữa"`],
    text: [`It's 9:30. {name} has come out of bed three times: for water, for a hug, for another story.`, `9 rưỡi tối. {name} đã ra khỏi giường ba lần: đòi uống nước, đòi ôm, đòi nghe thêm truyện.`], opts: [
    { k: 'teach', en: `You walk {name} back to bed every time, calmly, saying little`, vi: `Lần nào bạn cũng bình tĩnh đưa {name} về giường, không nói nhiều`, fx: { self: 2, energy: -3 },
      d: [`Each time you take {name}'s hand, say only "It's bedtime", tuck them in and leave. No scolding, no new story, no negotiating.`, `Mỗi lần, bạn nắm tay {name}, chỉ nói "Đến giờ ngủ rồi", đắp chăn rồi đi ra. Không mắng, không kể thêm, không mặc cả.`],
      out: [`Eleven trips the first night, six the second, one by the weekend.`, `Đêm đầu, bạn phải đưa con về giường mười một lần, đêm sau còn sáu lần, đến cuối tuần chỉ còn một lần.`] },
    { k: 'soothe', en: `You lie down with {name} until they sleep`, vi: `Bạn nằm cạnh {name} đến khi con ngủ`, fx: { bond: 1, self: -1, energy: -1 },
      out: [`Sweet. You usually fall asleep first, still in your work clothes, and {name} now needs you there to sleep.`, `Thật ngọt ngào. Thường thì bạn ngủ trước, vẫn nguyên bộ quần áo đi làm. Từ giờ, {name} phải có bạn nằm cạnh mới chịu ngủ.`] },
    { k: 'easy', en: `You give {name} your phone until they drop off`, vi: `Bạn đưa điện thoại cho {name} xem đến khi ngủ`, fx: { energy: 1, self: -1, learn: -1 },
      out: [`Asleep at 10:30 with the screen on their face. You get your evening back. Tomorrow will be harder.`, `10 rưỡi, {name} ngủ, điện thoại vẫn úp trên mặt. Bạn có lại buổi tối của mình. Ngày mai sẽ khó hơn.`] },
    { k: 'harsh', en: `You shout "Sleep, now!", switch off the light and shut the door`, vi: `Bạn quát "Ngủ ngay!", tắt đèn rồi đóng cửa`, fx: { energy: 1, bond: -2 },
      out: [`Crying, then silence. {name} stays in bed. In the dark, {name} is more afraid of you than of the dark.`, `Khóc một hồi rồi im. {name} không ra khỏi phòng nữa. Trong bóng tối, {name} sợ bạn hơn cả sợ bóng tối.`] }] },

    text: [`At four, the neighbours' child already goes to several classes after school. Relatives ask why {name} isn't learning anything.`, `Con nhà hàng xóm mới 4 tuổi đã đi mấy lớp ngoài giờ. Họ hàng hỏi sao {name} chưa học gì.`], opts: [

  { id: 'whys', s: [3, 3], icon: 'creativity', title: [`The hundredth "why?"`, `Câu hỏi "tại sao" thứ một trăm`],
    text: [`You have urgent work to finish tonight. {name} wants to know why the sky is blue and why cats have tails.`, `Tối nay bạn phải làm xong một việc gấp. {name} cứ hỏi vì sao trời xanh, vì sao mèo có đuôi.`], opts: [
    { k: 'teach', en: `You stop for five minutes and guess the answers together`, vi: `Bạn dành năm phút cùng {name} tìm câu trả lời`, fx: { learn: 2, energy: -2 },
      d: [`You don't give the answer. You ask back: "What do you think?" and let {name} come up with a theory, however silly.`, `Bạn không trả lời ngay mà hỏi lại: "Con nghĩ là tại sao?", rồi để {name} tự nghĩ ra một lời giải thích, ngớ ngẩn cũng được.`],
      out: [`{name}'s theory about cat tails is wrong and wonderful. Your work finishes later.`, `Câu trả lời của {name} về đuôi mèo sai bét nhưng nghe rất thú vị. Việc của bạn thì xong muộn hơn.`] },
    { k: 'soothe', en: `You promise: "At bedtime we'll talk about it", and you keep the promise`, vi: `Bạn hẹn: "Lúc đi ngủ mình nói tiếp nhé", rồi giữ lời`, fx: { learn: 1, bond: 1, energy: -1 },
      out: [`{name} waits all evening. At bedtime you get fifteen questions in a row.`, `{name} chờ cả tối. Đến giờ đi ngủ, bạn nhận liền mười lăm câu hỏi.`] },

    { k: 'harsh', en: `You snap: "Stop asking! I'm busy"`, vi: `Bạn gắt: "Hỏi gì lắm thế! {Parent} đang bận"`, fx: { energy: 1, bond: -1, learn: -1 },

  { id: 'vase', note: 'lying', s: [3, 4], icon: 'b_mask', title: [`"The cat did it"`, `"Tại con mèo"`],
    text: [`The vase is in pieces. {name} says the cat did it. You don't have a cat.`, `Bình hoa vỡ tan. {name} bảo tại con mèo. Nhà bạn không nuôi mèo.`], opts: [

    { k: 'teach', en: `You thank her. At home, you practise taking turns with {name}`, vi: `Bạn cảm ơn cô. Về nhà, bạn tập cho {name} biết chờ đến lượt`, fx: { self: 2, energy: -3 },

      out: [`{name} does the dishes, sulking. The helper redoes them later, quietly.`, `{name} rửa bát, mặt nặng như chì. Lát sau cô lặng lẽ rửa lại.`] }] },
  { id: 'cardspend', s: [6, 7], fam: 'rich', icon: 'allowance', note: 'money', title: [`Your card, their friends`, `Thẻ của ba mẹ`],
    text: [`The statement arrives: in one week {name} spent five million on game items and bubble tea for the whole group, with your card.`, `Sao kê gửi về: chỉ trong một tuần, {name} đã tiêu năm triệu bằng thẻ của bạn, mua đồ trong game và trà sữa mời cả nhóm.`], opts: [
    { k: 'teach', en: `A fixed amount each month on a card of {name}'s own. Overspend, and wait`, vi: `Mỗi tháng nạp một khoản cố định vào thẻ riêng của {name}. Hết thì đợi tháng sau`, fx: { self: 2, energy: -1 },
      out: [`The first month runs out in ten days. By the third month {name} says no to treating everyone.`, `Tháng đầu, mới mười ngày đã hết tiền. Đến tháng thứ ba, {name} đã biết từ chối khao cả nhóm.`] },
    { k: 'soothe', en: `You sit with {name} over the statement and ask who each thing was for`, vi: `Bạn cùng {name} xem sao kê, hỏi từng khoản tiền đã tiêu vào đâu`, fx: { bond: 1, self: 1, energy: -2 },
      out: [`It turns out {name} pays so the group will keep inviting them. That talk matters more than the money.`, `Hóa ra {name} mời cả nhóm vì muốn được mọi người rủ đi chơi. Cuộc trò chuyện ấy còn đáng giá hơn số tiền đã tiêu.`] },
    { k: 'easy', en: `"Never mind. We can afford it."`, vi: `"Thôi, nhà mình cũng có điều kiện mà"`, fx: { joy: 1, self: -2, money: -1 },
      out: [`{name} is relieved and popular. The next statement is bigger.`, `{name} nhẹ cả người, bạn bè cũng quý con hơn. Sao kê tháng sau còn dài hơn.`] },
    { k: 'harsh', en: `You cancel the card and tell {name} off in front of the friends`, vi: `Bạn khóa thẻ, mắng {name} ngay trước mặt bạn bè`, fx: { money: 1, energy: 1, bond: -2 },
      out: [`The spending stops at once. So does {name} telling you who those friends are.`, `Chuyện tiêu tiền dừng lại ngay. {name} cũng không còn kể với bạn về nhóm bạn ấy nữa.`] }] },
  { id: 'fieldtrip', note: 'stress', s: [4, 5], fam: 'poor', icon: 'money', title: [`The class trip`, `Chuyến dã ngoại của lớp`],
    text: [`The class is going to the seaside for two days. It costs as much as a week of the family's food.`, `Lớp tổ chức chuyến đi biển hai ngày. Tiền tham gia bằng cả tuần tiền chợ của nhà bạn.`], opts: [
    { k: 'teach', en: `You tell {name} the truth about money and plan it together: the piggy bank pays part, you pay the rest`, vi: `Bạn nói thật với {name} chuyện tiền, rồi cùng tính: con góp tiền heo đất, bạn bù phần còn lại`, fx: { bond: 1, self: 1, joy: 1, money: -1, energy: -1 },
      out: [`{name} breaks the piggy bank with a serious face. On the bus {name} keeps the change in a sock.`, `{name} đập heo đất với vẻ mặt nghiêm túc. Trên xe, con cất tiền thừa vào chiếc tất.`] },
    { k: 'rescue', en: `You borrow from a neighbour so {name} can go like everyone else`, vi: `Bạn vay tiền hàng xóm để {name} được đi cùng các bạn`, fx: { joy: 2, money: -2 },
      out: [`{name} comes back sunburnt and full of stories. You repay the neighbour over three months.`, `{name} về nhà với làn da cháy nắng, kể chuyện không ngừng. Bạn mất ba tháng mới trả hết nợ hàng xóm.`] },
    { k: 'back', en: `{name} stays home this time. You write the note to the teacher`, vi: `Lần này {name} ở nhà. Bạn viết giấy xin phép gửi cô`, fx: { joy: -1, energy: 1 },
      out: [`{name} says it does not matter. For a week, at school, the others talk only about the sea.`, `{name} bảo không sao. Nhưng suốt tuần đó, ở lớp, các bạn chỉ nói chuyện đi biển.`] },
    { k: 'harsh', en: `"Where would we get that money!" and {name} spends the two days studying at home`, vi: `"Nhà mình lấy đâu ra tiền!" Hai ngày đó, {name} phải ở nhà học bài`, fx: { learn: 1, energy: 1, bond: -2 },
      out: [`{name} gets through two chapters ahead. {name} also stops showing you notes from school that cost money.`, `{name} học trước được hai bài. Từ đó, {name} không còn đưa bạn những tờ thông báo cần đóng tiền nữa.`] }] },
  { id: 'sibling', note: 'parentify', s: [5, 6], fam: 'poor', icon: 'daily_chores', title: [`Minding the little one`, `Trông em sau giờ học`],
    text: [`You have moved to the evening shift. After school {name} has to mind the younger cousin and cook rice.`, `Bạn chuyển sang làm ca tối. Tan học, {name} phải trông đứa em họ và nấu cơm.`], opts: [
    { k: 'teach', en: `You teach {name} three easy dishes, pin up a timetable, and praise the days it goes well`, vi: `Bạn dạy {name} ba món dễ nấu, dán lịch lên tường, làm tốt thì khen`, fx: { self: 2, bond: 1, energy: -2 },
      out: [`The rice is burnt twice. By the end of the month {name} makes an omelette the little one asks for by name.`, `Hai lần cơm khê. Cuối tháng, {name} làm được món trứng chiên mà đứa em cứ đòi ăn.`] },
    { k: 'soothe', en: `You go back to the day shift for less pay, to be home in the evenings`, vi: `Bạn xin chuyển về ca ngày, lương thấp hơn, để tối được ở nhà`, fx: { bond: 1, joy: 1, money: -2 },
      out: [`Dinner together again. Money is tighter, and you count it twice before the market.`, `Lại được ăn tối cùng nhau. Tiền eo hẹp hơn, đi chợ phải tính toán kỹ hơn.`] },
    { k: 'back', en: `You let {name} work it out, and call home once each evening`, vi: `Bạn để {name} tự xoay xở, tối nào cũng gọi về hỏi thăm`, fx: { self: 2, joy: -1, learn: -1 },
      out: [`{name} copes. Homework waits until the little one is asleep, and often it waits too long.`, `{name} vẫn xoay xở được. Bài tập phải đợi em ngủ, mà nhiều hôm em ngủ muộn quá.`] },
    { k: 'harsh', en: `"You're big now. If the little one falls, it's on you"`, vi: `"Con lớn rồi. Em mà ngã là con chịu"`, fx: { self: 1, energy: 1, bond: -1 },
      out: [`{name} watches the little one like a guard. {name} is twelve and already tired in the evenings.`, `{name} canh em như lính gác. Mới mười hai tuổi mà tối nào cũng mệt rã rời.`] }] },

  // ---------- life happens (at most one per stage, from stage 3)
  { id: 'bonus', note: 'cash', s: [3, 7], life: true, icon: 'bonus', title: [`A bonus`, `Được thưởng`],
    text: [`An unexpected bonus arrives.`, `Bạn bất ngờ được thưởng.`], opts: [
    { k: 'other', en: `You save it`, vi: `Bạn để dành`, fx: { money: 2 }, out: [`It goes into savings.`, `Bạn đem khoản đó gửi tiết kiệm.`] },
    { k: 'other', wda: [1, 0, 0], en: `You take the family on a trip`, vi: `Bạn đưa cả nhà đi chơi một chuyến`, fx: { bond: 1, joy: 1 }, out: [`Three days at the beach. {name} still talks about it.`, `Ba ngày đi biển. Đến giờ {name} vẫn còn nhắc.`] },
    { k: 'other', en: `You spend it on a real rest for yourself`, vi: `Bạn dùng khoản đó để nghỉ ngơi thật sự`, fx: { energy: 2 }, out: [`A few days with nothing to do. You had forgotten what that feels like.`, `Vài ngày được nghỉ ngơi đúng nghĩa. Bạn đã quên mất cảm giác ấy.`] }] },
  { id: 'jobloss', note: 'stress', s: [3, 7], life: true, tag: [`No pay coming in, so resting is not an option.`, `Không còn lương nên không thể chỉ nghỉ ngơi.`], icon: 'job_loss', title: [`Job lost`, `Mất việc`],
    text: [`The company is cutting staff. Your job is gone.`, `Công ty cắt giảm nhân sự. Bạn mất việc.`], opts: [
    { k: 'other', en: `You take any job, right away`, vi: `Bạn nhận đại một công việc tạm thời`, fx: { energy: -2 }, out: [`Longer hours, harder work. The bills get paid.`, `Giờ làm dài hơn, việc nặng hơn. Nhưng vẫn đủ tiền trả hóa đơn.`] },
    { k: 'other', en: `You live on savings while you look`, vi: `Bạn tiêu tiền tiết kiệm trong lúc tìm việc`, fx: { money: -3 }, out: [`Three months at home. The savings shrink fast.`, `Ba tháng ở nhà tìm việc. Tiền tiết kiệm vơi nhanh.`] }] },
  { id: 'sick_child', s: [3, 5], life: true, icon: 'child_sick', title: [`Two weeks of fever`, `Ốm hai tuần liền`],
    text: [`{name} is sick for two weeks.`, `{name} ốm suốt hai tuần.`], opts: [
    { k: 'other', wda: [2, 0, 0], en: `You take unpaid leave and stay home`, vi: `Bạn xin nghỉ không lương, ở nhà chăm con`, fx: { bond: 2, money: -2 }, out: [`Two weeks of porridge and cartoons together. This month's pay is short.`, `Hai tuần nấu cháo, xem hoạt hình cùng con. Tháng này lương bị hụt.`] },
    { k: 'other', wda: [1, 0, 0], en: `You sit up at night and still go to work in the morning`, vi: `Bạn thức đêm chăm con, sáng vẫn đi làm`, fx: { bond: 1, energy: -2 }, out: [`You keep the pay and the nights. By the second week you are ill yourself.`, `Lương vẫn đủ, tối nào bạn cũng ở bên con. Sang tuần thứ hai thì đến lượt bạn ốm.`] },
    { k: 'other', en: `You find someone to watch {name} and keep working`, vi: `Bạn nhờ người trông {name}, vẫn đi làm`, fx: { bond: -1 }, out: [`You call home at every break. {name} asks when you're coming back.`, `Giờ nghỉ nào bạn cũng gọi về. {name} cứ hỏi khi nào bạn về.`] }] },
  { id: 'sick_you', s: [3, 7], life: true, icon: 'parent_sick', title: [`Your body says stop`, `Cơ thể bạn lên tiếng`],
    text: [`You fall ill. The doctor says rest.`, `Bạn đổ bệnh. Bác sĩ bảo phải nghỉ.`], opts: [
    { k: 'other', en: `You stop and rest properly`, vi: `Bạn nghỉ hẳn một thời gian`, fx: { energy: 2, money: -2 }, out: [`Weeks of doing little. You come back as yourself.`, `Mấy tuần gần như không phải làm gì. Bạn khỏe lại hẳn.`] },
    { k: 'other', en: `You take the medicine and keep working`, vi: `Bạn uống thuốc rồi gắng đi làm`, fx: { energy: -2 }, out: [`You don't miss a day of work. By evening there is nothing left of you.`, `Bạn không nghỉ làm ngày nào. Nhưng tối về chẳng còn chút sức lực.`] }] },
  { id: 'grandparents', s: [3, 5], life: true, icon: 'grandparents_weekdays', title: [`"That's how we raised you"`, `"Ngày xưa nuôi mày cũng thế"`],
    text: [`Whenever {name} stays with the grandparents: sweets and TV all day, and every meal spoon-fed.`, `Mỗi lần ở với ông bà, {name} được ăn kẹo, xem TV cả ngày, bữa nào cũng được đút tận miệng.`], opts: [
    { k: 'teach', en: `You talk it through with them, kindly, and agree three house rules`, vi: `Bạn nhẹ nhàng nói chuyện với ông bà, thống nhất ba điều cả nhà cùng giữ`, fx: { self: 2, energy: -2 }, out: [`Some sulking. Then the three rules go up on the fridge, and Grandma is the strictest about them.`, `Ông bà dỗi mấy hôm. Rồi ba điều được dán lên tủ lạnh, bà còn là người giữ đúng nhất.`] },
    { k: 'soothe', en: `You ask for one thing only: {name} feeds themselves`, vi: `Bạn chỉ xin ông bà một điều: để {name} tự xúc ăn`, fx: { self: 1, energy: -1 }, out: [`One small change is easier to accept. The sweets and the TV stay.`, `Chỉ thay đổi một điều nên ông bà dễ đồng ý hơn. Kẹo và TV vẫn như cũ.`] },
    { k: 'easy', wda: [0, -1, -1], en: `You say nothing and keep the peace`, vi: `Bạn im lặng cho êm nhà`, fx: { self: -1 }, out: [`The house stays calm. {name} learns there are two sets of rules.`, `Nhà cửa êm ấm. {name} hiểu rằng có hai bộ luật.`] }] },
  // ---------- things that happen to particular families (recent years in Vietnam)
  { id: 'ot_cut', note: 'stress', s: [2, 7], life: true, only: ['factory'], icon: 'overtime', title: [`No more overtime`, `Nhà máy cắt tăng ca`],
    text: [`Orders have dried up. The factory stops all overtime and some weeks sends workers home in turns. Only the basic wage is left.`, `Nhà máy ít đơn hàng, cắt hết tăng ca, có tuần còn cho nghỉ luân phiên. Thu nhập giờ chỉ còn lương cứng.`], opts: [
    { k: 'other', en: `You drive a ride-hailing bike in the evenings`, vi: `Bạn chạy thêm xe công nghệ buổi tối`, fx: { money: -1, energy: -2 }, out: [`The gap is half filled. You get home after ten, every night.`, `Bù được một nửa khoản thu nhập bị hụt. Tối nào cũng hơn mười giờ bạn mới về đến nhà.`] },
    { k: 'other', en: `The whole family tightens its belt`, vi: `Cả nhà thắt lưng buộc bụng`, fx: { money: -1, joy: -1 }, out: [`No snacks, no outings, cheaper rice. {name} notices, and stops asking for things.`, `Không quà vặt, không đi chơi, chuyển sang mua gạo rẻ hơn. {name} nhận ra, rồi không xin gì nữa.`] },
    { k: 'other', en: `You send {name} to the grandparents in the countryside for a few months`, vi: `Bạn gửi {name} về quê ở với ông bà mấy tháng cho đỡ tốn`, fx: { bond: -2 }, out: [`Money holds. Video calls every Sunday, and {name} sounds further away each time.`, `Giữ được tiền. Chủ nhật nào bạn cũng gọi video, nhưng mỗi lần nghe giọng {name}, bạn lại thấy con xa mình hơn một chút.`] }] },
  { id: 'tax_back', s: [3, 7], life: true, only: ['owner'], icon: 'money', title: [`A tax bill from the past`, `Truy thu thuế`],
    text: [`A tax inspection goes through the company's books from three years ago. There is back tax to pay, plus late-payment penalties.`, `Cơ quan thuế kiểm tra sổ sách công ty từ ba năm trước. Công ty phải nộp thêm tiền thuế còn thiếu và tiền phạt chậm nộp.`], opts: [
    { k: 'other', en: `You pay it all at once and move on`, vi: `Bạn nộp đủ ngay cho xong`, fx: { money: -3 }, out: [`A painful month for the accounts. Then it is over.`, `Một tháng hao tiền. Rồi cũng xong.`] },
    { k: 'other', en: `You hire an accountant to check every line and appeal what is wrong`, vi: `Bạn thuê kế toán rà lại từng khoản, khiếu nại những chỗ tính sai`, fx: { money: -2, energy: -2 }, out: [`Weeks of evenings with folders. The bill comes down a little.`, `Mấy tuần liền, tối nào bạn cũng ngồi rà đống hồ sơ. Số tiền phải nộp giảm được một ít.`] }] },
  { id: 'cashflow', s: [3, 7], life: true, only: ['owner', 'freelance'], icon: 'money', title: [`Money stuck in the pipeline`, `Kẹt dòng tiền`],
    text: [`A big customer is three months late paying. Wages, rent and suppliers do not wait.`, `Một khách hàng lớn chậm thanh toán ba tháng. Nhưng lương, tiền thuê mặt bằng, tiền hàng thì không chờ được.`], opts: [
    { k: 'other', en: `You cover it from the family's savings`, vi: `Bạn lấy tiền tiết kiệm của gia đình ra bù`, fx: { money: -3 }, out: [`The business survives. The family's cushion is mostly gone.`, `Việc làm ăn qua được lúc khó khăn. Nhưng tiền dự phòng của gia đình gần như cạn sạch.`] },
    { k: 'other', en: `You borrow from the bank against the house`, vi: `Bạn vay ngân hàng, thế chấp nhà`, fx: { money: -1, energy: -2 }, out: [`The money comes. So do the sleepless nights about the repayments.`, `Có tiền xoay xở. Nhưng đổi lại là những đêm mất ngủ vì khoản nợ phải trả.`] },
    { k: 'other', en: `You cut costs and do more of the work yourself`, vi: `Bạn cắt chi phí, tự làm thêm mọi việc`, fx: { money: -1, energy: -1, bond: -1 }, out: [`You hold on. You are home less, and {name} notices.`, `Bạn trụ được. Nhưng thời gian ở nhà ít đi, và {name} cũng nhận ra.`] }] },
  { id: 'shop_tax', s: [5, 7], life: true, only: ['freelance'], icon: 'money', title: [`The platform takes its cut`, `Sàn trừ thuế`],
    text: [`Since mid-2025 the online shopping platforms deduct tax on every order you sell, and their fees have gone up too. Less arrives in your account.`, `Từ giữa năm 2025, các sàn thương mại điện tử tự trừ thuế trên mỗi đơn hàng, phí sàn cũng tăng. Tiền thực nhận ít đi.`], opts: [
    { k: 'other', en: `You accept it and sell as before`, vi: `Bạn chấp nhận, bán như cũ`, fx: { money: -1 }, out: [`A little less each month. Life goes on.`, `Mỗi tháng hụt một ít. Cuộc sống vẫn tiếp diễn.`] },
    { k: 'other', en: `You open your own channel on Zalo and Facebook too`, vi: `Bạn mở thêm kênh bán riêng trên Zalo, Facebook`, fx: { energy: -2 }, out: [`Income holds. Your phone buzzes until midnight.`, `Thu nhập vẫn giữ được. Nhưng điện thoại réo đến tận nửa đêm.`] }] },
  { id: 'restructure', note: 'parentburn', s: [3, 7], life: true, only: ['pros', 'office_gp'], icon: 'career_change', title: [`Restructuring`, `Công ty tái cấu trúc`],
    text: [`Your company is restructuring. Half your team is let go. You keep your job, but now with two people's work.`, `Công ty tái cấu trúc, phòng bạn bị cắt một nửa người. Bạn được giữ lại, nhưng phải gánh luôn phần việc của người đã nghỉ.`], opts: [
    { k: 'other', en: `You carry the extra work`, vi: `Bạn gồng thêm việc`, fx: { energy: -2 }, out: [`The pay is the same. You answer emails at dinner.`, `Lương vẫn thế. Đến bữa cơm bạn vẫn phải trả lời email.`] },
    { k: 'other', en: `You take the severance and look for a new job`, vi: `Bạn xin nghỉ, nhận trợ cấp rồi tìm việc mới`, fx: { money: -1, energy: 1 }, out: [`Two months between jobs. You pick {name} up from school every day for the first time.`, `Hai tháng chờ việc mới. Lần đầu tiên, ngày nào bạn cũng được đón {name} tan học.`] }] },
  { id: 'go_home', note: 'stress', s: [2, 7], life: true, only: ['migrant'], icon: 'move_hometown', title: [`Back to the home town?`, `Về quê hay ở lại?`],
    text: [`The factory where you work far from home is cutting jobs. You could go back and find work near {name}, for much less pay.`, `Nhà máy nơi bạn làm xa nhà đang cắt giảm nhân sự. Bạn có thể về quê tìm việc gần {name}, nhưng lương sẽ thấp hơn nhiều.`], opts: [
    { k: 'other', en: `You go home and take a job nearby`, vi: `Bạn về quê, làm việc gần nhà`, fx: { money: -2, bond: 2 }, out: [`Less money, and dinner together every night. {name} follows you everywhere for a month.`, `Tiền ít đi, nhưng tối nào cả nhà cũng được ăn cơm cùng nhau. Suốt tháng đầu, {name} cứ quấn lấy bạn không rời.`] },
    { k: 'other', en: `You stay and find another factory`, vi: `Bạn ở lại, tìm nhà máy khác`, fx: { money: -1, energy: -1 }, out: [`Three weeks without pay, then a new job. {name} still sees you at Tết.`, `Ba tuần không có lương, rồi bạn cũng tìm được việc mới. {name} vẫn chỉ được gặp bạn vào dịp Tết.`] }] },
  { id: 'free_fees', s: [3, 7], life: true, icon: 'prize', title: [`No more school fees`, `Miễn học phí`],

// ---- What the research says (offered after a choice, for whoever wants to read it) ---------------
const NOTES = {
  sleep: { do: [`Choose the way that lets your family sleep. If you sleep-train, start after 6 months and stay consistent for a week; if you prefer to pick the baby up, that is fine too.`, `Chọn cách nào để cả nhà ngủ được. Nếu muốn tập con tự ngủ, nên đợi con sau 6 tháng tuổi; muốn bế con thì cũng không sao.`], src: `Price et al., Pediatrics, 2012`,
    t: [`An Australian trial taught some babies to settle themselves from 8–10 months. At age 6 they were no different from the others in behaviour, emotions or closeness to their parents: no harm, and no lasting gain. The study did not include babies a few weeks old; in the game, picking up a two-month-old raising Closeness is the game's own assumption.`,
        `Một thử nghiệm ở Úc cho trẻ tập tự ngủ khi được 8–10 tháng tuổi. Khi lên 6 tuổi, các bé không khác những bé còn lại về hành vi, cảm xúc hay sự gần gũi với ba mẹ. Cách tập này không có lợi hay hại lâu dài. Nghiên cứu không có trẻ sơ sinh vài tuần tuổi.`] },
  spank: { do: [`When angry, step away for a minute first. Then use a short, clear consequence instead: stop the game, take the toy away for a while.`, `Khi tức giận, ba mẹ hãy tránh ra một phút để bình tĩnh rồi mới xử lý. Có thể dừng trò chơi hoặc cất đồ chơi một lúc.`], src: `Gershoff & Grogan-Kaylor, Journal of Family Psychology, 2016`,
    t: [`A review of 75 studies and about 160,000 children: spanking went with more aggression and a poorer relationship with parents, and did not make children more obedient, even in the moment. Most of these studies cannot prove which came first, but none found spanking helped.`,
        `Tổng hợp 75 nghiên cứu trên khoảng 160.000 trẻ cho thấy trẻ bị đánh đòn thường hung hăng hơn, ít gần gũi với ba mẹ hơn. Đánh đòn cũng không giúp trẻ nghe lời hơn, kể cả ngay lúc đó. Chưa thể khẳng định đánh đòn gây ra những điều này, nhưng cũng chưa nghiên cứu nào thấy đánh đòn có lợi.`] },
  screens: { do: [`Under 5: keep screen time short, watch together when you can, and avoid screens during meals and before bed.`, `Ba mẹ hãy hạn chế thời gian xem màn hình, xem cùng con và tránh cho con xem khi ăn hoặc trước giờ ngủ.`], src: `Madigan et al., JAMA Pediatrics, 2019`,
    t: [`A study followed 2,441 children in Canada: those with more screen time at ages 2 and 3 scored a little lower on developmental checks at 3 and 5. The other direction (slower children being given more screens) did not show up. The effect was small.`,
        `Một nghiên cứu theo dõi 2.441 trẻ ở Canada cho thấy trẻ xem màn hình nhiều lúc 2–3 tuổi thường có kết quả đánh giá phát triển thấp hơn một chút khi 3–5 tuổi. Nghiên cứu cũng kiểm tra: không phải vì trẻ chậm nên mới được cho xem nhiều. Mức chênh lệch khá nhỏ.`] },
  lying: { do: [`Make telling the truth safe: thank your child for owning up, then fix the problem together. Keep punishment mild.`, `Khi con nhận lỗi, ba mẹ hãy cảm ơn con vì đã nói thật rồi cùng con sửa sai.`], src: `Talwar & Lee, Child Development, 2011`,
    t: [`A small study of 84 children aged 3–4 at two schools in West Africa: at the school with harsh punishment, children lied much more often, and more skilfully, than at the other school. It compares schools, not families.`,
        `Một nghiên cứu với 84 trẻ 3–4 tuổi ở hai trường tại Tây Phi cho thấy trẻ ở trường phạt nặng thường nói dối nhiều hơn và biết nói dối khéo hơn trẻ ở trường kia. Đây là nghiên cứu so sánh hai trường, không phải hai kiểu gia đình.`] },
  homework: { do: [`Sit nearby, let your child try first, and give a hint only when asked. Agree on a fixed time and place for homework.`, `Ba mẹ hãy ngồi gần, để con tự làm bài và chỉ gợi ý khi con hỏi. Giữ giờ học cố định mỗi ngày.`], src: `Patall, Cooper & Robinson, Review of Educational Research, 2008; Psicothema, 2024`,
    t: [`Many studies on parents helping with homework: on the whole, it does not raise marks. But there are two very different kinds of help. Sitting over every line and correcting each mistake does not help, and can make results slightly worse. Sitting nearby, letting the child work alone and only hinting when asked, goes with better results.`,
        `Nhiều nghiên cứu cho thấy ba mẹ ngồi kèm và sửa từng lỗi không giúp con học tốt hơn, đôi khi còn có kết quả kém hơn. Ngược lại, khi ba mẹ ngồi gần, để con tự làm và chỉ gợi ý khi con hỏi, kết quả học tập thường tốt hơn.`] },
  style: { do: [`Be warm and firm at once: explain the rule, keep it, and stay kind while you keep it.`, `Ba mẹ hãy giải thích quy tắc cho con, thực hiện đúng như đã nói và luôn giữ giọng nhẹ nhàng.`], src: `Pinquart & Kauser, Cultural Diversity and Ethnic Minority Psychology, 2018`,
    t: [`A review of 428 studies from many countries: children of parents who are both warm and clear about what they expect had fewer emotional and behaviour problems. The pattern was more alike than different across cultures, Asia included.`,
        `Tổng hợp 428 nghiên cứu ở nhiều nước cho thấy trẻ ít gặp vấn đề về cảm xúc và hành vi hơn khi ba mẹ vừa yêu thương, vừa đặt ra quy tắc rõ ràng. Kết quả này cũng thấy ở các gia đình châu Á.`] },
  overparent: { do: [`Let your child handle small problems alone, like a forgotten book or a talk with the teacher. Step in when it is big or unsafe.`, `Ba mẹ hãy để con tự lo việc nhỏ như chuẩn bị sách vở hoặc nói chuyện với cô giáo.`], src: `Zhang & Ji, Development and Psychopathology, 2023`,
    t: [`A review of 52 studies: young people whose parents stepped in and did too much for them had somewhat more anxiety and low mood. The link is real but small, and newer reviews agree. Stepping in once is not the problem; doing it every time is.`,
        `Tổng hợp 52 nghiên cứu cho thấy người trẻ có ba mẹ thường xuyên can thiệp và làm thay quá nhiều thường lo âu, buồn bã hơn một chút. Mối liên hệ này không lớn. Giúp con đôi lần không sao, nhưng việc gì cũng làm thay thì không tốt.`] },
  autonomy: { do: [`Offer real choices within limits ("this or that"), and ask your child's view before deciding things that affect them.`, `Ba mẹ hãy cho con chọn giữa hai phương án phù hợp và hỏi ý con trước khi quyết định việc liên quan đến con.`], src: `Vasquez et al., Educational Psychology Review, 2016`,
    t: [`A review of 36 studies: when parents support their children in making their own choices, the children do better at school, are more self-motivated and have better wellbeing.`,
        `Tổng hợp 36 nghiên cứu cho thấy trẻ được ba mẹ khuyến khích tự lựa chọn thường học tốt hơn, thích học vì bản thân muốn học và có tinh thần khỏe mạnh hơn.`] },
  harsh: { do: [`If you shouted, come back later and say sorry for the shouting, while keeping the rule. A cooling-off pause helps more than the last word.`, `Nếu lỡ quát con, ba mẹ hãy xin lỗi khi bình tĩnh lại nhưng vẫn giữ nguyên quy tắc.`], src: `Wang & Kenny, Child Development, 2014`,
    t: [`A study followed families with 13-year-olds: the more parents shouted, swore or insulted, the more low mood and bad behaviour a year later, and warmth at other times did not cancel it. It ran both ways: children's bad behaviour also led to more shouting.`,
        `Một nghiên cứu theo dõi các gia đình có con 13 tuổi cho thấy ba mẹ càng hay quát mắng, chửi bới thì một năm sau con càng buồn bã và có hành vi xấu hơn. Con có hành vi xấu cũng khiến ba mẹ dễ quát mắng hơn.`] },
  monitoring: { do: [`Be someone it is safe to tell things to: listen without lecturing first, and react calmly to bad news.`, `Ba mẹ hãy nghe con kể hết trước khi khuyên bảo và cố giữ bình tĩnh dù nghe chuyện không vui.`], src: `Stattin & Kerr, Child Development, 2000`,
    t: [`A Swedish study, later repeated in the US: what parents know about where their teenagers are and what they do comes mostly from the teenagers telling them, not from questioning or control.`,
        `Một nghiên cứu ở Thụy Điển, sau đó được thực hiện lại ở Mỹ, cho thấy ba mẹ biết con tuổi mới lớn đang ở đâu và làm gì chủ yếu nhờ con tự kể, chứ không phải nhờ tra hỏi hay kiểm soát.`] },
  sleepmedia: { do: [`Charge all phones outside the bedrooms at night, the parents' too.`, `Ba mẹ hãy sạc tất cả điện thoại ngoài phòng ngủ vào buổi tối, kể cả điện thoại của mình.`], src: `Carter et al., JAMA Pediatrics, 2016`,
    t: [`A review of 20 studies and 125,000 children: using a phone or tablet close to bedtime went with about twice the risk of too little sleep. Even having the device in the bedroom, unused, went with worse sleep.`,
        `Tổng hợp 20 nghiên cứu trên 125.000 trẻ cho thấy trẻ dùng điện thoại, máy tính bảng sát giờ ngủ có nguy cơ thiếu ngủ cao gấp khoảng hai lần. Ngay cả khi không dùng, chỉ để máy trong phòng ngủ cũng đi kèm với giấc ngủ kém hơn.`] },
  parentburn: { do: [`Protect some rest for yourself without guilt: ask for help, share the load, and drop what is not essential.`, `Ba mẹ hãy nhờ người thân trông con, chia sẻ việc nhà và dành thời gian nghỉ ngơi mỗi ngày.`], src: `Mikolajczak et al., Clinical Psychological Science, 2019`,
    t: [`Studies that followed parents over a year: those who were burnt out were later more neglectful and harsher with their children. The authors' conclusion: whatever helps parents recover is also good for the child.`,
        `Các nghiên cứu theo dõi ba mẹ trong một năm cho thấy người kiệt sức thường dễ bỏ bê con, nặng lời hoặc đánh con hơn về sau. Các tác giả cho rằng giúp ba mẹ bớt kiệt sức cũng có lợi cho con.`] },
  mumwork: { do: [`If you go back to work, good childcare and a calm evening routine matter more than the exact month you return.`, `Nếu đi làm lại, ba mẹ hãy ưu tiên tìm người chăm con tốt và dành thời gian vui vẻ bên con mỗi tối.`], src: `Lucas-Thompson, Goldberg & Prause, Psychological Bulletin, 2010`,
    t: [`A review of 69 studies: mothers going back to work early did not, overall, go with poorer learning or behaviour. Full-time work in the first year went with slightly more behaviour problems, mainly in middle-income families. In poorer families the extra income often helped.`,
        `Tổng hợp 69 nghiên cứu cho thấy mẹ đi làm sớm nhìn chung không đi kèm với việc con học kém hay khó bảo hơn. Mẹ làm toàn thời gian ngay năm đầu có thể đi kèm với việc con khó bảo hơn một chút, chủ yếu ở gia đình trung lưu. Với gia đình khó khăn, thêm thu nhập thường có lợi cho con.`] },
  parenttrain: { do: [`Name the rule simply, stay calm, use a short pause to settle, and spend a few minutes of happy play together every day.`, `Ba mẹ hãy nói quy tắc ngắn gọn, cho con ngồi nghỉ khi cần và dành vài phút mỗi ngày chơi cùng con.`], src: `Kaminski et al., Journal of Abnormal Child Psychology, 2008`,
    t: [`A review of 77 parenting programmes for young children: the ones that worked best taught parents to stay consistent, use short calm time-outs, and spend positive time playing with the child.`,
        `Tổng hợp 77 chương trình dạy cách nuôi con cho thấy những chương trình hiệu quả nhất thường hướng dẫn ba mẹ giữ quy tắc nhất quán, cho con ngồi yên một lúc để bình tĩnh và thường xuyên chơi vui vẻ với con.`] },
  reading: { do: [`Read together most evenings, even ten minutes. Let your child choose the book and ask questions along the way.`, `Ba mẹ hãy đọc sách cùng con khoảng 10 phút mỗi tối, để con chọn sách và cùng con trò chuyện về câu chuyện.`], src: `Mol & Bus, Psychological Bulletin, 2011`,
    t: [`A review of 99 studies: children who were read to and around books more from an early age had larger vocabularies and better reading later, and the link grew stronger with age. It is a link, not proof, but a consistent one.`,
        `Tổng hợp 99 nghiên cứu cho thấy trẻ được đọc sách thường xuyên từ nhỏ thường biết nhiều từ hơn và đọc hiểu tốt hơn khi lớn. Mối liên hệ này càng rõ khi trẻ lớn lên.`] },
  early: { do: [`Choose classes your child enjoys, and keep plenty of free play. There is no need to rush ahead.`, `Ba mẹ hãy chọn lớp con thích, dành nhiều thời gian cho con chơi và không cần ép con học trước.`], src: `Durkin, Lipsey, Farran & Wiesen, Developmental Psychology, 2022`,
    t: [`A US trial of a state preschool programme: children who went started first grade ahead of the others. By third grade the others had caught up, and by sixth grade the preschool group did slightly worse. Learning early can put a child ahead for a year or two, but after a few years the lead may be gone.`,
        `Một thử nghiệm ở Mỹ cho thấy trẻ học một chương trình mẫu giáo nặng chữ và số thì học tốt hơn khi vào lớp 1. Đến lớp 3, các bạn khác bắt kịp. Đến lớp 6, nhóm học sớm còn có kết quả thấp hơn một chút. Lợi thế học sớm có thể chỉ kéo dài vài năm.`] },
  stress: { do: [`When money is tight, look after your own calm first: talk it through as a couple, and keep money worries away from the child.`, `Khi thiếu tiền, ba mẹ hãy cùng nhau bàn bạc, giữ bình tĩnh và không trút nỗi lo lên con.`], src: `Masarik & Conger, Current Opinion in Psychology, 2017`,
    t: [`Money troubles mostly reach children through their parents: worry about money makes parents stressed, quicker to argue and quicker to snap, and that is what affects the child. Staying calm is one of the best protections when money is tight.`,
        `Khi gia đình khó khăn về tiền bạc, ba mẹ thường lo lắng, dễ cãi nhau và nóng giận với con hơn. Chính những điều đó, chứ không phải bản thân việc thiếu tiền, là con đường chính ảnh hưởng đến trẻ.`] },
  bully: { do: [`Listen to the whole story, help your child practise what to say and who to go to, and tell the teacher in writing.`, `Ba mẹ hãy nghe con kể, tập cùng con cách ứng phó và nhắn tin cho cô giáo để nhờ hỗ trợ.`], src: `Kochenderfer & Ladd, Development and Psychopathology, 1997`,
    t: [`A US study following young children: those who fought back tended to keep being picked on, while those who got help or found other ways to handle it more often got out of it. Being listened to at home helps a child ask for help.`,
        `Một nghiên cứu theo dõi trẻ nhỏ ở Mỹ cho thấy trẻ đánh trả khi bị bắt nạt thường tiếp tục bị bắt nạt. Trẻ biết nhờ người lớn giúp hoặc tìm cách khác thường thoát khỏi tình trạng này tốt hơn. Được ba mẹ lắng nghe giúp con mạnh dạn tìm sự giúp đỡ.`] },
  socmed: { do: [`Make phone rules together, with times and places, and keep phones out of the bedroom at night.`, `Ba mẹ hãy cùng con thống nhất giờ dùng điện thoại và để điện thoại ngoài phòng ngủ vào ban đêm.`], src: `World Happiness Report, 2026; trials of cutting social media, 2025`,
    t: [`Researchers still disagree about how much screens and social media harm children; trials that cut social media found no clear average effect. What is fairly sure: late-night screen use costs sleep, and lack of sleep hurts mood. Rules made together tend to be kept better.`,
        `Các nhà nghiên cứu chưa thống nhất mạng xã hội gây hại cho trẻ đến mức nào. Các thử nghiệm giảm dùng mạng xã hội cũng chưa thấy thay đổi rõ ràng. Điều chắc chắn hơn là dùng điện thoại khuya làm trẻ mất ngủ, ảnh hưởng đến tâm trạng. Quy tắc cùng thống nhất thường dễ giữ hơn.`] },
  tutoring: { do: [`Pay for extra classes only where your child is actually weak, and check real progress, not just class marks.`, `Ba mẹ chỉ nên cho con học thêm môn còn yếu và kiểm tra xem con có thực sự hiểu bài hơn không.`], src: `Le & Baulch, Young Lives, 2012; Huynh, Labour Economics, 2024`,
    t: [`Studies in Vietnam: children who spent more hours in extra classes did not score higher on standardised tests. One study found teachers gave higher class marks to pupils in their own extra classes, while real skills were no higher. Since 2025 teachers may not charge their own pupils for extra classes.`,
        `Các nghiên cứu ở Việt Nam cho thấy trẻ học thêm nhiều giờ hơn không làm bài kiểm tra đánh giá kiến thức tốt hơn. Có nghiên cứu còn thấy học sinh học thêm với chính giáo viên trên lớp được chấm điểm cao hơn, dù kiến thức không tốt hơn. Từ năm 2025, giáo viên không được thu tiền dạy thêm học sinh của mình.`] },
  elite: { do: [`Choose a school where your child will be happy and keep up well, not only the one with the best name.`, `Ba mẹ hãy chọn trường con thấy vui, học theo kịp và phù hợp với khả năng của con.`], src: `Abdulkadiroğlu, Angrist & Pathak, Econometrica, 2014`,
    t: [`In Boston and New York, students who just made it into selective exam schools and those who just missed did about equally well later. Top schools look strong largely because they pick strong students to begin with. There is no such study in Vietnam yet.`,
        `Ở Boston và New York, những học sinh vừa đủ điểm vào trường chuyên và những học sinh thiếu một chút điểm để vào trường có kết quả học tập về sau gần như ngang nhau. Trường chuyên có thành tích cao phần lớn vì đã tuyển sẵn học sinh giỏi. Việt Nam chưa có nghiên cứu tương tự.`] },
  grit: { do: [`When your child wants to quit, ask why first. Finishing what was agreed is good; forcing them on for years rarely is.`, `Khi con muốn bỏ cuộc, ba mẹ hãy hỏi lý do. Khuyến khích con hoàn thành điều đã hứa nhưng đừng ép con theo đuổi mãi.`], src: `Credé, Tynan & Harms, Journal of Personality and Social Psychology, 2017`,
    t: [`A review of 88 samples and about 67,000 people: grit is only weakly linked to achievement, and largely overlaps with plain conscientiousness. There is no good evidence that making children finish everything they start is better in the long run.`,
        `Tổng hợp nhiều nghiên cứu với khoảng 67.000 người cho thấy sự kiên trì chỉ liên quan một chút đến thành tích. Nó cũng gần giống tính chăm chỉ và có trách nhiệm. Chưa có bằng chứng tốt rằng ép con theo đuổi mọi việc đến cùng sẽ giúp con thành công hơn.`] },
  money: { do: [`Give a fixed amount, help your child plan it, and let them live with running out before the month ends.`, `Ba mẹ hãy cho con một khoản cố định, cùng lập kế hoạch chi tiêu và để con tự chịu trách nhiệm nếu tiêu hết sớm.`], src: `US Consumer Financial Protection Bureau, 2016`,
    t: [`Pocket money alone does not teach children to handle money. What helps is talking about it: planning together, saving for something, and living with the result when it runs out. Evidence here is modest and mostly from surveys.`,
        `Chỉ cho tiền không đủ để dạy con biết quản lý tiền. Điều có ích hơn là ba mẹ cùng con lên kế hoạch chi tiêu, tiết kiệm cho món đồ muốn mua và để con tự trải nghiệm việc tiêu hết tiền. Bằng chứng hiện nay chủ yếu từ các cuộc khảo sát.`] },
  privacy: { do: [`Ask instead of checking in secret. If you are truly worried about safety, say so openly and check together.`, `Ba mẹ hãy hỏi chuyện thay vì lén xem điện thoại. Nếu lo về an toàn, hãy nói thẳng và cùng con kiểm tra.`], src: `Hawk et al., Developmental Psychology, 2013`,
    t: [`A study of 497 Dutch teenagers over a year: when teenagers felt their parents invaded their privacy, they kept more secrets, and a year later the parents knew less about their lives, not more.`,
        `Một nghiên cứu theo dõi 497 thiếu niên Hà Lan trong một năm cho thấy khi con cảm thấy ba mẹ lén xem hoặc can thiệp vào chuyện riêng, con thường giấu giếm nhiều hơn. Một năm sau, ba mẹ biết ít hơn về cuộc sống của con.`] },
  affluent: { do: [`Watch the pressure to achieve, and make sure there is real time together that is not about school.`, `Ba mẹ hãy chú ý áp lực học tập của con và dành thời gian ở bên con mà không nhắc đến chuyện học.`], src: `Luthar, Barkin & Crossman, Development and Psychopathology, 2013`,
    t: [`In some well-off US communities with high-achieving schools, teenagers had more anxiety, low mood and substance use than average. Two reasons came up often: heavy pressure to achieve, and too little real time with parents. The findings are from the US and not fully consistent.`,
        `Một số nghiên cứu ở các cộng đồng khá giả tại Mỹ cho thấy thanh thiếu niên ở đó lo âu, buồn bã và dùng chất kích thích nhiều hơn mức trung bình. Hai lý do thường gặp là áp lực phải đạt thành tích cao và ít thời gian gần gũi với ba mẹ. Kết quả này chưa hoàn toàn thống nhất.`] },
  parentify: { do: [`If your child helps a lot at home, say thank you, keep the load fair, and protect time for study and play.`, `Ba mẹ hãy cảm ơn khi con giúp việc nhà, chia việc hợp lý và giữ thời gian học, chơi cho con.`], src: `Dariotis et al., International Journal of Environmental Research and Public Health, 2023`,
    t: [`A review of 95 studies in 19 countries: children who take on adults' jobs too early more often have anxiety and low mood. But many grow up capable and steady, especially when they are thanked, the load is fair, and they still have time to study and play.`,
        `Tổng hợp 95 nghiên cứu ở 19 nước cho thấy trẻ phải gánh quá nhiều trách nhiệm như người lớn từ sớm thường dễ lo âu, buồn bã hơn. Tuy vậy, nhiều trẻ vẫn trưởng thành tốt nếu được ghi nhận, chia việc hợp lý và có thời gian học, chơi.`] },
  cash: { do: [`Extra money helps most when it buys time and calm for the family, not only things.`, `Ba mẹ hãy dùng khoản tiền thêm để giảm bớt việc phải làm, có thêm thời gian nghỉ ngơi và gần gũi với con.`], src: `Noble et al., NBER, 2025 (Baby's First Years)`,
    t: [`A US trial gave low-income mothers about $333 a month from birth. By age 4, their children developed no differently from children whose families got $20 a month. Money matters, but it does not replace time and closeness. Later results are still to come.`,
        `Một thử nghiệm ở Mỹ cho các bà mẹ thu nhập thấp thêm khoảng 333 đô mỗi tháng từ khi con chào đời. Khi trẻ lên 4 tuổi, sự phát triển của trẻ không khác nhóm mẹ chỉ nhận 20 đô mỗi tháng. Tiền quan trọng, nhưng không thay được thời gian và sự gần gũi. Kết quả những năm sau vẫn chưa có.`] }
};

// ---- What each level means, at each age (shown when the player taps a meter) --------------------
// LEVELS[meter][age group] = four sentences, from Low to Great.  Age groups: little 0–6, school 6–12, teen 12–18.
const LEVELS = {
  bond: {
    little: [
      [`{name} seldom comes to you when hurt or scared, and cries alone or goes to someone else.`, `{name} ít tìm đến bạn khi đau hay sợ. Con thường khóc một mình hoặc tìm người khác.`],
      [`{name} still comes to you when needed, but you can't always comfort them.`, `{name} vẫn tìm bạn khi cần, nhưng đôi khi bạn dỗ mãi mà con vẫn không nín.`],
      [`When hurt or scared, {name} runs to you and calms down in your arms.`, `Mỗi khi đau hay sợ, {name} đều chạy đến tìm bạn. Được bạn ôm, con sẽ dịu lại.`],
      [`You are {name}'s safe place: with you nearby, {name} dares to explore further.`, `Bạn là chỗ dựa của {name}. Có bạn bên cạnh, con mạnh dạn thử điều mới và tự tin chơi xa hơn.`]],
    school: [
      [`Ask anything and {name} says "fine". You hear about school from other people.`, `Hỏi gì {name} cũng chỉ đáp "bình thường". Chuyện ở lớp, bạn thường phải nghe người khác kể lại.`],

    teen: [
      [`{name} keeps the bedroom door shut and hides everything. Whatever you say gets brushed off.`, `{name} đóng cửa phòng, chuyện gì cũng giấu bạn. Bạn nói gì con cũng gạt đi.`],
