<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nghe kiểm giọng nam</title>
<!-- Phiếu #16: trang nghe kiểm lần 2, không thuộc app (không build, không có trong tools.json). Âm thanh ở voicetest/:
     tNN = clip trước phiếu #16 (bị đọc ngược thứ tự âm tiết), sNN = clip sau khi làm lại (giọng D, đang dùng trong app). -->
<style>
:root{--bg:#fff8f0;--fg:#2b2118;--mut:#7a6a5c;--bad:#c0392b;--acc:#f07a2a;--card:#fff;--line:#eadbcc;--sel:#fde7d4}
@media (prefers-color-scheme:dark){:root{--bg:#1d1814;--fg:#f3ebe3;--mut:#b5a597;--bad:#ff7b6b;--acc:#ff9a52;--card:#2a231d;--line:#43382f;--sel:#4a3424}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,system-ui,sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:560px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 8px;color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.zh{font-size:30px;font-weight:700;letter-spacing:2px}
.py{color:var(--mut);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.play{height:56px;font-weight:700;font-size:16px;background:var(--sel);color:var(--fg)}
.play.old{background:transparent;border:1px dashed var(--line);color:var(--mut)}
.play.on{outline:3px solid var(--acc)}
.err{margin-top:8px;width:100%;padding:9px;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--mut)}
.err.on{border-color:var(--bad);color:var(--bad)}
.kinds{display:none;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.kinds.show{display:grid}
.kinds button{padding:9px 2px;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--fg)}
.kinds button.on{background:var(--bad);border-color:var(--bad);color:#fff}
#copy{width:100%;padding:16px;font-size:18px;font-weight:700;background:var(--acc);color:#fff;margin-top:4px}
#out{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>🔊 Nghe kiểm giọng nam (lần 2)</h1>
<p class="sub">3 từ từng bị đọc ngược (老婆 nghe thành “pó lǎo”), nay đã làm lại. Bấm <b>Trước</b> rồi <b>Sau</b> để so.</p>
<p class="sub">Nếu bản <b>Sau</b> vẫn chưa đúng, bấm <b>Còn lỗi</b> rồi chọn: <b>Ngược</b>, <b>Thừa “ơ”</b> hoặc <b>Khác</b>. Không nghe thấy gì: gạt tắt chế độ im lặng và tăng âm lượng.</p>
<div id="list"></div>
<button id="copy">📋 Sao chép kết quả</button>
<div id="out">Chưa đánh dấu gì: cả 3 bản Sau đều ổn.</div>
<script>
(function () {
  var W = [["老婆", "lǎo pó"], ["爱护", "ài hù"], ["以来", "yǐ lái"]];
  var KINDS = ["Ngược", "Thừa “ơ”", "Khác"];
  var marks = {}, cur = null, list = document.getElementById('list'), out = document.getElementById('out');
  var audio = new Audio(); audio.preload = 'auto';
  function stop() { if (cur) cur.classList.remove('on'); cur = null; }
  audio.addEventListener('ended', stop); audio.addEventListener('error', stop);
  W.forEach(function (w, i) {
    var n = '0' + (i + 1), card = document.createElement('div'); card.className = 'card'; marks[w[0]] = {};
    card.innerHTML = '<div class="hd"><span class="zh">' + w[0] + '</span><span class="py">' + w[1] + '</span></div>' +
      '<div class="row"><button class="play old" data-f="t' + n + '">Trước</button><button class="play" data-f="s' + n + '">Sau</button></div>' +
      '<button class="err">Còn lỗi?</button><div class="kinds"></div>';
    [].forEach.call(card.querySelectorAll('.play'), function (b) {
      b.onclick = function () {
        stop(); audio.pause(); audio.src = 'voicetest/' + b.getAttribute('data-f') + '.mp3'; audio.currentTime = 0;
        cur = b; b.classList.add('on');
        var p = audio.play(); if (p && p.catch) p.catch(function () { stop(); out.textContent = 'Chưa phát được âm thanh. Kiểm tra gạt im lặng và âm lượng rồi bấm lại.'; });
      };
    });
    var err = card.querySelector('.err'), box = card.querySelector('.kinds');
    err.onclick = function () { box.classList.toggle('show'); };
    KINDS.forEach(function (k) {
      var b = document.createElement('button'); b.textContent = k;
      b.onclick = function () {
        marks[w[0]][k] = !marks[w[0]][k]; b.classList.toggle('on', marks[w[0]][k]);
        var any = KINDS.some(function (x) { return marks[w[0]][x]; });
        err.classList.toggle('on', any); err.textContent = any ? '⚠️ Còn lỗi' : 'Còn lỗi?'; show();
      };
      box.appendChild(b);
    });
    list.appendChild(card);
  });
  function text() {
    var bad = W.map(function (w) {
      var k = KINDS.filter(function (x) { return marks[w[0]][x]; });
      return k.length ? w[0] + ': ' + k.join(', ') : null;
    }).filter(Boolean);
    return 'Nghe kiểm giọng nam lần 2 (phiếu #16)\n' + (bad.length ? 'Bản Sau còn lỗi:\n' + bad.join('\n') : 'Cả 3 bản Sau đều ổn.') + '\n' + navigator.userAgent;
  }
  function show() { out.textContent = text(); }
  var cp = document.getElementById('copy');
  cp.onclick = function () {
    var txt = text(); out.textContent = txt;
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { } ta.remove();
      cp.textContent = ok ? '✓ Đã sao chép' : 'Chép tay đoạn chữ bên dưới';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { cp.textContent = '✓ Đã sao chép'; }, fallback);
    else fallback();
  };
})();
</script>
</body>
</html>
