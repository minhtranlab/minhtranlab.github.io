<style>
/* ===== common styles ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .15s}
.w:active{background:rgba(255,200,0,.35)}
.w ruby{ruby-position:over}
.w rt{display:none;font-size:.42em;font-weight:400;letter-spacing:0;opacity:.8;font-family:-apple-system,system-ui,sans-serif}
body.py .w rt,.showpy .w rt{display:ruby-text}
.w.t{border-bottom:2px solid currentColor;border-bottom-color:var(--tw,#f2b24a)}
.w.unk{outline:2px dashed red}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,120%);width:min(560px,100%);background:#fff;color:#1b1b1f;border-radius:20px 20px 0 0;padding:16px 20px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.3);z-index:50;transition:transform .22s cubic-bezier(.2,.8,.3,1);font-family:-apple-system,system-ui,sans-serif}
.sheet:not(.open){box-shadow:none;visibility:hidden}
.sheet.open{transform:translate(-50%,0)}
.sh-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh-hz{font:600 34px/1.1 "PingFang SC","Songti SC",serif}
.sh-py{font-size:19px;color:#555}
.sh-snd{margin-left:auto;font-size:22px;width:44px;height:44px;border-radius:50%;background:#eee}
.sh-vi{font-size:19px;margin-top:6px;line-height:1.35}
.sh-hv{margin-top:6px;font-size:15px;color:#7a4b00}
.chip{display:inline-block;margin-top:10px;font-size:12px;padding:3px 9px;border-radius:99px;background:#eee;color:#444}
.chip-t{background:#ffe9b0;color:#6b4300}
.chip-s{background:#e4ecf7;color:#2b4a74}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px #000}

.optrow{display:flex;gap:8px;align-items:stretch}
.optrow>.opt,.optrow>.tile{flex:1}
.lens{width:48px;flex:none;border-radius:12px;background:rgba(255,255,255,.12);font-size:18px}
.opt .w,.cx .w,.tile .w,.slot .w,.chip2 .w,.line .w{pointer-events:none}
.gl{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #eee}
.gl-t{font-size:13px;color:#777;margin-bottom:4px}
.gl-hz{font:600 22px "PingFang SC","Songti SC",serif;min-width:70px}
.gl-py{color:#666;font-size:15px;min-width:90px}
.gl-vi{font-size:16px}

/* layout: picture on top, one caption/question underneath, one big Next button */
:root{--bg:#f3f6f7;--card:#ffffff;--ink:#1d2733;--mut:#5d6d7b;--acc:#e8571f;--acc2:#b13c0c;--accsoft:#fde9df;--teal:#17808a;--butter:#ffd166;--line:#dbe4e9;--ok:#1d7f50;--okbg:#e1f5ea;--bad:#b5301f;--badbg:#fdebe7;--chip:#e8eef1;--new:#fff4cf;--newline:#ecd67c;--newink:#5e4a00;--tw:#e8571f;
  --disp:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;--body:"Be Vietnam Pro",system-ui,-apple-system,"PingFang SC",sans-serif;--han:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#1a2530;--ink:#eaf0f4;--mut:#9fb2c1;--acc:#ff8a50;--acc2:#ffb78f;--accsoft:#3a2418;--teal:#57c3cd;--line:#2b3a47;--ok:#6fd9a1;--okbg:#17382a;--bad:#ff9a8a;--badbg:#3d1e1a;--chip:#26343f;--new:#3a3110;--newline:#6b5a1c;--newink:#f3dd93;--tw:#ff8a50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171e;--card:#1a2530;--ink:#eaf0f4;--mut:#9fb2c1;--acc:#ff8a50;--acc2:#ffb78f;--accsoft:#3a2418;--teal:#57c3cd;--line:#2b3a47;--ok:#6fd9a1;--okbg:#17382a;--bad:#ff9a8a;--badbg:#3d1e1a;--chip:#26343f;--new:#3a3110;--newline:#6b5a1c;--newink:#f3dd93;--tw:#ff8a50;color-scheme:dark}
html,body{height:100%}
@supports (height:100dvh){body{height:100dvh}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
#app{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:680px;margin:0 auto}
.sheet{background:var(--card);color:var(--ink)}
.sh-py,.sh-hv{color:inherit}.sh-hv{color:var(--acc2)}
.chip{background:var(--chip);color:var(--ink)}.chip-t{background:var(--accsoft);color:var(--acc2)}.chip-s{background:var(--chip)}
.lens{background:var(--chip);color:var(--ink)}
.gl{border-color:var(--line)}.gl-py,.gl-t{color:var(--mut)}
/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:10px 0 8px;flex:none}
.tb{width:44px;height:44px;border-radius:14px;background:var(--chip);color:var(--ink);font-size:18px;flex:none;border:0}
.tb.on{background:var(--acc);color:#fff}
#dots{flex:1;display:flex;gap:5px}
#dots i{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .2s}
#dots i.d{background:var(--teal)}#dots i.c{background:var(--acc)}
/* picture */
.artbox{height:min(40dvh,calc((100vw - 32px)*.75),440px);aspect-ratio:4/3;margin:0 auto;border-radius:22px;overflow:hidden;background:var(--chip);flex:none;box-shadow:0 2px 0 var(--line)}
.artbox.sm{height:min(30dvh,calc((100vw - 32px)*.6),300px)}
.art{width:100%;height:100%;display:block}
.fl{animation:fl 3.2s ease-in-out infinite}.f2{animation-delay:-1.1s}.f3{animation-delay:-2.2s}
@keyframes fl{50%{transform:translateY(-9px)}}
.wv{animation:wv 1.4s ease-in-out infinite}.w2{animation-delay:.2s}.w3{animation-delay:.4s}
@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}
.rn{animation:rn .8s linear infinite}
@keyframes rn{from{transform:translate(4px,-14px)}to{transform:translate(-4px,14px)}}
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:2px 0 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pane{display:flex;flex-direction:column;gap:12px;animation:in .28s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* story lines */
.ln{background:var(--card);border-radius:18px;padding:12px 14px 12px;box-shadow:0 1px 0 var(--line);border:2px solid transparent;transition:border-color .2s}
.ln.now{border-color:var(--acc)}
.who{font-size:12.5px;font-weight:600;letter-spacing:.03em;color:var(--teal);margin-bottom:2px;display:flex;align-items:center;gap:8px}
.who.n{color:var(--mut)}
.zh{font:500 28px/1.75 var(--han)}
.ln.nar .zh{font-weight:400}
.lr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sb{width:46px;height:46px;border-radius:50%;background:var(--accsoft);color:var(--acc2);font-size:19px;border:0;flex:none}
.tr{min-height:40px;padding:0 14px;border-radius:99px;background:var(--chip);color:var(--ink);border:0;font-size:14px}
.vi{font-size:16px;color:var(--mut);margin-top:4px}
.vi[hidden]{display:none}
/* word */
.wh{display:flex;align-items:center;gap:14px;padding:2px 2px 0}
.hz{font:600 62px/1.1 var(--han);flex:none}
.mn{font-size:19px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{min-height:46px;padding:0 16px;border-radius:99px;background:var(--chip);color:var(--ink);font-size:15.5px;border:2px solid transparent}
.chip2.on{background:var(--card);border-color:var(--acc);color:var(--acc2);font-weight:600}
.panel{display:none;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:0 1px 0 var(--line);font-size:17px;line-height:1.55;animation:in .2s both}
.panel.show{display:block}
.pyb{font-size:30px;text-align:center}.hvb{font:600 28px var(--disp);text-align:center;color:var(--acc2)}.hvn{font-size:14px;color:var(--mut);text-align:center;margin-top:2px}
.sndrow{display:flex;gap:10px;justify-content:center}
.sndrow button{min-height:50px;padding:0 20px;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;border:0}
.sndrow button.alt{background:var(--card);color:var(--acc2);border:2px solid var(--acc)}
.ex{display:grid;grid-template-columns:1fr 46px;gap:2px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}.exz{font:500 25px/1.85 var(--han)}.exv{grid-column:1/2;font-size:15px;color:var(--mut)}
.spk{width:46px;height:46px;border-radius:50%;background:var(--accsoft);color:var(--acc2);font-size:19px;border:0}
.ety{display:flex;flex-direction:column;gap:10px;margin-top:10px}.ep{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.5}.ec{font:600 40px/1.1 var(--han);text-align:center;color:var(--acc2)}
.hook{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--new);border:1px solid var(--newline);font-size:16px;line-height:1.5}.hook .k{font-size:12px;font-weight:700;color:var(--newink);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:flex;flex-direction:column;gap:10px}
.mw,.mm{min-height:58px;padding:8px 12px;border-radius:16px;background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:center;line-height:1.3}
.mw{font:600 28px var(--han)}.mm{font-size:16px}.mw.sel{border-color:var(--acc);background:var(--new)}
.mw.ok,.mm.ok{background:var(--okbg);border-color:var(--ok);opacity:.8}.mm.bad{background:var(--badbg);border-color:var(--bad)}
.olin{min-height:72px;border-radius:16px;border:2px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.olin.good{border:2px solid var(--ok);background:var(--okbg)}.olin.shake{animation:sh .35s}
.obank{display:flex;flex-wrap:wrap;gap:8px}.tile{padding:10px 14px;min-height:50px;border-radius:14px;background:var(--card);border:2px solid var(--line);font:500 24px var(--han);color:var(--ink)}
.tin{display:flex;gap:8px}.tin input{flex:1;min-width:0;min-height:58px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:500 24px var(--han);background:var(--card);color:var(--ink)}
.tin button{min-height:58px;padding:0 18px;border-radius:14px;border:0;background:var(--acc);color:#fff;font:700 16px var(--disp)}
.sc.lock{opacity:.55}.opt.vn{font-family:var(--body);font-size:17px}
.bigq{font:600 56px/1.2 var(--han);text-align:center;padding:10px 0}.bigq.vn{font:600 26px/1.35 var(--body)}
.sc.rev{background:var(--new);border:1px solid var(--newline)}
.facts{margin:0;padding-left:20px}.facts li{margin:6px 0}
/* quiz */
.prompt{font:600 18px/1.4 var(--body)}
.sent{font:500 28px/1.8 var(--han)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.picks{grid-template-columns:1fr}.picks .artbox{height:min(24dvh,170px)}}
.pk{border:3px solid transparent;border-radius:24px;padding:0;background:none;overflow:hidden;transition:transform .15s}
.pk .artbox{height:auto;width:100%;box-shadow:none}
.pk.good{border-color:var(--ok)}.pk.bad{border-color:var(--bad);opacity:.55}
.pk.shake,.opt.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.opts{display:flex;flex-direction:column;gap:10px}
.orow{display:flex;gap:8px;align-items:stretch}.orow .opt{flex:1}
.opt{min-height:56px;padding:10px 16px;border-radius:16px;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:20px;text-align:left;line-height:1.5;font-family:var(--han)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:.75}
.opt .w.t{border-bottom-color:transparent}
.fb{padding:12px 14px;border-radius:14px;font-size:16px;line-height:1.5}
.fb.bad{background:var(--badbg);color:var(--ink);border:1px solid var(--bad)}.fb.good{background:var(--okbg);color:var(--ink);border:1px solid var(--ok)}
.fb .rv{font:500 22px/1.6 var(--han)}.fb .rvv{font-size:14px;color:var(--mut)}
.reveal{padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);animation:in .25s both}
.reveal .rz{font:500 24px/1.9 var(--han);color:var(--ink)}.reveal .rvv2{font-size:15px;color:var(--mut);margin:2px 0 8px}.reveal .lr{margin-top:4px}.reveal .hintw{font-size:12.5px;color:var(--mut)}
.new{padding:14px 16px;border-radius:16px;background:var(--new);border:1px solid var(--newline);color:var(--ink);font-size:16.5px;line-height:1.55;animation:in .25s both}
.new .k{font-size:12px;font-weight:700;color:var(--newink);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
/* album */
.stk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sticker{border-radius:20px;background:var(--card);box-shadow:0 1px 0 var(--line);padding:12px 8px;text-align:center;animation:pop .5s both}
.sticker:nth-child(2){animation-delay:.12s}.sticker:nth-child(3){animation-delay:.24s}.sticker:nth-child(4){animation-delay:.36s}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:none}}
.sticker .s1{font:600 40px/1.2 var(--han);color:var(--acc2)}.sticker .s2{font-size:13px;color:var(--mut);line-height:1.3}
.h2{font:700 20px/1.2 var(--disp);margin:6px 0 0}
.say{display:grid;grid-template-columns:1fr 46px;gap:0 8px;align-items:center;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 1px 0 var(--line)}
.say .vi{grid-column:1/2;margin:0}
.tease{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 1px 0 var(--line)}
.tease .artbox{height:84px;border-radius:12px;flex:none}
/* tabs */
.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:46px;border-radius:14px;background:var(--chip);color:var(--ink);font:600 15px var(--body);border:2px solid transparent}
.tab.on{background:var(--card);border-color:var(--acc);color:var(--acc2)}
/* journey */
.path{position:relative;width:100%;flex:none}
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--teal)}
.nd{position:absolute;border-radius:50%;padding:0;border:4px solid var(--line);background:var(--card);box-shadow:0 5px 0 var(--line);transition:transform .15s}
.nd:active{transform:translateY(3px)}
.nc{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:block;background:var(--chip)}
.ncs{position:absolute;left:50%;top:0;height:100%;aspect-ratio:4/3;transform:translateX(-50%);display:block}
.ncs svg{width:100%;height:100%;display:block}
.nd.done{border-color:var(--teal);box-shadow:0 5px 0 var(--teal)}
.nd.cur{border-color:var(--acc);box-shadow:0 5px 0 var(--acc2);animation:pulse 1.8s ease-in-out infinite}
.nd.test{border-color:var(--butter);box-shadow:0 5px 0 #d9a93a}
.nd.lock .nc{filter:grayscale(1) brightness(.9);opacity:.55}
.nd.lock{box-shadow:0 5px 0 var(--line)}
@keyframes pulse{50%{transform:scale(1.07)}}
.nb{position:absolute;left:-6px;top:-6px;min-width:28px;height:28px;border-radius:99px;background:var(--acc);color:#fff;font:700 15px/28px var(--disp);text-align:center;padding:0 6px}
.nd.done .nb{background:var(--teal)}
.nd.lock .nb{background:var(--mut)}
.nk{position:absolute;right:-6px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font:700 16px/28px var(--body);text-align:center}
.nlk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.nl{position:absolute;width:150px;transform:translateY(-50%);font:600 14px/1.3 var(--body);color:var(--ink)}
.nl.l{transform:translate(-100%,-50%);text-align:right}.nl.r{text-align:left}
.nl small{display:block;margin-top:2px;color:var(--acc2);font-weight:700}
@media (prefers-reduced-motion:reduce){.nd.cur{animation:none}}
.pyl{font-size:16px;line-height:1.45;color:var(--teal);margin:0}
body.py .ex .pyl,body.py .vi .pyl{display:none}
.np{margin:0 0 9px}.np:last-child{margin-bottom:0}
.ex .pyl,.say .pyl{grid-column:1/2}
.slot{border:0;padding:0}
/* happy background */
:root{--g1:#ffe6d2;--g2:#fff6e3;--g3:#dff2ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#2b2040;--g2:#1a2233;--g3:#10222a}}
:root[data-theme="dark"]{--g1:#2b2040;--g2:#1a2233;--g3:#10222a}
body.hb{background:linear-gradient(180deg,var(--g1) 0,var(--g2) 45%,var(--g3) 100%) fixed}
/* extras */
.rec.on{background:var(--bad);color:#fff;animation:recp 1s ease-in-out infinite}
@keyframes recp{50%{opacity:.7}}
.cmp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 0}.cmp[hidden]{display:none}.cmpl{color:var(--mut);font-size:14px}
.retry{align-self:flex-start;background:var(--accsoft);color:var(--acc2);font-weight:600;font-size:14px;padding:4px 12px;border-radius:99px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.goal{position:relative;flex:none;width:52px;height:64px;padding:0;border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.goal svg{display:block}.goal .gb{fill:var(--card);stroke:var(--line);stroke-width:5}.goal .gf{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round}
.goal.hit .gf{stroke:var(--ok)}
.goal b{position:absolute;top:0;left:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font:700 17px var(--disp)}
.goal small{font-size:11px;color:var(--mut);margin-top:-2px}
.cf{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.cf span{position:absolute;top:-4%;width:9px;height:14px;border-radius:2px;animation:cfall 2.2s ease-in both}
@keyframes cfall{to{top:108%;rotate:540deg}}
.fbbox{width:min(100%,480px);max-height:86vh;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.fbc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fbt{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:16px/1.4 var(--body);background:var(--bg);color:var(--ink);resize:vertical}
.fbv{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}.fbi{background:var(--bg);border-radius:12px;padding:8px 12px}.fbi small{display:block;color:var(--mut)}
.sh-card{margin-top:10px;min-height:44px;padding:0 16px;border-radius:99px;border:0;background:var(--accsoft);color:var(--acc2);font-weight:600;font-size:15px}
.sheet{z-index:80}
.gl1{margin:0;color:var(--ink);font-size:17px}.gbar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:10px}.gbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
/* flip card */
.wcov{position:fixed;inset:0;z-index:60;background:rgba(15,25,35,.5);display:flex;align-items:center;justify-content:center;padding:16px;animation:wfade .2s both;perspective:1400px}
.wcov.out{opacity:0;transition:opacity .18s}

.wcard{position:relative;width:min(100%,460px);height:min(78vh,620px);background:var(--card);color:var(--ink);border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;outline:0}
.wcard.in{animation:wcin .5s cubic-bezier(.2,.9,.3,1.2) both}
.wcard.t1{animation:wt1 .23s ease-in both}
.wcard.t2{animation:wt2 .27s ease-out both;cursor:default}
@keyframes wcin{from{transform:scale(.6) rotateY(-100deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wt1{to{transform:rotateY(90deg)}}
@keyframes wt2{from{transform:rotateY(-90deg)}to{transform:none}}
.wcf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,var(--accsoft),var(--card))}
.wcz{font:700 64px/1.2 var(--han);color:var(--acc2);text-align:center;padding:0 12px;word-break:keep-all}
.wch{color:var(--mut);font-size:15px}
.wcx0{position:absolute;top:10px;right:10px}
.wcb{flex:1;min-height:0;display:flex;flex-direction:column}
.wct{display:flex;justify-content:flex-end;gap:8px;padding:10px 10px 0}
.wcp{flex:1;min-height:0;overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch;overflow-x:hidden}
.wcp .artbox{height:auto;width:min(100%,calc(30dvh*4/3))}
@media (prefers-reduced-motion:reduce){.wcard.in,.wcard.t1,.wcard.t2,.wcov{animation:none!important}}
/* review circle + log */
:root{--rv:#7a5cc7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rv:#b6a0f2}}
:root[data-theme="dark"]{--rv:#b6a0f2}
.nd.rev{border-color:var(--rv);box-shadow:0 5px 0 var(--rv)}
.nd.rev.lock{box-shadow:0 5px 0 var(--line);border-color:var(--line)}
.nl.c{width:120px!important;transform:translateX(-50%);text-align:center}
.nl.c small{color:var(--rv)}
.nbd{position:absolute;right:-6px;top:-6px;min-width:28px;height:28px;border-radius:99px;background:var(--acc);color:#fff;font:700 14px/28px var(--disp);text-align:center;padding:0 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font:700 30px/1.15 var(--disp)}.stat span{font-size:13.5px;color:var(--mut)}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}.stat.wide b{font-size:44px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mut)}
.bar i{display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--teal);min-height:4px}
.bar.today i{background:var(--acc)}.bar em{font-style:normal;font-size:11.5px;margin-bottom:3px;color:var(--ink)}
/* footer */
/* "Tiếp →" is a fixed bar: always on screen, above the iOS home indicator; the stage pads its bottom so nothing hides behind it */

/* ===== Hán Việt + chiết tự (character parts) + a memory hook for each word ===== */
const ETY = {
  '电台': { parts: [['电', 'điện', 'Chữ xưa vẽ tia chớp trên trời mưa (雨 + 申). Chớp là “điện” đầu tiên con người nhìn thấy.'], ['台', 'đài', 'Cái nền cao, cái bục. Cũng có trong 舞台 (sân khấu), 阳台 (ban công).']],
    hook: 'Điện (电) + đài (台) = cái đài chạy bằng điện. Tiếng Việt cũng nói “điện đài”.' },
  '恩爱': { parts: [['恩', 'ân', '因 (nhân, nguyên do) đặt trên 心 (tim). Cái “nhân” nằm trong tim: nhớ ơn người đã thương mình.'], ['爱', 'ái', 'Bản phồn thể 愛 có chữ 心 ở giữa; bản giản thể 爱 bỏ mất. Mẹo: bàn tay (爫) đưa ra với một người bạn (友).']],
    hook: 'Ơn (恩) + yêu (爱). Vợ chồng thắm thiết là vừa nhớ ơn nhau vừa thương nhau. Đừng đọc theo nghĩa “ân ái” trong tiếng Việt.' },
  '入围': { parts: [['入', 'nhập', 'Hình mũi nhọn đi vào bên trong. Phân biệt với 人 (người): 入 như mũi tên chúc vào.'], ['围', 'vi', 'Khung 囗 là bức tường bao quanh, bên trong là phần chỉ âm 韦 (wéi). Vòng vây.']],
    hook: 'Nhập (入) vào trong bức tường (囗). Bạn đã vào vòng trong, nhưng cổng cuối vẫn còn phía trước.' },
  '对比': { parts: [['对', 'đối', 'Hai bộ 又 và 寸, cả hai đều là “bàn tay”. Hai bên quay mặt vào nhau: đối diện.'], ['比', 'tỉ', 'Chữ xưa vẽ hai người đứng sát cạnh nhau, nên có nghĩa “so với”. Như “tỉ lệ”, “tỉ số”.']],
    hook: 'Đứng cạnh nhau (比) và nhìn thẳng vào nhau (对) thì tự nhiên thấy chỗ khác nhau.' },
  '评委': { parts: [['评', 'bình', '讠 (lời nói) + 平 (bằng phẳng, công bằng): nói sao cho cân. Như “bình luận”, “bình xét”.'], ['委', 'ủy', 'Cây lúa (禾) cúi xuống trên chữ 女, nghĩa gốc là thuận theo, giao phó. Như “ủy viên”, “ủy thác”.']],
    hook: 'Người được ủy (委) để nói công bằng (评) về bài của bạn.' },
  '如何': { parts: [['如', 'như', '女 + 口. Nghĩa gốc là “theo, làm theo”, sau thành “giống như”. Mẹo: làm đúng như lời dặn.'], ['何', 'hà', '亻 (người) + 可. Chữ xưa là người gánh đồ, về sau được mượn làm từ hỏi “gì, nào”.']],
    hook: '“Như hà” = giống cái nào? = thế nào? Bạn đã gặp 何 trong thành ngữ 无可奈何 “vô khả nại hà” (hết cách, không biết làm sao).' },
  '瘫痪': { parts: [['瘫', 'than', 'Bộ 疒 (bệnh) + phần chỉ âm 难 (nán). Mẹo thêm: 难 là “khó”, nhớ thành “bệnh khó cử động”.'], ['痪', 'hoán', 'Bộ 疒 (bệnh) + phần chỉ âm 奂 (huàn).']],

  '离婚': { parts: [['离', 'ly', 'Rời ra, tách ra. Như “ly biệt”, “ly khai”.'], ['婚', 'hôn', '女 + 昏. Xưa lễ cưới làm lúc chạng vạng (昏, hôn trong “hoàng hôn”), nên chữ cưới mang 昏.']],

  '自杀': { parts: [['自', 'tự', 'Chữ xưa vẽ cái mũi. Người Trung Quốc chỉ vào mũi khi nói “tôi”, nên 自 là “bản thân”.'], ['杀', 'sát', 'Giết. Như “sát thủ”, “sát hại”.']],

    hook: 'Ôm (抱) nỗi oán (怨) trong lòng, rồi nói ra thành lời than.' },

    hook: 'Yêu (爱) và canh giữ như giữ cửa nhà (护). Yêu mà còn chăm chút gìn giữ.' }

  '相敬如宾': { parts: [['相', 'tương', '木 (cây) + 目 (mắt): mắt nhìn vào nhau. Nghĩa “lẫn nhau”. Như “tương thân”, “tương trợ”.'], ['敬', 'kính', 'Có 攵 (bàn tay cầm roi) bên phải: nghiêm cẩn, kính cẩn. Như “tôn kính”.'], ['如', 'như', 'Giống như. Đã gặp trong 如何.'], ['宾', 'tân', 'Bản phồn thể 賓: mái nhà (宀) + quà (貝: tiền, của cải). Khách mang lễ đến nhà. Như “khách tân”, “tân khách”.']],

  '暗暗': { parts: [['暗', 'ám', '日 (mặt trời) + 音. Không có mặt trời là tối. Như “hắc ám”, “ám muội”.']],

  '不耐烦': { parts: [['不', 'bất', 'Phủ định. Như “bất công”.'], ['耐', 'nại', 'Chịu đựng. Như “nhẫn nại”.'], ['烦', 'phiền', '火 (lửa) + 页 (đầu): đầu nóng như lửa, bực bội. Như “phiền phức”, “phiền não”.']],

  '肩膀': { parts: [['肩', 'kiên', 'Bộ 月 (thịt, cơ thể) ở dưới. Phần trên giống 户 (cửa). Nghĩa là vai, chỗ để gánh vác.'], ['膀', 'bảng', '月 + 旁 (bên cạnh, chỉ âm). Phần thịt bên thân người.']],

/* ---- revision engine: which words are due, and which questions to ask ---- */
const STUDY = () => SESSIONS.filter(s => !s.rev);
const LAST = () => STUDY().filter(s => !s.mix && !s.test && !s.reader).slice(-1)[0].id;
const REV = { id: 99, rev: 1, title: 'Ôn tập tổng hợp', sub: '', thumb: 'cup', words: [], screens: [], fixed: null };
SESSIONS.push(REV);
function revStatus() { const ids = Object.keys(st.wl).filter(i => W[i]), now = Date.now(); return { learned: ids.length, due: ids.filter(i => st.wl[i].due <= now).length }; }
function pri(id, now) {
  const r = wrec(id); let s = 0;
  if (r.due <= now) s += 100 + Math.min(60, (now - r.due) / DAY * 5);     // due by the 1/3/7/21-day schedule
  if (r.fail) s += 70;                                                     // got it wrong last time
  s += Math.min(45, (st.look[id] || 0) * 15);                              // keeps tapping it for the meaning
  if (!r.rev) s += 25;                                                     // never revised yet
  s += Math.min(30, (now - (r.last || r.t)) / DAY * 2);                    // nothing due: oldest first
  return s + Math.random() * 8;
}
function ensureBoth(qs) {   // every review has word→meaning AND meaning→word questions
  if (qs.length < 4) return;
  [['z2m', 'm2z'], ['m2z', 'z2m']].forEach(([other, want]) => {
    if (qs.some(q => q._p === want)) return;
    let i = qs.findIndex(q => q._p === other && qs.filter(x => x._p === other).length > 1);
    if (i < 0) i = qs.findIndex(q => q.t === 'mc' || q.t === 'hear' || q.t === 'order');
    if (i >= 0) qs[i] = Object.assign(genQ(qs[i].w[0], want), { _p: want, u: qs[i].u });
  });
}
function genQ(id, kind) {
  const L = Object.keys(st.wl).filter(k => MEAN[k] && k !== id), others = shuffle(L.length >= 3 ? L : Object.keys(MEAN).filter(k => k !== id));
  if (kind === 'z2m') return { t: 'choose', w: [id], prompt: 'Từ này nghĩa là gì?', big: id, audio: id, optVn: 1, opts: [{ t: MEAN[id], ok: 1 }, ...others.slice(0, 3).map(k => ({ t: MEAN[k] }))] };
  if (kind === 'm2z') return { t: 'choose', w: [id], prompt: 'Chọn từ có nghĩa:', big: MEAN[id], vn: 1, opts: [{ t: id, ok: 1 }, ...others.slice(0, 3).map(k => ({ t: k }))] };
  return { t: 'type', w: [id], silent: 1, zh: id, vi: MEAN[id], py: DICT[id][0], prompt: `Gõ từ có nghĩa “${MEAN[id]}” bằng bàn phím pinyin:` };
}
function buildRevision(fixed) {
  const now = Date.now(), ids = Object.keys(st.wl).filter(i => W[i]);
  if (!ids.length) return [];
  const T = fixed ? shuffle(fixed) : ids.sort((x, y) => pri(y, now) - pri(x, now)).slice(0, 6);
  const Q = fixed ? Math.min(10, T.length + 1) : Math.max(3, Math.min(8, T.length * 2)), qs = [], usedNow = {};
  for (let n = 0; n < Q; n++) {
    const id = T[n % T.length], k = Math.floor(n / T.length), r = wrec(id), bank = QB[id] || [];
    const pool = ['z2m', 'm2z', ...(id === '自杀' ? [] : ['tw']), ...bank.map((_, j) => 'b' + j)]   /* 自杀 stays recognition-only: never asked to type it */, hist = (r.hist = r.hist || []);
    let fresh = pool.filter(p => !hist.slice(-3).includes(p) && !(usedNow[id] || []).includes(p)); if (!fresh.length) fresh = pool.filter(p => !(usedNow[id] || []).includes(p)); if (!fresh.length) fresh = pool;
    const pick = fresh[Math.floor(Math.random() * fresh.length)]; (usedNow[id] = usedNow[id] || []).push(pick);
    qs.push(pick[0] === 'b' ? Object.assign(JSON.parse(JSON.stringify(bank[+pick.slice(1)])), { _p: pick }) : Object.assign(genQ(id, pick), { _p: pick }));
  }
  ensureBoth(qs);
  for (let n = 1; n < qs.length; n++) if (qs[n].t === qs[n - 1].t) { const m = qs.findIndex((q, j) => j > n && q.t !== qs[n - 1].t && (j + 1 >= qs.length || q.t !== qs[j + 1].t)); if (m > 0) [qs[n], qs[m]] = [qs[m], qs[n]]; }
  const out = qs.slice(0, 3);
  if (T.length >= 3) out.push({ t: 'match', w: T.slice(0, 5), prompt: 'Chạm một từ, rồi chạm nghĩa của nó:' });
  out.push(...qs.slice(3), { t: 'wrap' });
  return out;
}
/* ---- mixed review inside the study path: the words of the two units just finished, topped up with older ones ---- */
function buildMix(s) {
  const own = s.after.flatMap(id => SESSIONS.find(x => x.id === id).words).filter(i => W[i]);
  const upto = STUDY().findIndex(x => x.id === s.id), before = STUDY().slice(0, upto).flatMap(x => x.words).filter(i => !own.includes(i) && st.wl[i]);
  const now = Date.now(), extra = before.sort((a, b) => pri(b, now) - pri(a, now)).slice(0, Math.max(0, Math.min(s.extra || 3, 9 - own.length)));
  own.concat(extra).forEach(wrec);
  return buildRevision(own.concat(extra));
}

/* ---- tf: true or false about the story ---- */
function tf(sc, pane, ep, gate) {
  gate(false); let wrong = 0;
  pane.insertAdjacentHTML('beforeend', art(sc.scene, 'sm') + `<div class="prompt">Đúng hay sai, theo câu chuyện?</div><div class="sent">${zh(sc.zh)}</div>`);
  const row = h('div', 'lr'), sb = h('button', 'sb', '🔊'); sb.setAttribute('aria-label', 'Nghe'); sb.onclick = () => speak(sc.zh); row.appendChild(sb); pane.appendChild(row);
  const sentEl = $('.sent', pane);
  const box = h('div', 'opts'), fb = h('div', ''), btns = [];
  [['✓ Đúng', true], ['✗ Sai', false]].forEach(([t, v]) => {
    const b = h('button', 'opt vn', t); b.dataset.ok = v === !!sc.ok ? 1 : 0; btns.push(b); box.appendChild(h('div', 'orow')).appendChild(b);
    b.onclick = () => {
      if (b.disabled) return; const good = v === !!sc.ok;
      if (!good) { wrong++; noteMiss(sc.w || []); sfx.bad(); b.classList.add('bad', 'shake'); } else { sfx.ok(); b.classList.add('good'); }
      btns.forEach(x => { x.disabled = true; if (x.dataset.ok === '1') x.classList.add('good'); });
      fb.className = good ? '' : 'fb bad'; fb.innerHTML = good ? '' : '<b>Chưa đúng.</b>';
      sentEl.hidden = true; row.hidden = true; answerBlock(pane, sc.zh, sc.vi); finishQ(sc, pane, wrong, zh(fmtNew(sc.why)));
    };
  });
  pane.append(box, fb);
  if (st.auto) setTimeout(() => { if (ep === EP) speak(sc.zh); }, 400);
}
/* ---- spot: tap the part of the sentence that is used wrongly ---- */
function spot(sc, pane, ep, gate) {
  gate(false); let wrong = 0, locked = false;
  pane.insertAdjacentHTML('beforeend', `<div class="prompt">Câu này có một chỗ dùng sai. Chạm vào chỗ sai:</div>`);
  const line = h('div', 'olin'), fb = h('div', ''), tiles = []; pane.append(line, fb);
  const reveal = () => { const b = tiles[sc.bad]; b.innerHTML = zh(sc.fix); b.classList.add('good'); b.style.borderColor = 'var(--ok)'; b.style.background = 'var(--okbg)'; tiles.forEach(x => { x.disabled = true; }); locked = true; };
  const done = (good) => { reveal(); fb.className = 'fb ' + (good ? 'good' : 'bad'); fb.innerHTML = good ? 'Chỗ sai đã được sửa.' : 'Chỗ sai đã được sửa cho bạn.'; answerBlock(pane, sc.full, sc.vi); finishQ(sc, pane, wrong, zh(fmtNew(sc.teach))); };
  sc.chunks.forEach((c, i) => {
    const b = h('button', 'tile', zh(c)); b.dataset.t = c; tiles.push(b); line.appendChild(b);
    b.onclick = () => {
      if (locked || b.disabled) return;
      if (i === sc.bad) { sfx.ok(); done(true); }
      else { wrong++; noteMiss(sc.w || []); sfx.bad(); b.disabled = true; b.classList.add('bad', 'shake'); b.style.opacity = '.55'; setTimeout(() => b.classList.remove('shake'), 400); if (wrong >= 2) done(false); else { fb.className = 'fb bad'; fb.textContent = 'Phần này đúng rồi. Thử chỗ khác.'; } }
    };
  });
}
/* ---- predict: guess what happens next (no score; the story answers it) ---- */
function predict(sc, pane, ep, gate) {
  gate(false);
  pane.insertAdjacentHTML('beforeend', art(sc.scene, 'sm') + `<div class="h2">Đoán thử nhé</div><div class="prompt" style="font-weight:500">${sc.q}</div>`);
  const box = h('div', 'opts'), fb = h('div', ''), btns = [];
  shuffle(sc.opts.map((t, i) => ({ t, ok: i === 0 }))).forEach(o => {
    const b = h('button', 'opt vn', o.t); btns.push(b); box.appendChild(h('div', 'orow')).appendChild(b);
    b.onclick = () => {
      if (b.disabled) return; sfx.ok();
      btns.forEach(x => { x.disabled = true; if (x !== b) x.style.opacity = '.5'; });
      b.style.borderColor = 'var(--acc)'; b.style.background = 'var(--new)';
      if (sc.key) { st.pred[sc.key] = { t: o.t, ok: o.ok ? 1 : 0 }; save(); }
      fb.className = 'fb good'; fb.innerHTML = '<b>Chốt rồi!</b> Đọc tiếp xem bạn đoán có trúng không.'; gate(true);
    };
  });
  pane.append(box, fb);
}
/* ---- chapter test: one question from every unit, plus story and usage checks ---- */
function buildTest() {
  const now = Date.now(), units = SESSIONS.filter(s => !s.mix && !s.test && !s.reader && !s.rev), qs = [];
  units.forEach(s => {
    const id = s.words.slice().sort((a, b) => pri(b, now) - pri(a, now))[0], bank = QB[id] || [];
    const pool = ['z2m', 'm2z', ...(id === '自杀' ? [] : ['tw']), ...bank.map((_, j) => 'b' + j)], p = pool[Math.floor(Math.random() * pool.length)];
    qs.push(Object.assign(p[0] === 'b' ? JSON.parse(JSON.stringify(bank[+p.slice(1)])) : genQ(id, p), { _p: p, u: s.id }));
  });
  let tw = 0; qs.forEach((q, k) => { if (q.t === 'type') { tw++; if (tw > 3) qs[k] = Object.assign(genQ(q.w[0], 'z2m'), { _p: 'z2m', u: q.u }); } });
  ensureBoth(qs);
  for (let n = 1; n < qs.length; n++) if (qs[n].t === qs[n - 1].t) { const m = qs.findIndex((q, j) => j > n && q.t !== qs[n - 1].t && (j + 1 >= qs.length || q.t !== qs[j + 1].t)); if (m > 0) [qs[n], qs[m]] = [qs[m], qs[n]]; }
  const tfs = shuffle(TESTBANK.tf.slice()).slice(0, 3), sps = shuffle(TESTBANK.spot.slice()).slice(0, 2), out = [];
  qs.forEach((q, i) => { out.push(q); if (i === 2) out.push(tfs[0]); if (i === 4) out.push(sps[0]); if (i === 6) out.push(tfs[1]); if (i === 8) out.push(sps[1]); if (i === 10) out.push(tfs[2]); });
  out.push({ t: 'wrap' });
  return out.map(q => JSON.parse(JSON.stringify(q)));
}
/* ---- wrap: end of a revision ---- */
function wrap(sc, pane, ep, gate, nb) {
  gate(true); nb.textContent = 'Xong ✓';
  const keys = Object.keys(st.res).filter(k => k.startsWith(sid + ':')), ok = keys.filter(k => st.res[k]).length;
  const miss = Object.keys((st.rv || {}).miss || {}), S = SESSIONS.find(x => x.id === sid);
  if (S.test) {
    const n = S.screens.length - 1, r = n ? ok / n : 0, weakU = [...new Set(S.screens.map((q, i) => (q.u && st.res[sid + ':' + i] === 0) ? q.u : 0).filter(Boolean))].sort((a, b) => a - b);
    st.test = { last: ok, n, best: Math.max(ok, (st.test && st.test.best) || 0), at: Date.now() }; save();
    const msg = r >= .88 ? 'Rất vững! Bạn nhớ và dùng được hầu hết số từ này.' : r >= .65 ? 'Khá tốt. Còn vài chỗ cần nhìn lại, mình liệt kê bên dưới.' : 'Còn nhiều từ chưa chắc. Không sao: ôn lại các từ bên dưới rồi làm lại bài kiểm tra.';
    pane.insertAdjacentHTML('beforeend', art('cup') + `<div class="h2">Kết quả kiểm tra</div><div class="bigq" style="padding:0">${ok}/${n}</div><p class="prompt" style="margin:0;font-weight:500">${msg}</p>`);
    if (weakU.length) pane.insertAdjacentHTML('beforeend', `<p class="vi" style="margin:0">Nên xem lại: ${weakU.map(u => 'tập ' + u).join(', ')}.</p>`);
    if (miss.length) {
      pane.insertAdjacentHTML('beforeend', `<div class="h2">Những từ nên nhìn lại</div>`);
      const stk = h('div', 'stk'); miss.forEach(id => { const b = h('button', 'sticker', `<div class="s1"${szs(id)}>${zh(id)}</div><div class="s2">${MEAN[id] || ''}</div>`); b.onclick = () => speak(id); stk.appendChild(b); }); pane.appendChild(stk);
      const go = h('button', 'ghost on', 'Ôn ngay những từ này'); go.onclick = () => { REV.fixed = miss.slice(); play(REV.id); }; pane.appendChild(go);
      pane.insertAdjacentHTML('beforeend', `<p class="vi" style="margin:0">Những từ này cũng đã được xếp vào “Ôn tập tổng hợp” để ôn lại ngày mai.</p>`);
    } else pane.insertAdjacentHTML('beforeend', `<p class="vi" style="margin:0">Không sót từ nào. Giỏi lắm!</p>`);
    return;
  }
  pane.insertAdjacentHTML('beforeend', art('cup') + `<div class="h2">Ôn xong rồi!</div><p class="prompt" style="margin:0">Đúng ngay lần đầu: <b>${ok}/${keys.length}</b> câu</p>`);
  const show = (title, list, sub) => { pane.insertAdjacentHTML('beforeend', `<div class="h2">${title}</div>`); const stk = h('div', 'stk'); list.forEach(id => { const s = h('button', 'sticker', `<div class="s1"${szs(id)}>${zh(id)}</div><div class="s2">${sub(id)}</div>`); s.onclick = () => speak(id); stk.appendChild(s); }); pane.appendChild(stk); };
  if (miss.length) show('Những từ nên nhìn lại', miss, id => MEAN[id] || '');
  else pane.insertAdjacentHTML('beforeend', `<p class="vi" style="margin:0">Không sót từ nào. Giỏi lắm!</p>`);
  const looks = Object.entries(st.look).filter(([k, n]) => DICT[k] && k.length >= 2 && n >= 2).sort((x, y) => y[1] - x[1]).slice(0, 5).map(x => x[0]);
  if (looks.length) show('Từ bạn hay chạm để tra', looks, id => DICT[id][1].split(/[;,(]/)[0].slice(0, 16));
}

/* ---- end of a session: stickers, sentences to take away, teaser ---- */
function album(sc, pane, ep, gate, nb) {
  gate(true); nb.textContent = sid === LAST() ? 'Hoàn thành Bài 1 ✓' : 'Xong tập ' + sid + ' ✓';
  pane.insertAdjacentHTML('beforeend', `<div class="h2">Bạn vừa nhận được</div>`);
  const stk = h('div', 'stk');
  sc.words.forEach(id => { stk.appendChild(h('div', 'sticker', `<div class="s1"${szs(id)}>${zh(id)}</div><div class="s2">${W[id].vi.split(/[;(]/)[0]}</div>`)); });
  pane.appendChild(stk);
  if (sc.finale) {
    pane.insertAdjacentHTML('beforeend', `<div class="h2">${sc.finale.h || ''}</div>` + art(sc.finale.scene));
    sc.finale.lines.forEach(l => { const d = h('div', 'ln nar'); d.innerHTML = `${whoH(l)}<div class="zh">${zh(l.zh)}</div><div class="lr"><button class="sb">🔊</button><button class="tr">Dịch</button></div><div class="vi" hidden>${pyDiv(l.zh)}<div>${l.vi}</div></div>`; $('.sb', d).onclick = () => vox(l.zh, l.v); const vi = $('.vi', d), tr = $('.tr', d); wireRec(d, l.zh); tr.onclick = () => { vi.hidden = !vi.hidden; tr.textContent = vi.hidden ? 'Dịch' : 'Ẩn dịch'; }; pane.appendChild(d); });
  }
  const more = h('div', 'row'), box = h('div', ''); box.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  const sec = (label, build) => { const p = h('div', ''); p.style.cssText = 'display:none;flex-direction:column;gap:10px'; build(p); const b = h('button', 'ghost', label); b.onclick = () => { const on = p.style.display === 'none'; p.style.display = on ? 'flex' : 'none'; b.classList.toggle('on', on); }; more.appendChild(b); box.appendChild(p); };
  if (sc.say) sec('Xem lại câu', p => sc.say.forEach(x => { const d = h('div', 'say', `<div class="exz">${zh(x.zh)}</div>`); const b = h('button', 'spk', '🔊'); b.onclick = () => speak(x.zh, false, true); d.appendChild(b); d.appendChild(h('div', 'pyl', pyL(x.zh))); d.appendChild(h('div', 'vi', x.vi)); p.appendChild(d); }));
  if (sc.book) sec('Đọc trong sách', p => p.insertAdjacentHTML('beforeend', `<div class="new">${zh(sc.book)}</div>`));
  if (more.children.length) { pane.appendChild(more); pane.appendChild(box); }
  if (sc.recall && st.pred[sc.recall]) { const p = st.pred[sc.recall]; pane.insertAdjacentHTML('beforeend', `<p class="vi" style="margin:4px 0 0">Lúc nãy bạn đoán: “${p.t}”. ${p.ok ? '<b>Đoán trúng rồi!</b>' : 'Chưa trúng, nhưng đoán vậy là hợp lý.'}</p>`); }
  if (sc.tease) pane.insertAdjacentHTML('beforeend', `<p class="vi" style="margin:4px 0 0">${sc.tease.done ? '' : '<b>Tập sau:</b> '}${sc.tease.vi}</p>`);
  if (st.auto && sc.finale) setTimeout(() => chain(sc.finale.lines, ep), 900);
}

initSheet();
setPy(st.py);
home();
if (ACC.code) pullNow();
checkUpdate(true);
</script>
